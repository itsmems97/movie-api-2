<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquid Glass Phone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--surround:#f1e6f4;--sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);--ease:cubic-bezier(.32,.72,0,1)}
@media (prefers-color-scheme:dark){:root{--surround:#120a18}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0}
body{background:var(--surround);display:grid;place-items:center;font-family:-apple-system,"SF Pro Text","Inter",system-ui,Roboto,sans-serif;color:#fff;overflow:hidden}
/* Always true full screen, edge-to-edge, no bezel/border/wallpaper showing through — 4" mobile through 32" TV alike */
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:#6b2d86;border-radius:0;box-shadow:none;isolation:isolate;transform:translateZ(0)}
.wall{position:absolute;inset:0;background:linear-gradient(160deg,#f7a07a 0%,#e9559f 38%,#a057d6 72%,#6d3fb5 100%);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.75;animation:drift 18s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:#ffd0a8;top:-60px;left:-70px}
.b2{width:300px;height:300px;background:#ff5fb0;top:46%;left:-110px;animation-delay:-6s}
.b3{width:280px;height:280px;background:#7a5cff;bottom:-90px;right:-80px;animation-delay:-11s}
.b4{width:200px;height:200px;background:#ffe3f0;top:25%;right:-60px;animation-delay:-3s;opacity:.5}
@keyframes drift{to{transform:translate(50px,-40px) scale(1.15)}}
.home{position:absolute;inset:0;padding:calc(var(--sa-t) + 54px) 22px 0;transition:transform .6s var(--ease),filter .6s var(--ease),opacity .5s;will-change:transform}
.home.away{transform:scale(.9);filter:blur(16px) brightness(.8);opacity:.75}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.10));border:1px solid rgba(255,255,255,.42);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 -8px 16px rgba(255,255,255,.06),0 10px 30px rgba(70,10,90,.22)}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wd{aspect-ratio:1;container-type:size;border-radius:30px;padding:14px;position:relative;font-weight:500;line-height:1.1;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.wd small{font-size:10cqw;display:block;margin-bottom:3cqw}
.wd .big{font-size:21cqw;font-weight:600}
.wd .yr{font-size:11cqw;margin-top:1cqw}
.wd .day{color:#ff4d5e;font-size:12cqw;font-weight:600}
.wd .tm{font-size:23cqw;font-weight:600;margin-top:1cqw}
.city{font-size:10cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cond{font-size:11cqw;margin-top:4cqw}
.wb{display:flex;justify-content:space-between;align-items:flex-end}
.deg{font-size:30cqw;font-weight:600;line-height:1}
.wi{width:38cqw;height:38cqw}
.wi svg{width:100%;height:100%;filter:drop-shadow(0 4px 8px rgba(60,0,80,.25))}
.retry{font-size:9cqw;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;margin-top:26px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;color:#fff;font:inherit;font-size:12px;padding:0;cursor:pointer;touch-action:manipulation}
.tile{position:relative;width:64px;height:64px;border-radius:32px;display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.6,.5,1),filter .2s;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,var(--a),var(--b));opacity:.5}
.tile::after{content:"";position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:18px 18px 40px 40px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0))}
.tile svg{position:relative;z-index:1;width:32px;height:32px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 4px rgba(60,0,80,.35))}
.app:active .tile,.dk:active .tile{transform:scale(.86);filter:brightness(1.15)}
.app span{text-shadow:0 1px 6px rgba(80,0,90,.35);font-weight:500}
.dockwrap{position:absolute;left:0;right:0;bottom:calc(var(--sa-b) + 16px);display:flex;justify-content:center;pointer-events:none;transition:transform .6s var(--ease),opacity .4s}
.dockwrap.away{transform:translateY(60px) scale(.9);opacity:0}
.dock{pointer-events:auto;display:flex;gap:16px;padding:12px 16px;border-radius:36px;align-items:flex-end}
.dk{background:none;border:0;padding:0;cursor:pointer;transform-origin:50% 100%;transform:translateY(calc((1 - var(--s,1))*28px)) scale(var(--s,1));transition:transform .18s ease-out;touch-action:manipulation}
.dk .tile{width:60px;height:60px;border-radius:30px}
/* app windows: one per app, kept alive in the layer so a minimized app resumes exactly where it was */
.winLayer{position:absolute;inset:0;pointer-events:none}
.win{position:absolute;inset:0;display:none;pointer-events:auto;z-index:5;overflow:hidden;will-change:clip-path,transform;transform-origin:50% 100%}
.win.show{display:block}
.tint{position:absolute;inset:0;background:linear-gradient(145deg,var(--a),var(--b));opacity:0;pointer-events:none;z-index:8}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .3s}
.win.ready .inner{opacity:1}
.hdr{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;min-height:calc(var(--sa-t) + 52px);padding:calc(var(--sa-t) + 2px) 14px 0;background:rgba(255,255,255,0.2);border-bottom:1px solid rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.hdrTitle{position:absolute;right:14px;left:auto;max-width:calc(50% - 82px);top:var(--sa-t);height:52px;line-height:52px;display:block;text-align:right;font-size:16px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.body{flex:1;min-height:0;padding:calc(var(--sa-t) + 62px) 18px 8px;display:flex;flex-direction:column;position:relative}
.btn{border:0;font:inherit;color:#fff;cursor:pointer;transition:transform .12s,filter .15s;touch-action:manipulation}
.btn:active{transform:scale(.92);filter:brightness(1.3)}
.calc{display:flex;flex-direction:column;height:100%;gap:10px}
.disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:0 6px 6px;overflow:hidden}
.ex{font-size:22px;opacity:.7;min-height:28px;word-break:break-all;text-align:right}
.rs{font-size:56px;font-weight:600;line-height:1.1}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys .btn{height:62px;border-radius:31px;font-size:24px;font-weight:500;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}
.keys .op{background:rgba(255,160,210,.45)}.keys .eq{background:linear-gradient(145deg,#ff9ccd,#c36bff)}.keys .z{grid-column:span 2}
textarea,.in{width:100%;border-radius:22px;padding:16px;font:inherit;font-size:18px;color:#fff;outline:none;resize:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);user-select:text;-webkit-user-select:text}
textarea{flex:1}
::placeholder{color:rgba(255,255,255,.6)}
.meta{font-size:13px;opacity:.7;padding:8px 6px 0}
.sw{font-size:62px;font-weight:600;text-align:center;margin:20px 0 4px;font-variant-numeric:tabular-nums}
.sw small{font-size:32px;opacity:.7}
.row{display:flex;gap:14px;justify-content:center;margin:10px 0 16px}
.round{width:86px;height:86px;border-radius:50%;font-size:17px;font-weight:600;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35)}
.go{background:rgba(120,255,190,.35)}.stop{background:rgba(255,100,120,.45)}
.laps{overflow:auto;flex:1;font-variant-numeric:tabular-nums}
.laps div{display:flex;justify-content:space-between;padding:11px 8px;border-top:1px solid rgba(255,255,255,.2);font-size:17px}
canvas{touch-action:none;display:block}
.sk{flex:1;border-radius:24px;background:rgba(255,255,255,.92);width:100%;min-height:0}
.pal{display:flex;gap:12px;justify-content:center;padding:12px 0 4px;align-items:center}
.pal button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.8);cursor:pointer;transition:transform .15s}
.pal button.on{transform:scale(1.28);border-color:#fff}
.pal .btn{width:auto;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.2);height:auto}
.snk{margin:0 auto;border-radius:22px;width:min(100%,340px);aspect-ratio:1;background:rgba(30,0,50,.45);border:1px solid rgba(255,255,255,.3)}
.sc{text-align:center;font-size:18px;margin:2px 0 12px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin-top:14px}
.pad .btn{border-radius:18px;background:rgba(255,255,255,.18);font-size:22px;border:1px solid rgba(255,255,255,.3)}
.pad .u{grid-column:2}
.todo{display:flex;gap:10px;margin-bottom:12px}
.todo .btn{width:56px;border-radius:20px;font-size:26px;background:linear-gradient(145deg,#ff9ccd,#c36bff)}
.list{overflow:auto;flex:1}
.item{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:9px;border-radius:20px;font-size:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.item.done span{text-decoration:line-through;opacity:.55}
.item span{flex:1;word-break:break-word}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:none;padding:0;flex:none;cursor:pointer}
.done .chk{background:#7dffc0;border-color:#7dffc0}
.x{background:none;border:0;color:#fff;font-size:22px;opacity:.7;cursor:pointer}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
.tile.img{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 8px 18px rgba(60,10,80,.3)}
.tile.img::before,.tile.img::after{display:none}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none}
.home{display:flex;flex-direction:column}
.widgets{flex:none}
.grid{flex:1;min-height:0;overflow-y:auto;padding-bottom:130px;align-content:start;scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.win.web .body{padding:0 !important;background:transparent;position:absolute;top:calc(var(--sa-t) + 52px);bottom:0;left:0;right:0;display:block}
.wf{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .35s;display:block;margin:0;padding:0}
.wf.on{opacity:1}
.wload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .35s}
.wload img{width:96px;height:96px;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:pulse 1.4s ease-in-out infinite}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
.wopen{position:absolute;z-index:3;left:68px;top:calc(var(--sa-t) + 14px);width:26px;height:26px;border-radius:50%;display:none;place-items:center;color:#fff;text-decoration:none;font-size:15px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35)}
.win.web.slow .wopen{display:grid}
.body{padding-bottom:calc(var(--sa-b) + 18px)}
.tlights{display:flex;gap:10px;flex:none}
.tl{width:17px;height:17px;border-radius:50%;padding:0;border:0;cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15);transition:transform .12s}
.tl:active{transform:scale(.82)}
.tl svg{width:9px;height:9px;opacity:.9;stroke:#4d0f0f;stroke-width:2.6;stroke-linecap:round;fill:none}
.tl.red{background:#ff5f57}
.tl.yellow{background:#febc2e}
.tl.yellow svg{stroke:#5c3d00}
.islandWrap{position:absolute;left:0;right:0;top:calc(var(--sa-t) + 9px);display:flex;justify-content:center;align-items:flex-start;z-index:9999;pointer-events:none;transition:transform .6s var(--ease),opacity .4s}
.islandWrap.away{opacity:0;transform:translateY(-12px)}
  .island .ic{width:24px;height:24px;border-radius:8px;overflow:hidden;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5)}
.island .ic img{width:100%;height:100%;object-fit:cover}
.island .ic.stack{margin-left:-14px}
.island .lbl{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .islandRow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px}
.islandRow:active{background:rgba(255,255,255,.12)}
.islandRow span{font-size:14px;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.islandX{background:rgba(255,255,255,.2);border:0;color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:16px;cursor:pointer;flex:none;margin-left:auto;padding:0;line-height:1}
.islandX:active{background:rgba(255,255,255,.4)}
.launch{position:absolute;display:none;object-fit:cover;opacity:0;pointer-events:none;z-index:9;left:0;top:0}
.wbg{position:absolute;inset:0;background:linear-gradient(rgba(35,15,55,.30),rgba(35,15,55,.30)),linear-gradient(160deg,#f7a07a 0%,#e9559f 38%,#a057d6 72%,#6d3fb5 100%)}
.dock.nt .dk{transition:none}
.boot{position:absolute;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease}
.boot.hide{opacity:0;pointer-events:none}
.bootMark{width:74px;height:74px;border-radius:21px;background:linear-gradient(145deg,#a057d6,#6d3fb5);display:grid;place-items:center;animation:bootPulse 1.6s ease-in-out infinite;box-shadow:0 0 44px rgba(160,90,220,.55)}
.bootMark svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes bootPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}
.bootBar{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.bootBar i{display:block;height:100%;width:40%;background:#fff;border-radius:4px;animation:bootLoad 1.4s ease-in-out infinite}
@keyframes bootLoad{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.toast{position:absolute;bottom:180px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,20,45,0.85);color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;z-index:100;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== realistic + no-flicker overrides ===== */
.blob{filter:none;animation:none}
.b1{background:radial-gradient(circle,#ffd0a8 0%,rgba(255,208,168,0) 68%)}
.b2{background:radial-gradient(circle,#ff5fb0 0%,rgba(255,95,176,0) 68%)}
.b3{background:radial-gradient(circle,#7a5cff 0%,rgba(122,92,255,0) 68%)}
.b4{background:radial-gradient(circle,#ffe3f0 0%,rgba(255,227,240,0) 68%)}
.home{transition:transform .6s var(--ease),opacity .5s}
.home.away{transform:scale(.92);filter:none;opacity:.6}
.inner,.win.ready .inner{opacity:1;transition:none}
.tile,.dk .tile{border-radius:22.4%}
.tile.img{box-shadow:0 2px 6px rgba(0,0,0,.18)}
.app{font-size:11.5px;gap:6px}
.app span{text-shadow:0 1px 3px rgba(0,0,0,.3)}
.wd.glass{background:rgba(255,255,255,.8);color:#1c1c1e;border:0;border-radius:24px;backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 4px 14px rgba(40,10,60,.15)}
.dock.glass{background:rgba(255,255,255,.28);border:.5px solid rgba(255,255,255,.35);box-shadow:none;backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);gap:18px;padding:11px 14px}
.dockwrap{flex-direction:column;align-items:center;gap:14px}
.srch{display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:20px;background:rgba(255,255,255,.28);font-size:13px;font-weight:500;color:#fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.srch svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.island .c{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 14px 0 5px;animation:icIn .35s .15s both}
.island .c.still{animation:none}
.island.expanded .c{flex-direction:column;align-items:stretch;gap:2px;padding:8px}
.island .islandRow{height:42px;padding:0 8px}
@keyframes icIn{from{opacity:0;transform:scale(.92)}}
.bootLogo{display:flex;flex-direction:column;align-items:center;animation:logoIn 1.1s ease both}
.bootLogo svg{width:128px;height:128px;overflow:visible}
@keyframes logoIn{from{opacity:0;transform:scale(.88)}}
.film{fill:none;stroke:rgba(255,255,255,.35);stroke-width:5;stroke-dasharray:2.4 3.6;transform-origin:60px 60px;animation:reel 14s linear infinite}
@keyframes reel{to{transform:rotate(360deg)}}
.rg{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:100 100;transform:rotate(-90deg);transform-origin:60px 60px;animation:ringDraw 1.7s cubic-bezier(.3,.7,.2,1) both}
.r1{stroke:#fa114f;--e:8;animation-delay:.35s}.r2{stroke:#a6ff00;--e:20;animation-delay:.55s}.r3{stroke:#00d4ff;--e:30;animation-delay:.75s}
@keyframes ringDraw{0%{stroke-dashoffset:100;opacity:0}6%{opacity:1}100%{stroke-dashoffset:var(--e);opacity:1}}
.play{fill:#fff;stroke:#fff;stroke-width:5;stroke-linejoin:round;filter:drop-shadow(0 0 7px rgba(255,255,255,.75));transform-origin:62px 60px;animation:playIn .8s 1.1s cubic-bezier(.3,1.4,.5,1) both,glow 2.4s 2s ease-in-out infinite}
@keyframes playIn{from{opacity:0;transform:scale(.4)}}
@keyframes glow{50%{filter:drop-shadow(0 0 14px rgba(255,255,255,.95))}}
.bootName{margin-top:30px;font-size:15px;font-weight:600;letter-spacing:.55em;text-indent:.55em;text-transform:uppercase;background:linear-gradient(100deg,#6b6b73 35%,#fff 50%,#6b6b73 65%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 2.6s .9s ease-in-out both}
@keyframes sheen{from{background-position:120% 0;opacity:0}20%{opacity:1}to{background-position:-20% 0;opacity:1}}
.bootBar{width:150px;height:4px}
.bootBar i{width:100%;transform:scaleX(0);transform-origin:left;animation:barFill 2.9s .3s cubic-bezier(.45,.1,.35,1) forwards}
@keyframes barFill{to{transform:scaleX(1)}}
.bootHint{position:absolute;bottom:5%;font-size:12px;color:rgba(255,255,255,.4);opacity:0;transition:opacity .5s}.bootHint.on{opacity:1}
.sd{position:absolute;inset:0;z-index:200;background:#000;opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;transition:opacity .9s ease}
.sd.on{opacity:1;pointer-events:auto}
.sdSpin{width:30px;height:30px;border:2.5px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;opacity:0;animation:spin .9s linear infinite;transition:opacity .4s .5s}
.sd.on .sdSpin{opacity:1}.sd.done .sdSpin{opacity:0;transition:opacity .3s}
.island{position:relative;flex:none;width:min(350px,calc(100% - 24px));height:520px;pointer-events:none}
.gl{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.1));backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);clip-path:inset(0 105px 486px 105px round 17px);transition:clip-path .55s var(--ease),opacity .3s}
.rim{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:17px;box-sizing:border-box;border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),0 8px 22px rgba(40,0,60,.4);overflow:hidden;pointer-events:auto;cursor:pointer;transition:width .55s var(--ease),height .55s var(--ease),border-radius .55s var(--ease),opacity .3s}
#cc{position:absolute;inset:0}
.island.off .gl,.island.off .rim{opacity:0;pointer-events:none}
.island .ic{width:26px;height:26px;border-radius:22.4%;border:0;background:rgba(255,255,255,.18)}

.island .ic{border-radius:44%}

.launch{border-radius: 40% !important}
.island .islandRow{flex:none}
.island .islandClear{flex:none;height:40px;border:0;border-radius:20px;background:rgba(255,255,255,.22);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.island .islandClear:active{background:rgba(255,255,255,.36)}
.scrim{position:absolute;inset:0;z-index:9998;display:none;touch-action:none}.scrim.on{display:block}
@keyframes vanish{to{opacity:0;transform:scale(.55) translateY(-10px)}}
/* ---- performance pass: same animations, far less GPU work ---- */
*:not(.gl){backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.gl{backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5)}
.rim{box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),0 4px 12px rgba(40,0,60,.35)}
.win{will-change:auto}
html,body,.phone,.wall,.win{overflow:clip!important}
.win.anim{will-change:clip-path,transform}
.win.anim .wf,.win.anim .wf.on{opacity:0;visibility:hidden;transition:none}
.win.web .body{bottom:var(--sa-b)}

@media (min-width:501px){
  .home{left:50%;right:auto;width:min(420px,calc(100% - 44px));transform:translateX(-50%)}

  .dockwrap{left:50%;right:auto;width:min(420px,calc(100% - 44px));transform:translateX(-50%)}
  .dockwrap.away{transform:translateX(-50%) translateY(60px) scale(.9)}
}

/* ---------- app windows: one persistent node per app, so a minimized app stays exactly as it was ---------- */
const winLayer=$('#winLayer'),home=$('#home'),dw=$('#dockwrap'),phone=$('#phone'),tint=$('#tint'),islandWrap=$('#islandWrap'),island=$('#island');
const EASE='cubic-bezier(.32,.72,0,1)';
let cur=null,busy=false,anims=[],box=null,minimizedList=[],islandExpanded=false,zIdx=10;
let exitCounter=0, exitTimeout=null;

function pushH(st,_t,u){try{history.pushState(st,"",u)}catch(e){try{history.pushState(st,"")}catch(e2){}}}
// Page load par ek dummy history state save karein taake back button pakda ja sake
pushH({ iWatchHome: true }, '', location.pathname);
let _arm=0;addEventListener('pointerdown',()=>{if(_arm++)return;pushH({iWatchHome:true},'',location.pathname);pushH({iWatchHome:true},'',location.pathname)},{passive:true});

window.addEventListener('popstate', (e) => {
    if (down) return; if (busy) { pushH({ iWatchHome: true }, '', location.pathname); return; } // Agar animation chal rahi hai toh ignore karo

    if (cur) {
        // App khuli hai -> Back dabane par MINIMIZE karo (close nahi)
        pushH({ iWatchHome: true }, '', location.pathname); closeWin(cur, true, true); // Teesra argument 'true' matlab yeh back button se aaya hai
    } else {
        // Home screen par hain
        if (exitCounter === 1) {
            // Dusri baar back dabaya -> Exit hone do
            shutdown();
        } else {
            // Pehli baar back dabaya -> Toast dikhao aur exit roko
            exitCounter = 1;
            const t = document.getElementById('toast');
            if(t) t.classList.add('show');
            
            clearTimeout(exitTimeout);
            exitTimeout = setTimeout(() => {
                exitCounter = 0;
                if(t) t.classList.remove('show');
            }, 2000); // 2 second baad reset ho jayega
            
            // Exit ko block karne ke liye state wapis push karo
            pushH({ iWatchHome: true }, '', location.pathname);
        }
    }
});
const winMap=new Map();
const phoneRad=()=>parseFloat(getComputedStyle(phone).borderTopLeftRadius)||0;
const fullClip=()=>`inset(0px 0px 0px 0px round ${Math.max(phoneRad(),48)}px)`;
function islandBox(){const p=phone.getBoundingClientRect(),r=rim.getBoundingClientRect();return{l:r.left-p.left,t:r.top-p.top,w:r.width,h:r.height,pw:p.width,ph:p.height,r:Math.min(r.height/2,28),island:true}}
function measure(el){const dk=el.closest('.dk');if(dk){dock.classList.add('nt');unmag();void dock.offsetWidth}
 const r=el.getBoundingClientRect(),p=phone.getBoundingClientRect();if(dk)dock.classList.remove('nt');
 return{l:r.left-p.left,t:r.top-p.top,w:r.width,h:r.height,pw:p.width,ph:p.height,r:r.width*.4}}
function iconClip(){return `inset(${box.t}px ${box.pw-box.l-box.w}px ${box.ph-box.t-box.h}px ${box.l}px round ${box.r}px)`}
const run=(el,kf,ms)=>{const a=el.animate(kf,{duration:ms,easing:EASE,fill:'forwards'});anims.push(a);return a};
function launchAnim(open,a){const L=$('#launch');if(box.island){L.style.display='none';return}
 if(!a.img){L.style.display='none';run(tint,open?[{opacity:.95},{opacity:0}]:[{opacity:0},{opacity:.95}],520);return}
 const ic={left:box.l+'px',top:box.t+'px',width:box.w+'px',height:box.h+'px'},fu={left:'0px',top:'0px',width:box.pw+'px',height:box.ph+'px'};
 L.src=a.img.src;L.style.display='block';
 run(L,open?[{...ic,opacity:1,offset:0},{opacity:1,offset:.25},{...fu,opacity:0,offset:1}]:[{...fu,opacity:0,offset:0},{opacity:0,offset:.35},{...ic,opacity:1,offset:1}],open?560:520)}
function getWin(a){
 if(winMap.has(a))return winMap.get(a);
 const el=document.createElement('div');
 el.className='win'+(a.url?' web':'');
 el.style.setProperty('--a',a.a);el.style.setProperty('--b',a.b);
 el.innerHTML=`<div class="wbg"></div><div class="inner"><div class="hdr"><div class="tlights"><button class="tl red" aria-label="Close app"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button class="tl yellow" aria-label="Minimize app"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button></div><div class="hdrTitle"></div><a class="wopen" target="_blank" rel="noopener" aria-label="Open in browser">↗</a></div><div class="body"></div></div>`;
 el.querySelector('.hdrTitle').textContent=a.n;
 winLayer.appendChild(el);
 const body=el.querySelector('.body');
 const cleanup=(a.url?webAppInto(a,el,body):a.f(body))||null;
 const rec={el,body,cleanup,srcTile:null};
 el.querySelector('.tl.red').onclick=e=>{e.stopPropagation();closeWin(a,false)};
 el.querySelector('.tl.yellow').onclick=e=>{e.stopPropagation();closeWin(a,true)};

 return rec;
}
function showWin(a,srcTile,fromIsland){
 if(cur||busy)return;
 if(minimizedList.some(x=>x.a===a)){minimizedList=minimizedList.filter(x=>x.a!==a);islandExpanded=false;renderIsland()}
 busy=true;cur=a;playOpen();
 
 // App open hote hi history mein state save hogi
 /* app open: no history entry pushed (it clashed with the app's own history) */
 
 const rec=getWin(a);rec.srcTile=srcTile;box=fromIsland?islandBox():measure(srcTile);rec.box=box;
 const el=rec.el;
 el.classList.remove('ready','slow');el.classList.add('show','anim');
 el.style.zIndex=++zIdx;
 updateIslandVisibility();
 const from=iconClip();
 const w=run(el,[{clipPath:from,transform:'scale(1)'},{clipPath:fullClip(),transform:'scale(1)'}],560);
 launchAnim(true,a);if(!fromIsland)srcTile.style.visibility='hidden';
 run(el.querySelector('.inner'),[{transform:'scale(.9)'},{transform:'scale(1)'}],560);
 home.classList.add('away');dw.classList.add('away');
 setTimeout(()=>el.classList.add('ready'),200);
 w.onfinish=()=>{anims.forEach(x=>x.cancel());anims=[];busy=false;el.classList.remove('anim')}}
function closeWin(a,toMinimize,fromPopstate = false,after){
 if(cur!==a||busy)return;
 busy=true;playWin(toMinimize);
 
 // Agar user ne UI (Red/Yellow button) se band kiya hai, toh history back karo
 if(!fromPopstate){
   /* no history.back() here: it would also pop the app's own page history */
 }
 
 const rec=winMap.get(a),el=rec.el,srcTile=rec.srcTile;box=rec.box||box;
 if(toMinimize){minimizedList=minimizedList.filter(x=>x.a!==a);minimizedList.push({a});islandExpanded=false;renderIsland();
  const p=phone.getBoundingClientRect(),rr=rim.getBoundingClientRect();
  box={l:(p.width-_iw)/2,t:rr.top-p.top,w:_iw,h:_ih,pw:p.width,ph:p.height,r:_ih/2,island:true};srcTile.style.visibility=''}
 anims.forEach(x=>x.cancel());anims=[];
 el.classList.remove('ready');el.classList.add('anim');
 const w=run(el,[{clipPath:fullClip(),transform:'none'},{clipPath:iconClip(),transform:'scale(1)'}],toMinimize?600:520);
 launchAnim(false,a);
 run(el.querySelector('.inner'),[{transform:'scale(1)'},{transform:'scale(.9)'}],520);
 home.classList.remove('away');dw.classList.remove('away');
 
 w.onfinish=()=>{
   anims.forEach(x=>x.cancel());anims=[];
   srcTile.style.visibility='';el.classList.remove('show','slow','anim');el.style.cssText='';
   cur=null;busy=false;updateIslandVisibility();
   
   if(toMinimize){
     /* island already updated when minimize started */
   }else{
     if(rec.cleanup)rec.cleanup();
     el.remove();winMap.delete(a);
     minimizedList=minimizedList.filter(x=>x.a!==a);renderIsland();
   }
   if(after)after();
 }
}
function openOrRestore(it,tileEl){if(it.link){window.open(it.link,'_blank','noopener');return}showWin(it,tileEl)}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)closeWin(cur,false)});

/* ---------- Dynamic Island: only visible on the home screen, parks minimized apps ---------- */
function updateIslandVisibility(){}
addEventListener('blur',()=>{if(islandExpanded){islandExpanded=false;renderIsland()}});
function resume(m){if(busy)return;if(cur){const c=cur;closeWin(c,true,false,()=>resume(m));return}showWin(m.a,winMap.get(m.a).srcTile,true)}

document.addEventListener('click', e => {
  if (islandExpanded && !island.contains(e.target)) {
    islandExpanded = false;
    renderIsland();
  }
});

let _im='',_lp=0,_lpT=0,_iw=126,_ih=36,_clr=false;const gl=$('#gl'),rim=$('#rim'),cc=$('#cc');
function renderIsland(){
 const n=minimizedList.length,ex=n>0&&islandExpanded,W=island.offsetWidth||330,H=island.offsetHeight||520;let w=126,h=36,r=18,html='',mode=ex?'x':n>1?'s':String(n);
 const ic=(m,c)=>{const a=m.a;return `<span class="ic${c||''}"${a.img?'':` style="background:linear-gradient(145deg,${a.a},${a.b})"`}>${a.img?`<img src="${a.img.src}" alt="">`:(ICON[a.id]?`<svg viewBox="0 0 24 24">${ICON[a.id]}</svg>`:'')}</span>`};
 if(n<1)islandExpanded=false;
 if(n===1&&!ex){w=0;html=ic(minimizedList[0])+'<span class="lbl"></span>'}
 else if(n>1&&!ex){w=0;html=minimizedList.slice(0,3).map((m,i)=>ic(m,i?' stack':'')).join('')+`<span class="lbl">${n} apps</span>`}
 else if(ex){w=W;h=58+n*62;r=Math.min(44,h/2);html=minimizedList.map((m,i)=>`<div class="islandRow" data-i="${i}">${ic(m)}<span></span><button class="islandX" data-i="${i}" aria-label="Close app">×</button></div>`).join('')+'<button class="islandClear">Clear All</button>'}
 island.classList.toggle('expanded',ex);island.classList.toggle('off',n===0);
 const sc=$('#scrim');sc.classList.toggle('on',ex);sc.onpointerdown=ex?e=>{e.preventDefault();islandExpanded=false;renderIsland()}:null;
 cc.innerHTML=html?`<div class="c${mode===_im?' still':''}">${html}</div>`:'';_im=mode;
 if(!w)w=n&&cc.firstChild?Math.min(190,Math.max(126,Math.ceil(cc.firstChild.offsetWidth)+2)):126;
 _iw=w;_ih=h;const sd=(W-w)/2;
 gl.style.clipPath=`inset(0px ${sd}px ${H-h}px ${sd}px round ${r}px)`;
 rim.style.width=w+'px';rim.style.height=h+'px';rim.style.borderRadius=r+'px';
 rim.onclick=rim.onpointerdown=rim.onpointerup=rim.onpointercancel=rim.onpointerleave=null;
 if(n===1&&!ex){const m=minimizedList[0];rim.querySelector('.lbl').textContent=m.a.n;rim.onclick=e=>{e.stopPropagation();islandExpanded=true;renderIsland()}}
 else if(n>1&&!ex)rim.onclick=e=>{e.stopPropagation();islandExpanded=true;renderIsland()};
 else if(ex){
  rim.onclick=()=>{islandExpanded=false;renderIsland()};
  rim.querySelectorAll('.islandRow span:nth-child(2)').forEach((x,i)=>x.textContent=minimizedList[i].a.n);
  rim.querySelectorAll('.islandRow').forEach(rw=>rw.onclick=e=>{e.stopPropagation();if(Date.now()-_lp<700||_clr)return;resume(minimizedList[+rw.dataset.i])});
  rim.querySelectorAll('.islandX').forEach(btn=>btn.onclick=e=>{e.stopPropagation();playWin(false);const idx=+btn.dataset.i,it=minimizedList[idx].a,rec=winMap.get(it);
   if(rec){if(rec.cleanup)rec.cleanup();rec.el.remove();winMap.delete(it)}
   minimizedList.splice(idx,1);renderIsland()});
  rim.querySelector('.islandClear').onclick=e=>{e.stopPropagation();if(_clr)return;_clr=true;playClear();
   const rows=[...rim.querySelectorAll('.islandRow')];
   rows.forEach((r,i)=>{r.style.animation=`vanish .38s ${i*80}ms cubic-bezier(.5,0,.8,.4) both`});
   rim.querySelector('.islandClear').style.animation=`vanish .3s ${rows.length*80}ms ease-in both`;
   setTimeout(()=>{minimizedList.slice().forEach(m=>{const rec=winMap.get(m.a);if(rec){if(rec.cleanup)rec.cleanup();rec.el.remove();winMap.delete(m.a)}});minimizedList.length=0;islandExpanded=false;_clr=false;renderIsland()},rows.length*80+420)}
 }
}
renderIsland();
addEventListener('scroll',function(e){var t=e.target;if(t===document){scrollTo(0,0);return}if(t&&t.nodeType===1&&t.matches&&t.matches('html,body,.phone,.wall,.win,.inner,.body')){t.scrollTop=0;t.scrollLeft=0}},true);

/* ---------- web apps: each icon's backend URL runs full-screen inside its own window ---------- */
function webAppInto(a,winEl,body){const ob=winEl.querySelector('.wopen');
 body.innerHTML=`<div class="wload"><div class="spin"></div></div><iframe class="wf" allow="geolocation; camera; microphone; clipboard-write; fullscreen; autoplay"></iframe>`;
 if(a.img){const im=document.createElement('img');im.src=a.img.src;im.alt='';body.querySelector('.wload').prepend(im)}
 const f=body.querySelector('iframe'),ld=body.querySelector('.wload');f.title=a.n;
 f.onload=()=>{f.classList.add('on');ld.style.opacity=0;clearTimeout(t)};
 f.src=a.url;ob.href=a.url;
 const t=setTimeout(()=>winEl.classList.add('slow'),4000);
 return()=>{clearTimeout(t);f.src='about:blank';f.remove();body.innerHTML='';}}

/* ---------- apps ---------- */
function calcApp(el){
 el.innerHTML=`<div class="calc"><div class="disp"><div class="ex" id="ex"></div><div class="rs" id="rs">0</div></div><div class="keys" id="ks"></div></div>`;
 const K=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];let ex='';
 const calc=s=>{s=s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[\d+\-*/.() ]+$/.test(s))return null;try{const v=Function('"use strict";return('+s+')')();return isFinite(v)?+v.toPrecision(10):null}catch(e){return null}};
 const draw=()=>{$('#ex').textContent=ex;const v=calc(ex);$('#rs').textContent=ex===''?'0':(v===null?$('#rs').textContent:v)};
 K.forEach(k=>{const b=document.createElement('button');b.className='btn'+('÷×−+'.includes(k)?' op':'')+(k==='='?' eq':'')+(k==='0'?' z':'');b.textContent=k;
  b.onclick=()=>{if(k==='C')ex='';else if(k==='⌫')ex=ex.slice(0,-1);else if(k==='='){const v=calc(ex);if(v!==null)ex=String(v)}else{if('÷×−+'.includes(k)&&/[÷×−+]$/.test(ex))ex=ex.slice(0,-1);ex+=k}draw()};$('#ks').appendChild(b)});
}
function notesApp(el){
 el.innerHTML=`<textarea id="nt" placeholder="Write something…" spellcheck="false"></textarea><div class="meta" id="nm"></div>`;
 const t=$('#nt');t.value=store.get('lg_note','');const upd=()=>{$('#nm').textContent=t.value.length+' characters, saved on this device'};upd();
 t.oninput=()=>{store.set('lg_note',t.value);upd()};

function clockApp(el){
 el.innerHTML=`<div class="sw" id="sw"></div><div class="row"><button class="btn round" id="lp">Lap</button><button class="btn round go" id="ss">Start</button></div><div class="laps" id="lps"></div>`;
 let run=false,t0=0,acc=0,raf=0,laps=[];
 const now=()=>acc+(run?performance.now()-t0:0);
 const fmt=ms=>{const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,c=Math.floor(ms/10)%100;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}<small>.${String(c).padStart(2,'0')}</small>`};
 const show=()=>{$('#sw').innerHTML=fmt(now());if(run)raf=requestAnimationFrame(show)};show();
 $('#ss').onclick=function(){if(run){acc=now();run=false;cancelAnimationFrame(raf);this.textContent='Start';this.className='btn round go';$('#lp').textContent='Reset'}else{t0=performance.now();run=true;this.textContent='Stop';this.className='btn round stop';$('#lp').textContent='Lap';show()}};
 $('#lp').onclick=()=>{if(run){laps.unshift(now())}else{acc=0;laps=[];show()}$('#lps').innerHTML=laps.map((l,i)=>`<div><span>Lap ${laps.length-i}</span><span>${fmt(l).replace(/<\/?small>/g,'')}</span></div>`).join('')};
 return()=>cancelAnimationFrame(raf);
}
function sketchApp(el){
 el.innerHTML=`<canvas class="sk" id="cv"></canvas><div class="pal" id="pal"></div>`;
 const cv=$('#cv'),dpr=Math.min(devicePixelRatio||1,2);
 const g=cv.getContext('2d');let col='#7b2fbe',dr=false,lx=0,ly=0,ready=false;
 const fit=()=>{const r=cv.getBoundingClientRect();if(!r.width||ready)return;ready=true;cv.width=r.width*dpr;cv.height=r.height*dpr;g.scale(dpr,dpr);g.lineCap=g.lineJoin='round';g.lineWidth=5};
 requestAnimationFrame(fit);
 ['#7b2fbe','#f6416c','#ff9f43','#12a870','#4a7cf0','#222'].forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;if(!i)b.className='on';b.onclick=()=>{col=c;[...$('#pal').querySelectorAll('button')].forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('#pal').appendChild(b)});
 const cl=document.createElement('button');cl.className='btn';cl.textContent='Clear';cl.onclick=()=>g.clearRect(0,0,cv.width,cv.height);$('#pal').appendChild(cl);
 const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{fit();dr=true;[lx,ly]=pt(e);cv.setPointerCapture(e.pointerId);g.fillStyle=col;g.beginPath();g.arc(lx,ly,2.5,0,7);g.fill()};
 cv.onpointermove=e=>{if(!dr)return;const[x,y]=pt(e);g.strokeStyle=col;g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke();lx=x;ly=y};
 cv.onpointerup=cv.onpointercancel=()=>dr=false;
}
function snakeApp(el){
 el.innerHTML=`<div class="sc" id="sc">Score 0</div><canvas class="snk" id="sn" width="320" height="320"></canvas><div class="pad"><button class="btn u" data-d="U">▲</button><button class="btn" data-d="L" style="grid-row:2">◀</button><button class="btn" data-d="D" style="grid-row:2">▼</button><button class="btn" data-d="R" style="grid-row:2">▶</button></div>`;
 const cv=$('#sn'),g=cv.getContext('2d'),N=16,S=20;let sn,dir,nd,food,score,over,timer;
 const V={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
 const spawn=()=>{do{food=[Math.random()*N|0,Math.random()*N|0]}while(sn.some(s=>s[0]===food[0]&&s[1]===food[1]))};
 const reset=()=>{sn=[[8,8],[7,8],[6,8]];dir=nd='R';score=0;over=false;spawn();$('#sc').textContent='Score 0';draw()};
 const draw=()=>{g.clearRect(0,0,320,320);g.fillStyle='#ff7ac0';g.shadowColor='#ff7ac0';g.shadowBlur=14;g.beginPath();g.arc(food[0]*S+10,food[1]*S+10,7,0,7);g.fill();g.shadowBlur=0;
  sn.forEach((s,i)=>{g.fillStyle=i?'rgba(150,255,200,.85)':'#fff';g.beginPath();if(g.roundRect)g.roundRect(s[0]*S+1.5,s[1]*S+1.5,S-3,S-3,7);else g.rect(s[0]*S+1.5,s[1]*S+1.5,S-3,S-3);g.fill()});
  if(over){g.fillStyle='rgba(30,0,50,.6)';g.fillRect(0,0,320,320);g.fillStyle='#fff';g.font='600 26px system-ui';g.textAlign='center';g.fillText('Game over',160,150);g.font='18px system-ui';g.fillText('Tap to play again',160,182)}};
 const step=()=>{if(over)return;dir=nd;const h=[sn[0][0]+V[dir][0],sn[0][1]+V[dir][1]];
  if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(s=>s[0]===h[0]&&s[1]===h[1])){over=true;draw();return}
  sn.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){score++;$('#sc').textContent='Score '+score;spawn()}else sn.pop();draw()};
 const turn=d=>{const o={U:'D',D:'U',L:'R',R:'L'};if(d!==o[dir])nd=d};
 el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>turn(b.dataset.d));
 const kd=e=>{const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[e.key];if(m){turn(m);e.preventDefault()}};addEventListener('keydown',kd);
 let sx,sy2;
 cv.onpointerdown=e=>{sx=e.clientX;sy2=e.clientY;if(over)reset()};
 cv.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy2;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))};
 reset();timer=setInterval(step,130);
 return()=>{clearInterval(timer);removeEventListener('keydown',kd)};
}
function tasksApp(el){
 el.innerHTML=`<div class="todo"><input class="in" id="ti" placeholder="Add a task" maxlength="80"><button class="btn" id="ta" aria-label="Add task">+</button></div><div class="list" id="tl"></div>`;
 let L;try{L=JSON.parse(store.get('lg_tasks','null'))}catch(e){}L=L||[{t:'Try the dock magnification',d:false},{t:'Draw something in Sketch',d:false}];
 const save=()=>store.set('lg_tasks',JSON.stringify(L));
 const render=()=>{const box=$('#tl');box.innerHTML='';if(!L.length){box.innerHTML='<div class="meta">Nothing left. Add your next task above.</div>';return}
  L.forEach((x,i)=>{const d=document.createElement('div');d.className='item'+(x.d?' done':'');d.innerHTML='<button class="chk" aria-label="Toggle"></button><span></span><button class="x" aria-label="Delete">×</button>';d.querySelector('span').textContent=x.t;
   d.querySelector('.chk').onclick=()=>{x.d=!x.d;save();render()};d.querySelector('.x').onclick=()=>{L.splice(i,1);save();render()};box.appendChild(d)})};
 const add=()=>{const v=$('#ti').value.trim();if(!v)return;L.unshift({t:v,d:false});$('#ti').value='';save();render()};
 $('#ta').onclick=add;$('#ti').onkeydown=e=>{if(e.key==='Enter')add()};render();
}
