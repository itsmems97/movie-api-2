<style>
:root{--surround:#f1e6f4;--sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);--ease:cubic-bezier(.32,.72,0,1)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0}
html{background:#05030d}
body{background:var(--surround);display:grid;place-items:center;font-family:-apple-system,"SF Pro Text","Inter",system-ui,Roboto,sans-serif;color:#fff;overflow:hidden}
/* Always true full screen, edge-to-edge, no bezel/border/wallpaper showing through — 4" mobile through 32" TV alike */
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:#6b2d86;border-radius:0;box-shadow:none;isolation:isolate;transform:translateZ(0)}
.wall{position:absolute;inset:0;background:linear-gradient(160deg,#f7a07a 0%,#e9559f 38%,#a057d6 72%,#6d3fb5 100%);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.75;animation:drift 18s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:#ffd0a8;top:-60px;left:-70px}
.b2{width:300px;height:300px;background:#ff5fb0;top:46%;left:-110px;animation-delay:-6s}
.b3{width:280px;height:280px;background:#7a5cff;bottom:-90px;right:-80px;animation-delay:-11s}
.b4{width:200px;height:200px;background:#ffe3f0;top:25%;right:-60px;animation-delay:-3s;opacity:.5}
@keyframes drift{to{transform:translate(50px,-40px) scale(1.15)}}
.home{position:absolute;inset:0;padding:calc(var(--sa-t) + 54px) 22px 0;transition:transform .6s var(--ease),filter .6s var(--ease),opacity .5s;will-change:transform}
.home.away{transform:scale(.9);filter:blur(16px) brightness(.8);opacity:.75}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.10));border:1px solid rgba(255,255,255,.42);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 -8px 16px rgba(255,255,255,.06),0 10px 30px rgba(70,10,90,.22)}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wd{aspect-ratio:1;container-type:size;border-radius:30px;padding:14px;position:relative;font-weight:500;line-height:1.1;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.wd small{font-size:10cqw;display:block;margin-bottom:3cqw}
.wd .big{font-size:21cqw;font-weight:600}

.deg{font-size:30cqw;font-weight:600;line-height:1}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;margin-top:26px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;color:#fff;font:inherit;font-size:12px;padding:0;cursor:pointer;touch-action:manipulation}
.tile{position:relative;width:64px;height:64px;border-radius:32px;display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.6,.5,1),filter .2s;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,var(--a),var(--b));opacity:.5}
.tile::after{content:"";position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:18px 18px 40px 40px;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0))}
.tile svg{position:relative;z-index:1;width:32px;height:32px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 4px rgba(60,0,80,.35))}
.app:active .tile,.dk:active .tile{transform:scale(.86);filter:brightness(1.15)}
.app span{text-shadow:0 1px 6px rgba(80,0,90,.35);font-weight:500}
.dockwrap{position:absolute;left:0;right:0;bottom:calc(var(--sa-b) + 16px);display:flex;justify-content:center;pointer-events:none;transition:transform .6s var(--ease),opacity .4s}
.dockwrap.away{transform:translateY(60px) scale(.9);opacity:0}
.dock{pointer-events:auto;display:flex;gap:16px;padding:12px 16px;border-radius:36px;align-items:flex-end}
.dk{background:none;border:0;padding:0;cursor:pointer;transform-origin:50% 100%;transform:translateY(calc((1 - var(--s,1))*28px)) scale(var(--s,1));transition:transform .18s ease-out;touch-action:manipulation}
.dk .tile{width:60px;height:60px;border-radius:30px}
/* app windows: one per app, kept alive in the layer so a minimized app resumes exactly where it was */
.winLayer{position:absolute;inset:0;pointer-events:none}
.win{position:absolute;inset:0;display:none;pointer-events:auto;z-index:5;overflow:hidden;will-change:clip-path,transform;transform-origin:50% 100%}
.win.show{display:block}
.tint{position:absolute;inset:0;background:linear-gradient(145deg,var(--a),var(--b));opacity:0;pointer-events:none;z-index:8}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .3s}
.win.ready .inner{opacity:1}
.hdr{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;min-height:calc(var(--sa-t) + 52px);padding:calc(var(--sa-t) + 2px) 14px 0;background:rgba(255,255,255,0.2);border-bottom:1px solid rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.hdrTitle{position:absolute;right:14px;left:auto;max-width:calc(50% - 82px);top:var(--sa-t);height:52px;line-height:52px;display:block;text-align:right;font-size:16px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.body{flex:1;min-height:0;padding:calc(var(--sa-t) + 62px) 18px 8px;display:flex;flex-direction:column;position:relative}
.btn{border:0;font:inherit;color:#fff;cursor:pointer;transition:transform .12s,filter .15s;touch-action:manipulation}
.btn:active{transform:scale(.92);filter:brightness(1.3)}
.calc{display:flex;flex-direction:column;height:100%;gap:10px}
.disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:0 6px 6px;overflow:hidden}
.ex{font-size:22px;opacity:.7;min-height:28px;word-break:break-all;text-align:right}
.rs{font-size:56px;font-weight:600;line-height:1.1}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys .btn{height:62px;border-radius:31px;font-size:24px;font-weight:500;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}
.keys .op{background:rgba(255,160,210,.45)}.keys .eq{background:linear-gradient(145deg,#ff9ccd,#c36bff)}.keys .z{grid-column:span 2}
textarea,.in{width:100%;border-radius:22px;padding:16px;font:inherit;font-size:18px;color:#fff;outline:none;resize:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);user-select:text;-webkit-user-select:text}
textarea{flex:1}
::placeholder{color:rgba(255,255,255,.6)}
.meta{font-size:13px;opacity:.7;padding:8px 6px 0}
.sw{font-size:62px;font-weight:600;text-align:center;margin:20px 0 4px;font-variant-numeric:tabular-nums}
.sw small{font-size:32px;opacity:.7}
.row{display:flex;gap:14px;justify-content:center;margin:10px 0 16px}
.round{width:86px;height:86px;border-radius:50%;font-size:17px;font-weight:600;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35)}
.go{background:rgba(120,255,190,.35)}.stop{background:rgba(255,100,120,.45)}
.laps{overflow:auto;flex:1;font-variant-numeric:tabular-nums}
.laps div{display:flex;justify-content:space-between;padding:11px 8px;border-top:1px solid rgba(255,255,255,.2);font-size:17px}
canvas{touch-action:none;display:block}
.sk{flex:1;border-radius:24px;background:rgba(255,255,255,.92);width:100%;min-height:0}
.pal{display:flex;gap:12px;justify-content:center;padding:12px 0 4px;align-items:center}
.pal button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.8);cursor:pointer;transition:transform .15s}
.pal button.on{transform:scale(1.28);border-color:#fff}
.pal .btn{width:auto;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.2);height:auto}
.snk{margin:0 auto;border-radius:22px;width:min(100%,340px);aspect-ratio:1;background:rgba(30,0,50,.45);border:1px solid rgba(255,255,255,.3)}
.sc{text-align:center;font-size:18px;margin:2px 0 12px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin-top:14px}
.pad .btn{border-radius:18px;background:rgba(255,255,255,.18);font-size:22px;border:1px solid rgba(255,255,255,.3)}
.pad .u{grid-column:2}
.todo{display:flex;gap:10px;margin-bottom:12px}
.todo .btn{width:56px;border-radius:20px;font-size:26px;background:linear-gradient(145deg,#ff9ccd,#c36bff)}
.list{overflow:auto;flex:1}
.item{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:9px;border-radius:20px;font-size:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.item.done span{text-decoration:line-through;opacity:.55}
.item span{flex:1;word-break:break-word}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:none;padding:0;flex:none;cursor:pointer}
.done .chk{background:#7dffc0;border-color:#7dffc0}
.x{background:none;border:0;color:#fff;font-size:22px;opacity:.7;cursor:pointer}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
.tile.img{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 8px 18px rgba(60,10,80,.3)}
.tile.img::before,.tile.img::after{display:none}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none}
.home{display:flex;flex-direction:column}
.widgets{flex:none}
.grid{flex:1;min-height:0;overflow-y:auto;padding-bottom:130px;align-content:start;scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.win.web .body{padding:0 !important;background:transparent;position:absolute;top:calc(var(--sa-t) + 52px);bottom:0;left:0;right:0;display:block}
.wf{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .35s;display:block;margin:0;padding:0}
.wf.on{opacity:1}
.wload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .35s}
.wmsg{max-width:80%;min-height:20px;text-align:center;font-size:14px;font-weight:500;line-height:1.35;color:#fff;opacity:.9;text-shadow:0 1px 6px rgba(60,0,80,.4)}
.wbtns{display:none;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.wload.stall .wbtns,.wload.err .wbtns{display:flex}
.wbtns button,.wbtns a{font:inherit;font-size:14px;font-weight:600;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.2);padding:9px 16px;border-radius:20px;cursor:pointer;touch-action:manipulation}
.wbtns button:active,.wbtns a:active{background:rgba(255,255,255,.36)}
.wload.err img{animation:none;opacity:.7}
.wload img{width:96px;height:96px;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:pulse 1.4s ease-in-out infinite}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
.wopen{position:absolute;z-index:3;left:68px;top:calc(var(--sa-t) + 14px);width:26px;height:26px;border-radius:50%;display:none;place-items:center;color:#fff;text-decoration:none;font-size:15px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35)}
.win.web.slow .wopen{display:grid}
.body{padding-bottom:calc(var(--sa-b) + 18px)}
.tlights{display:flex;gap:10px;flex:none}
.tl{width:17px;height:17px;border-radius:50%;padding:0;border:0;cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15);transition:transform .12s}
.tl:active{transform:scale(.82)}
.tl svg{width:9px;height:9px;opacity:.9;stroke:#4d0f0f;stroke-width:2.6;stroke-linecap:round;fill:none}
.tl.red{background:#ff5f57}
.tl.yellow{background:#febc2e}
.tl.yellow svg{stroke:#5c3d00}
.islandWrap{position:absolute;left:0;right:0;top:calc(var(--sa-t) + 9px);display:flex;justify-content:center;align-items:flex-start;z-index:9999;pointer-events:none;transition:transform .6s var(--ease),opacity .4s}
.islandWrap.away{opacity:0;transform:translateY(-12px)}
  .island .ic{width:24px;height:24px;border-radius:8px;overflow:hidden;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5)}
.island .ic img{width:100%;height:100%;object-fit:cover}
.island .ic.stack{margin-left:-14px}
.island .lbl{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .islandRow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px}
.islandRow:active{background:rgba(255,255,255,.12)}
.islandRow span{font-size:14px;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.islandX{background:rgba(255,255,255,.2);border:0;color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:16px;cursor:pointer;flex:none;margin-left:auto;padding:0;line-height:1}
.islandX:active{background:rgba(255,255,255,.4)}
.launch{position:absolute;display:none;object-fit:cover;opacity:0;pointer-events:none;z-index:9;left:0;top:0}
.wbg{position:absolute;inset:0;background:linear-gradient(rgba(35,15,55,.30),rgba(35,15,55,.30)),linear-gradient(160deg,#f7a07a 0%,#e9559f 38%,#a057d6 72%,#6d3fb5 100%)}
.dock.nt .dk{transition:none}

.bootMark svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.blob{filter:none;animation:none}
.b1{background:radial-gradient(circle,#ffd0a8 0%,rgba(255,208,168,0) 68%)}
.b2{background:radial-gradient(circle,#ff5fb0 0%,rgba(255,95,176,0) 68%)}
.b3{background:radial-gradient(circle,#7a5cff 0%,rgba(122,92,255,0) 68%)}
.b4{background:radial-gradient(circle,#ffe3f0 0%,rgba(255,227,240,0) 68%)}
.home{transition:transform .6s var(--ease),opacity .5s}
.home.away{transform:scale(.92);filter:none;opacity:.6}
.inner,.win.ready .inner{opacity:1;transition:none}
.tile,.dk .tile{border-radius:22.4%}
.tile.img{box-shadow:0 2px 6px rgba(0,0,0,.18)}
.app{font-size:11.5px;gap:6px}
.app span{text-shadow:0 1px 3px rgba(0,0,0,.3)}
.wd.glass{background:rgba(255,255,255,.8);color:#1c1c1e;border:0;border-radius:24px;backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 4px 14px rgba(40,10,60,.15)}
.dock.glass{background:rgba(255,255,255,.28);border:.5px solid rgba(255,255,255,.35);box-shadow:none;backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);gap:18px;padding:11px 14px}
.dockwrap{flex-direction:column;align-items:center;gap:14px}
.srch{display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:20px;background:rgba(255,255,255,.28);font-size:13px;font-weight:500;color:#fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.srch svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.island .c{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 14px 0 5px;animation:icIn .35s .15s both}
.island .c.still{animation:none}
.island.expanded .c{flex-direction:column;align-items:stretch;gap:2px;padding:8px}
.island .islandRow{height:42px;padding:0 8px}
@keyframes icIn{from{opacity:0;transform:scale(.92)}}
.boot{background:#05030d;transition:opacity .7s cubic-bezier(.4,0,.2,1) .05s}
.bootGlow{position:absolute;left:50%;top:50%;width:min(95vw,640px);height:min(95vw,640px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(130,70,255,.42) 0%,rgba(230,70,170,.20) 34%,rgba(5,3,13,0) 68%);opacity:0;animation:glowIn 1.6s .15s ease-out forwards,glowBreath 3.2s 1.8s ease-in-out infinite}
@keyframes glowIn{to{opacity:1}}
@keyframes glowBreath{50%{opacity:.62;transform:translate(-50%,-50%) scale(1.07)}}
.bootLogo{position:relative;display:grid;place-items:center;transition:transform .8s cubic-bezier(.5,0,.75,0),opacity .6s ease .1s,filter .7s ease;will-change:transform}
.bootIcon{position:relative;width:min(30vw,200px);aspect-ratio:1;border-radius:22.4%;animation:iconBreath 3s 1s ease-in-out infinite}
.bootIcon img{display:block;width:100%;height:100%;border-radius:inherit;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 14px 38px rgba(140,70,255,.5))}
.bootShine{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.bootShine::after{content:"";position:absolute;top:-10%;bottom:-10%;width:42%;left:0;transform:translateX(-160%) skewX(-18deg);background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shineSweep 1.3s .75s cubic-bezier(.4,.1,.2,1) both}
@keyframes shineSweep{to{transform:translateX(330%) skewX(-18deg)}}
@keyframes iconBreath{50%{transform:scale(1.045)}}
.boot.hide .bootLogo{transform:scale(1.9);opacity:0;filter:blur(10px)}
.boot.hide .bootGlow,.boot.hide .bootBar{opacity:0;transition:opacity .35s}
.phone.go .widgets,.phone.go .grid,.phone.go .dock{animation:none}
.phone.go .dock{animation-delay:.08s}
@keyframes homeIn{from{opacity:0;transform:scale(1.07)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bootGlow,.bootIcon,.bootShine::after,.phone.go .widgets,.phone.go .grid,.phone.go .dock{animation:none!important}.bootGlow{opacity:1}.bootShine{display:none}.boot.hide .bootLogo{transform:none;filter:none}}
.bootBar{width:110px;height:3px;bottom:11%}
.bootBar i{width:100%;transform:scaleX(0);transform-origin:left;animation:barFill 2.2s .2s cubic-bezier(.45,.1,.35,1) forwards}
@keyframes barFill{to{transform:scaleX(1)}}
.bootHint{position:absolute;bottom:5%;font-size:12px;color:rgba(255,255,255,.4);opacity:0;transition:opacity .5s}.bootHint.on{opacity:1}
.sd{position:absolute;inset:0;z-index:200;background:#000;opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;transition:opacity .9s ease}
.sd.on{opacity:1;pointer-events:auto}
.sdSpin{width:30px;height:30px;border:2.5px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;opacity:0;animation:spin .9s linear infinite;transition:opacity .4s .5s}
.sd.on .sdSpin{opacity:1}.sd.done .sdSpin{opacity:0;transition:opacity .3s}
.island{position:relative;flex:none;width:min(350px,calc(100% - 24px));height:520px;pointer-events:none}
.gl{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.1));backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);clip-path:inset(0 105px 486px 105px round 17px);transition:clip-path .55s var(--ease),opacity .3s}
.rim{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:17px;box-sizing:border-box;border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),0 8px 22px rgba(40,0,60,.4);overflow:hidden;pointer-events:auto;cursor:pointer;transition:width .55s var(--ease),height .55s var(--ease),border-radius .55s var(--ease),opacity .3s}
#cc{position:absolute;inset:0}
.island.off .gl,.island.off .rim{opacity:0;pointer-events:none}
.island .ic{width:26px;height:26px;border-radius:22.4%;border:0;background:rgba(255,255,255,.18)}
.island .ic svg{width:60%;height:60%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.island .ic.stack{margin-left:-14px;box-shadow:0 0 0 1.5px rgba(255,255,255,.45)}
.island .islandRow{height:56px;padding:0 6px;gap:14px;border-radius:30px}
.island .islandRow .ic{width:44px;height:44px}
.island .islandRow span:nth-child(2){font-size:17px;font-weight:500}
.island .islandX{width:34px;height:34px;font-size:20px}
.island.expanded .c{padding:9px;gap:6px}
.toast{white-space:nowrap}
.home.away .wd.glass,.dockwrap.away .dock.glass{backdrop-filter:none;-webkit-backdrop-filter:none}
.island:not(.expanded) .c{right:auto;width:max-content;padding:0 12px 0 5px;gap:7px}
.island .lbl{max-width:110px}
.tile,.dk .tile{border-radius: 40% !important}
.island .ic{border-radius:44%}
@supports (corner-shape:squircle){.island .ic{corner-shape:squircle;border-radius:50%}}
.launch{border-radius: 40% !important}
.island .islandRow{flex:none}
.island .islandClear{flex:none;height:40px;border:0;border-radius:20px;background:rgba(255,255,255,.22);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.island .islandClear:active{background:rgba(255,255,255,.36)}
.scrim{position:absolute;inset:0;z-index:9998;display:none;touch-action:none}.scrim.on{display:block}
@keyframes vanish{to{opacity:0;transform:scale(.55) translateY(-10px)}}
/* ---- performance pass: same animations, far less GPU work ---- */
*:not(.gl){backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.gl{backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5)}
.rim{box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),0 4px 12px rgba(40,0,60,.35)}
.win{will-change:auto}
html,body,.phone,.wall,.win{overflow:clip!important}
.win.anim{will-change:clip-path,transform}
.win.anim .wf,.win.anim .wf.on{opacity:0;visibility:hidden;transition:none}
.win.web .body{bottom:var(--sa-b)}
/* Keep widgets, app grid and dock phone-sized and centered on tablet, desktop and TV so nothing balloons past the visible frame */
@media (min-width:501px){
  .home{left:50%;right:auto;width:min(420px,calc(100% - 44px));transform:translateX(-50%)}
  .home.away{transform:translateX(-50%) scale(.9)}
  .dockwrap{left:50%;right:auto;width:min(420px,calc(100% - 44px));transform:translateX(-50%)}
  .dockwrap.away{transform:translateX(-50%) translateY(60px) scale(.9)}
}

/* ===== lock screen (merged from lock.html): sits above the home layer, below the boot splash ===== */
#lkroot{position:absolute;inset:0;z-index:10;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,"SF Pro Display",Roboto,Arial,sans-serif}
#lkback{position:absolute;inset:0;background:transparent}
#lkphone{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,calc(100vh*.5625));overflow:hidden;background:#222}
#lkc{position:absolute;inset:0;width:100%;height:100%}
#lkdate{position:absolute;top:3.6%;left:0;right:0;text-align:center;color:rgba(255,255,255,.95);font-size:clamp(18px,5.4vw,26px);font-weight:600;letter-spacing:.2px;text-shadow:0 1px 8px rgba(0,0,0,.22)}
#lkswipeWrap{position:absolute;left:0;right:0;bottom:1.6%;display:flex;flex-direction:column;align-items:center;z-index:4;transition:transform .08s linear}
#lkchev{color:rgba(255,255,255,.85);font-size:20px;line-height:1;margin-bottom:2px;animation:lkChevUp 1.6s ease-in-out infinite;text-shadow:0 1px 6px rgba(0,0,0,.35)}
#lkswipeTxt{color:rgba(255,255,255,.85);font-size:clamp(12px,3.2vw,14px);font-weight:500;letter-spacing:.2px;margin-bottom:10px;text-shadow:0 1px 6px rgba(0,0,0,.35)}
#lkbar{width:34%;height:5px;border-radius:3px;background:rgba(255,255,255,.85)}
@keyframes lkChevUp{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-6px);opacity:1}}
/* home layer stays hidden until the lock is opened, so the icon animation starts from nothing */
.phone.locked .home,.phone.locked .dockwrap,.phone.locked .islandWrap{visibility:hidden}
</style>
</head>

/* ---------- web apps: each icon's backend URL runs full-screen inside its own window ---------- */
function webAppInto(a,winEl,body){const ob=winEl.querySelector('.wopen');
 body.innerHTML=`<div class="wload"><div class="spin"></div><div class="wmsg"></div><div class="wbtns"><button type="button" class="wrl">Reload</button><a class="wob" target="_blank" rel="noopener">Open in browser</a></div></div><iframe class="wf" allow="geolocation; camera; microphone; clipboard-write; fullscreen; autoplay"></iframe>`;
 if(a.img){const im=document.createElement('img');im.src=a.img.src;im.alt='';body.querySelector('.wload').prepend(im)}
 const f=body.querySelector('iframe'),ld=body.querySelector('.wload'),msg=ld.querySelector('.wmsg'),sp=ld.querySelector('.spin');f.title=a.n;
 ld.querySelector('.wob').href=a.url;ob.href=a.url;
 let same=false;try{same=new URL(a.url,location.href).origin===location.origin}catch(e){}
 let tries=0,shown=false,dead=false,poll=0,t1=0,t2=0,t3=0;
 const clr=()=>{clearInterval(poll);clearTimeout(t1);clearTimeout(t2);clearTimeout(t3)};
 const doc=()=>{try{return f.contentDocument}catch(e){return null}};
 const bad=d=>{try{return /^(404\b|page not found|site not found|file not found)/i.test((d.title||'').trim())}catch(e){return false}};
 const reveal=()=>{if(shown||dead)return;shown=true;clr();f.classList.add('on');ld.style.opacity=0;ld.style.pointerEvents='none'};
 const fail=m=>{if(shown||dead)return;clr();f.classList.remove('on');ld.style.opacity=1;ld.style.pointerEvents='auto';sp.style.display='none';msg.textContent=m;ld.classList.add('err')};
 /* same-origin apps are shown as soon as their page exists: the window "load" event also waits for every poster / API call and can take minutes on a slow backend */
 const check=()=>{if(shown||dead)return;const d=doc();if(!d||!d.location||d.location.href==='about:blank'||!d.body)return;
  if(bad(d)){fail('This app page was not found (404). Check its link in apps.json.');return}
  if(d.readyState!=='loading'||d.body.childElementCount>1)reveal()};
 const start=()=>{clr();shown=false;f.classList.remove('on');ld.style.opacity=1;ld.style.pointerEvents='';ld.classList.remove('err','stall');sp.style.display='';msg.textContent='';
  let u=a.url;if(tries>0){try{const x=new URL(a.url,location.href);x.searchParams.set('_vp',Date.now());u=x.href}catch(e){}}
  f.src=u;
  if(same)poll=setInterval(check,150);
  t1=setTimeout(()=>{if(shown)return;winEl.classList.add('slow');ld.classList.add('stall');msg.textContent='Taking longer than usual…'},4000);
  if(!same)t3=setTimeout(reveal,6000);  /* cross-origin pages cannot be inspected: show whatever has painted after 6s */
  t2=setTimeout(()=>{if(shown)return;if(tries<2){tries++;msg.textContent='Connection is slow, retrying…';start()}else fail('Could not load this app. Check your internet and tap Reload.')},16000)};
 f.onload=()=>{if(dead)return;const d=doc();
  if(d&&d.location&&d.location.href==='about:blank')return;      /* initial blank frame */
  if(same&&!d){fail('Could not reach this app. Check your internet and tap Reload.');return}
  if(d&&bad(d)){fail('This app page was not found (404). Check its link in apps.json.');return}
  reveal()};
 ld.querySelector('.wrl').onclick=e=>{e.stopPropagation();tries=1;start()};
 start();
 return()=>{dead=true;clr();f.onload=null;f.src='about:blank';f.remove();body.innerHTML='';}}

 const fit=()=>{const r=cv.getBoundingClientRect();if(!r.width||ready)return;ready=true;cv.width=r.width*dpr;cv.height=r.height*dpr;g.scale(dpr,dpr);g.lineCap=g.lineJoin='round';g.lineWidth=5};
 requestAnimationFrame(fit);

 cv.onpointerdown=e=>{fit();dr=true;[lx,ly]=pt(e);cv.setPointerCapture(e.pointerId);g.fillStyle=col;g.beginPath();g.arc(lx,ly,2.5,0,7);g.fill()};

function snakeApp(el){
 el.innerHTML=`<div class="sc" id="sc">Score 0</div><canvas class="snk" id="sn" width="320" height="320"></canvas><div class="pad"><button class="btn u" data-d="U">▲</button><button class="btn" data-d="L" style="grid-row:2">◀</button><button class="btn" data-d="D" style="grid-row:2">▼</button><button class="btn" data-d="R" style="grid-row:2">▶</button></div>`;
 const cv=$('#sn'),g=cv.getContext('2d'),N=16,S=20;let sn,dir,nd,food,score,over,timer;
 const V={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
 const spawn=()=>{do{food=[Math.random()*N|0,Math.random()*N|0]}while(sn.some(s=>s[0]===food[0]&&s[1]===food[1]))};
 const reset=()=>{sn=[[8,8],[7,8],[6,8]];dir=nd='R';score=0;over=false;spawn();$('#sc').textContent='Score 0';draw()};
 const draw=()=>{g.clearRect(0,0,320,320);g.fillStyle='#ff7ac0';g.shadowColor='#ff7ac0';g.shadowBlur=14;g.beginPath();g.arc(food[0]*S+10,food[1]*S+10,7,0,7);g.fill();g.shadowBlur=0;
  sn.forEach((s,i)=>{g.fillStyle=i?'rgba(150,255,200,.85)':'#fff';g.beginPath();if(g.roundRect)g.roundRect(s[0]*S+1.5,s[1]*S+1.5,S-3,S-3,7);else g.rect(s[0]*S+1.5,s[1]*S+1.5,S-3,S-3);g.fill()});
  if(over){g.fillStyle='rgba(30,0,50,.6)';g.fillRect(0,0,320,320);g.fillStyle='#fff';g.font='600 26px system-ui';g.textAlign='center';g.fillText('Game over',160,150);g.font='18px system-ui';g.fillText('Tap to play again',160,182)}};
 const step=()=>{if(over)return;dir=nd;const h=[sn[0][0]+V[dir][0],sn[0][1]+V[dir][1]];
  if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(s=>s[0]===h[0]&&s[1]===h[1])){over=true;draw();return}
  sn.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){score++;$('#sc').textContent='Score '+score;spawn()}else sn.pop();draw()};
 const turn=d=>{const o={U:'D',D:'U',L:'R',R:'L'};if(d!==o[dir])nd=d};
 el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>turn(b.dataset.d));
 const kd=e=>{const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[e.key];if(m){turn(m);e.preventDefault()}};addEventListener('keydown',kd);
 let sx,sy2;
 cv.onpointerdown=e=>{sx=e.clientX;sy2=e.clientY;if(over)reset()};
 cv.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy2;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))};
 reset();timer=setInterval(step,130);
 return()=>{clearInterval(timer);removeEventListener('keydown',kd)};
}

/* soft cloud / fog noise: random low-res alpha grids, smoothly upscaled, a few octaves */
function fogNoise(c,r,y0,y1,rgb,amp,blur,seedOcts){
  const h=Math.max(2,Math.round(y1-y0));
  const lay=mk();lay.width=W;lay.height=h;const lc=lay.getContext('2d');
  lc.imageSmoothingEnabled=true;lc.imageSmoothingQuality='high';
  (seedOcts||[[3,1],[6,.7],[12,.45],[24,.25]]).forEach(o=>{
    const gw=o[0],gh=Math.max(2,Math.round(gw*h/W*1.7));
    const t=mk();t.width=gw;t.height=gh;const tc=t.getContext('2d'),d=tc.createImageData(gw,gh);
    for(let i=0;i<d.data.length;i+=4){d.data[i]=rgb[0];d.data[i+1]=rgb[1];d.data[i+2]=rgb[2];d.data[i+3]=r()*255*o[1];}
    tc.putImageData(d,0,0);
    lc.globalAlpha=.55;lc.drawImage(t,0,0,W,h);
  });
  c.save();c.globalAlpha=amp;
  try{c.filter='blur('+blur+'px)';}catch(e){}
  c.drawImage(lay,0,y0);
  c.restore();
}
function fogBand(c,y,hh,a,rgb){
  const g=c.createLinearGradient(0,y-hh,0,y+hh),k=rgb||'198,206,208';
  g.addColorStop(0,'rgba('+k+',0)');g.addColorStop(.5,'rgba('+k+','+a+')');g.addColorStop(1,'rgba('+k+',0)');
  c.fillStyle=g;c.fillRect(0,y-hh,W,hh*2);
}
/* spruce / fir: ragged drooping tiers, thin spire, optional needle-branch strokes */
function tree(c,x,by,h,w,r,det){
  const n=Math.max(10,Math.min(36,Math.round(h/(6.5*D)))),st=h/n,top=by-h;
  const R=[],L=[];
  for(let i=1;i<=n;i++){
    const t=i/n,yy=top+t*h,base=w/2*(.07+.93*Math.pow(t,.88));
    const o1=base*(.78+.5*r()),o2=base*(.78+.5*r()),d1=st*(.25+.35*r()),d2=st*(.25+.35*r());
    R.push([x+o1*.4,yy-st*.5,0],[x+o1,yy+d1,o1]);
    L.push([x-o2*.4,yy-st*.5,0],[x-o2,yy+d2,o2]);
  }
  c.beginPath();c.moveTo(x,top-st*.9);
  R.forEach(p=>c.lineTo(p[0],p[1]));
  c.lineTo(x+w*.025,by);c.lineTo(x-w*.025,by);
  for(let i=L.length-1;i>=0;i--)c.lineTo(L[i][0],L[i][1]);
  c.closePath();c.fill();
  if(det){
    c.save();c.strokeStyle=c.fillStyle;c.lineWidth=Math.max(1,D*.9);c.lineCap='round';

/* ---------- user wallpaper: dark pixels in lower half become the foreground ---------- */
function applyImage(){
  const b=bg.getContext('2d');b.clearRect(0,0,W,H);drawCover(b,img);

    let m=(TH-l)/35;m=m<0?0:m>1?1:m;m=m*m*(3-2*m);

/* ---------- glass clock ---------- */
function rr(p,x,y,w,h,r){p.moveTo(x+r,y);p.arcTo(x+w,y,x+w,y+h,r);p.arcTo(x+w,y+h,x,y+h,r);p.arcTo(x,y+h,x,y,r);p.arcTo(x,y,x+w,y,r);p.closePath();}
function glyph(p,ch,x,y,w,h){
  const PI=Math.PI,cx=x+w/2;

    case '0':rr(p,x,y,w,h,w/2);break;
    case '1':p.moveTo(x+w*.1,y+w*.4);p.lineTo(cx,y);p.lineTo(cx,y+h);break;
    case '2':p.moveTo(x,y+w/2);p.arc(cx,y+w/2,w/2,PI,0);p.bezierCurveTo(x+w,y+h*.45,x,y+h*.55,x,y+h);p.lineTo(x+w,y+h);break;
    case '3':p.moveTo(x,y+w/2);p.arc(cx,y+w/2,w/2,PI,0);p.lineTo(x+w,y+h/2-w/2);p.arc(cx,y+h/2-w/2,w/2,0,PI/2);
      p.arc(cx,y+h/2+w/2,w/2,-PI/2,0);p.lineTo(x+w,y+h-w/2);p.arc(cx,y+h-w/2,w/2,0,PI);break;
    case '4':p.moveTo(x+w*.75,y+h);p.lineTo(x+w*.75,y);p.lineTo(x,y+h*.68);p.lineTo(x+w,y+h*.68);break;
    case '5':p.moveTo(x+w,y);p.lineTo(x+w*.1,y);p.lineTo(x+w*.05,y+h*.45);
      p.bezierCurveTo(x+w*.3,y+h*.38,x+w,y+h*.4,x+w,y+h*.68);p.lineTo(x+w,y+h-w/2);p.arc(cx,y+h-w/2,w/2,0,PI);break;
    case '6':rr(p,x,y+h*.42,w,h*.58,w/2);p.moveTo(x,y+h*.71);p.lineTo(x,y+w/2);p.arc(cx,y+w/2,w/2,PI,0);break;
    case '7':p.moveTo(x,y);p.lineTo(x+w,y);p.lineTo(x+w*.3,y+h);break;
    case '8':rr(p,x+w*.05,y,w*.9,h*.52,w*.45);rr(p,x,y+h*.45,w,h*.55,w/2);break;
    case '9':rr(p,x,y,w,h*.58,w/2);p.moveTo(x+w,y+h*.29);p.lineTo(x+w,y+h-w/2);p.arc(cx,y+h-w/2,w/2,0,PI);break;

function buildClock(){
  const t=now(),hh=t.getHours()%12||12,s=hh+':'+String(t.getMinutes()).padStart(2,'0');

    if(ch===':'){dots.push([x+cw/2,y0+Hc*.3],[x+cw/2,y0+Hc*.75]);x+=cw+g;}
    else{glyph(P,ch,x+sw/2,y0+sw/2,Dw-sw,Hc-sw);x+=Dw+g;}
  }
  const paint=(c,shrink)=>{
    c.lineWidth=sw-2*shrink;c.lineCap=c.lineJoin='round';c.stroke(P);
    dots.forEach(d=>{c.beginPath();c.arc(d[0],d[1],sw*.5-shrink,0,7);c.fill()});

  const rg=mk();rg.width=W;rg.height=H;c=rg.getContext('2d');
  c.fillStyle=c.strokeStyle='#fff';paint(c,0);
  c.globalCompositeOperation='destination-out';paint(c,1.2*D);
  const k=ck.getContext('2d');k.clearRect(0,0,W,H);
  k.save();k.shadowColor='rgba(0,0,0,.16)';k.shadowBlur=16*D;k.drawImage(gl,0,0);k.restore();

/* ---------- haptics: Android (Vibration API) + best-effort iOS WebView bridge ---------- */
/* Chrome/Android ignores navigator.vibrate() until the page has had a user activation,

/* ---------- swipe-up to unlock (iOS style: 1:1 finger-follow full range + unlock animation) ---------- */

    if(!dragging||!locked)return;dragging=false;snapBack();

    phone.style.opacity=String(Math.max(0,1-curY/maxPull*1.15));
    wrap.style.transform=`translateY(${-curY*.5}px)`;
    wrap.style.opacity=String(Math.max(0,1-curY/(maxPull*.35)));

    try{const ph=document.getElementById('phone');if(ph)ph.classList.remove('locked')}catch(e){}

  root.addEventListener('pointerdown',onStart);
  root.addEventListener('pointermove',onMove);

@keyframes vpOut{to{opacity:0;transform:translateY(30px) scale(.9);filter:blur(10px)}}
@keyframes vpIcon{from{opacity:0;transform:scale(.4) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes vpW{from{opacity:0;transform:translateY(12px) scale(.95);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes vpUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes vpSheen{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
@media (prefers-reduced-motion:reduce){#vpO .vpCard::before{animation:none}}
</style>
<script>
(function(){
 var APP_URL='https://itsmems97.github.io/movie-api-2/ViPhone.html';
 var SHARE_TEXT='Not Spam Link:\nThis App From: +923041891897\niPhone, Android, Tablets,\nTv, Laptop, this One App For All In One\n\nMovies, shows, series, dramas, worldwide content in Hindi, Urdu, English and all languages. All In One, Only In One App. Everything Free!\n\nLink:\n'+APP_URL;
 var ICON_SHARE='<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8.2 6.8 12 3l3.8 3.8"/><path d="M7.5 10H6.2A2.2 2.2 0 0 0 4 12.2v6.6A2.2 2.2 0 0 0 6.2 21h11.6a2.2 2.2 0 0 0 2.2-2.2v-6.6A2.2 2.2 0 0 0 17.8 10h-1.3"/></svg>';
 var ICON_CANCEL='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><path d="M8.8 8.8l6.4 6.4M15.2 8.8l-6.4 6.4"/></svg>';
 var ICON_INSTALL='<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7.8 11.2 12 15.4l4.2-4.2"/><path d="M4.5 15.5v2.2A2.3 2.3 0 0 0 6.8 20h10.4a2.3 2.3 0 0 0 2.3-2.3v-2.2"/></svg>';
 var ICON_CHECK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><path d="M8 12.4l2.7 2.7L16.2 9.6"/></svg>';
 var UA=navigator.userAgent,
  ios=/iphone|ipad|ipod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
  android=/Android/i.test(UA),
  inApp=/FBAN|FBAV|FB_IAB|Instagram|Snapchat|TikTok|MicroMessenger|Line\/|GSA\/|; wv\)/i.test(UA),
  isFF=/Firefox|FxiOS/i.test(UA),
  isSamsung=/SamsungBrowser/i.test(UA),
  isEdge=/Edg(A|iOS|e)?\//i.test(UA),
  macSafari=/Macintosh/i.test(UA)&&!ios&&/Safari/i.test(UA)&&!/Chrome|Chromium|Edg|OPR|Firefox/i.test(UA);
 var cur=null;
 /* "installed" memory: ONLY a timestamp written by the appinstalled event or by running standalone. The old permanent flag ('1') is deleted, it survived uninstalling and blocked the popup forever. */
 try{if(localStorage.getItem('vp_installed'))localStorage.removeItem('vp_installed')}catch(e){}
 function isInst(){try{var t=+localStorage.getItem('vp_inst2');return !!t&&Date.now()-t<14*864e5}catch(e){return false}}
 function setInst(){try{localStorage.setItem('vp_inst2',String(Date.now()))}catch(e){}}
 function clearInst(){try{localStorage.removeItem('vp_inst2')}catch(e){}}
 /* cb(true)=installed, cb(false)=not installed, cb(null)=this browser cannot tell */
 function checkRel(cb){var done=false;function f(v){if(!done){done=true;cb(v)}}try{if(navigator.getInstalledRelatedApps){navigator.getInstalledRelatedApps().then(function(a){f(!!(a&&a.length))},function(){f(null)});setTimeout(function(){f(null)},1500)}else f(null)}catch(e){f(null)}}
 function standalone(){try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: minimal-ui)').matches||navigator.standalone===true}catch(e){return false}}
 /* resolves with the browser's own install event (Chrome/Edge/Samsung/Opera on Android + desktop) or null after ms. This event only fires when the app is NOT installed. */
 function waitBIP(ms,cb){if(window.__vpBIP){cb(window.__vpBIP);return}var d=false,t=setTimeout(function(){if(!d){d=true;window.__vpOnBIP=null;cb(null)}},ms);window.__vpOnBIP=function(e){if(!d){d=true;clearTimeout(t);cb(e)}}}
 if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw-viphone.js',{scope:'./ViPhone.html'}).catch(function(){})}catch(e){}}

 function closePop(next){
  var r=cur;if(!r){if(next)next();return}
  cur=null;window.__vpPopOpen=false;window.__vpClose=null;
  r.classList.add('out');
  setTimeout(function(){if(r.parentNode)r.parentNode.removeChild(r);if(next)setTimeout(next,250)},380);
 }
 /* o: {title, body, btns:[{label, svg, main, fn(ctx)}]} ; the last button is also the Back-button action */
 function popup(o){
  if(cur&&cur.parentNode)cur.parentNode.removeChild(cur);
  var n=0;
  function W(t){return t.split(' ').map(function(w){return '<span class="w" style="animation-delay:'+(450+45*(n++))+'ms">'+w+'</span>'}).join(' ')}
  var t=W(o.title),b=W(o.body),bd=Math.min(450+45*n+150,2000);
  var r=document.createElement('div');r.id='vpO';
  var bh=o.btns.map(function(x){return '<button type="button" class="vpB'+(x.main?' main':'')+'">'+x.svg+'<span>'+x.label+'</span></button>'}).join('');
  r.innerHTML='<div class="vpCard" role="dialog" aria-modal="true"><img class="vpIco" alt="" src="vp-icon-512.png" onerror="this.style.display=\'none\'"><h2 class="vpT">'+t+'</h2><p class="vpP">'+b+'</p><div class="vpBtns" style="animation-delay:'+bd+'ms">'+bh+'</div></div>';
  document.body.appendChild(r);cur=r;window.__vpPopOpen=true;
  var bs=r.querySelectorAll('.vpB'),ctx={root:r,btns:bs,close:closePop,
   setSteps:function(html){var p=r.querySelector('.vpP');p.outerHTML='<ol class="vpP steps">'+html+'</ol>'}};
  if(o.steps)ctx.setSteps(o.steps);
  var busy=false;
  o.btns.forEach(function(x,i){bs[i].onclick=function(e){e.stopPropagation();if(busy)return;busy=true;var keep=x.fn(ctx);if(keep===true)busy=false}});
  window.__vpClose=function(){var last=bs[bs.length-1];if(last)last.click()};
 }

 function showShare(){
  popup({title:'Share the vibe \uD83D\uDD25',
   body:'Send this app to your squad. iPhone, Android, tablets, TV, laptop, one app for everything. No cap.',
   btns:[
    {label:'Share',svg:ICON_SHARE,main:true,fn:function(c){
      if(navigator.share){navigator.share({title:'ViPhone',text:SHARE_TEXT}).catch(function(){}).then(function(){c.close()})}
      else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(SHARE_TEXT).then(function(){c.btns[0].innerHTML=ICON_CHECK+'<span>Copied</span>'}).catch(function(){}).then(function(){setTimeout(function(){c.close()},1200)})}
      else c.close()}},
    {label:'Cancel',svg:ICON_CANCEL,fn:function(c){c.close()}}
   ]});
 }

 function stepsHtml(arr){return arr.map(function(t,i){return '<li><b>'+(i+1)+'</b><span>'+t+'</span></li>'}).join('')}
 function guideSteps(){
  var sh='<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8.2 6.8 12 3l3.8 3.8"/><path d="M7.5 10H6.2A2.2 2.2 0 0 0 4 12.2v6.6A2.2 2.2 0 0 0 6.2 21h11.6a2.2 2.2 0 0 0 2.2-2.2v-6.6A2.2 2.2 0 0 0 17.8 10h-1.3"/></svg>';
  if(inApp)return ['Open the menu of this in-app browser and tap Open in browser (Chrome or Safari)','Then tap Install again on this page'];
  if(ios)return ['Tap the Share button '+sh+' (Safari: bottom bar, Chrome: top right)','Scroll down and tap Add to Home Screen','Tap Add, done!'];
  if(macSafari)return ['In the Safari menu bar tap File, or the Share button '+sh,'Tap Add to Dock','Tap Add, done!'];
  if(isFF&&android)return ['Tap the 3 dots menu in Firefox','Tap Install','Tap Add, done!'];
  if(isSamsung)return ['Tap the menu (3 lines) in Samsung Internet','Tap Add page to, then Home screen','Tap Add, done!'];
  if(android&&isEdge)return ['Tap the menu (3 lines) at the bottom of Edge','Tap Add to phone','Tap Install, done!'];
  if(android)return ['Tap the 3 dots menu in your browser','Tap Install app (or Add to Home screen)','Tap Install, done!'];
  if(isEdge)return ['Click the install icon at the right end of the address bar, or the 3 dots menu, then Apps','Click Install this site as an app','Click Install, done!'];
  return ['Click the install icon at the right end of the address bar, or the 3 dots menu, then Cast, save and share','Click Install page as app','Click Install, done!'];
 }
 function showInstall(){
  var native=!!(window.__vpBIP&&!ios);
  if(!native){   /* this browser/device has no one-tap install: show the guide straight away */
   popup({title:'Install the app ✨',body:'Add it to your device',steps:stepsHtml(guideSteps()),
    btns:[{label:'Got it',svg:ICON_CHECK,main:true,fn:function(c){c.close(showShare)}},
          {label:'Not now',svg:ICON_CANCEL,fn:function(c){c.close(showShare)}}]});
   return;
  }
  popup({title:'Install the app ✨',
   body:'Go full screen and enjoy a super smooth, fast experience. It feels like a real app.',
   btns:[
    {label:'Install',svg:ICON_INSTALL,main:true,fn:function(c){
      var p=window.__vpBIP;
      if(p){window.__vpBIP=null;var go=function(){c.close(showShare)};
        try{p.prompt();p.userChoice.then(function(r){if(r&&r.outcome==='accepted')setInst();go()},go)}catch(e){go()}return}
      /* native prompt no longer available (already used / dismissed): fall back to the guide */
      c.setSteps(stepsHtml(guideSteps()));c.btns[0].innerHTML=ICON_CHECK+'<span>Got it</span>';c.btns[1].style.display='none';
      c.btns[0].onclick=function(e){e.stopPropagation();c.close(showShare)};
    }},
    {label:'Not now',svg:ICON_CANCEL,fn:function(c){c.close(showShare)}}
   ]});
 }

 /* Decide what to show after the boot animation:
    - running as an installed app          -> never the install popup, only Share
    - browser fired its install event       -> NOT installed (Chrome only fires it then): native one-tap install popup
    - browser can report related apps       -> trust it (installed: Share only, not installed: install popup/guide)
    - browser cannot tell (iPhone, Safari, Firefox...) -> iPhone/Safari always show the guide, others use the install timestamp */
 function start(){
  if(standalone()){setInst();showShare();return}
  if(ios||macSafari){showInstall();return}
  if(isFF&&!android){showShare();return}          /* desktop Firefox cannot install web apps */
  waitBIP(2500,function(ev){
   if(ev){clearInst();showInstall();return}
   checkRel(function(r){
    if(r===true){setInst();showShare();return}
    if(r===false){clearInst();showInstall();return}
    if(isInst())showShare();else showInstall();
   });
  });
 }
 /* the Install / Share pop-ups no longer start after the splash: the lock screen calls this once it has been unlocked */
 var started=false;
 window.__vpStartPopups=function(){if(started)return;started=true;setTimeout(start,1400)};
})();
</script>
