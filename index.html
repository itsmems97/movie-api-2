<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PIKA PICTURE</title>
<link rel="preload" as="image" href="https://raw.githubusercontent.com/itsmems97/movie-api-2/refs/heads/main/iWatch.png">
<link rel="preload" as="font" type="font/ttf" crossorigin href="https://raw.githubusercontent.com/itsmems97/itsmems97.github.io/main/VIP.ttf">
<style>
/* ===== Design tokens ===== */
:root{--g:#30d158;--bg:#000;--s1:#1c1c1e;--s2:#2c2c2e;--t2:#8e8e93;--glass:rgba(34,34,36,.66);--line:rgba(255,255,255,.1);--ease:cubic-bezier(.25,.8,.25,1);
--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--l:env(safe-area-inset-left,0px);--rt:env(safe-area-inset-right,0px)}
/* ===== Base / native-app feel ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;scrollbar-width:none}
::-webkit-scrollbar{display:none}
input{-webkit-user-select:text;user-select:text}
html{touch-action:manipulation;overscroll-behavior:none;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:#fff;overscroll-behavior:none;padding-bottom:var(--bot)}
body.pl{overflow:hidden}
img{-webkit-user-drag:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:-200% 0}}
/* ===== Splash ===== */
#spl{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 40%,#0b2a12,#000 70%);display:grid;place-content:center;justify-items:center;gap:18px;transition:opacity .5s,transform .5s}
#spl.out{opacity:0;transform:scale(1.04);pointer-events:none}
.ring{width:84px;height:84px;border-radius:50%;border:3px solid #fff1;border-top-color:var(--g);display:grid;place-items:center;animation:spin 1.1s linear infinite}
.ring b{animation:spin 1.1s linear infinite reverse;font-size:30px;font-weight:900;color:var(--g)}
.sn{font-size:24px;font-weight:900;letter-spacing:4px}
.ss{font-size:11px;letter-spacing:3px;color:#666;text-transform:uppercase}
/* ===== Header / search ===== */
header{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:12px;padding:calc(var(--top) + 8px) 16px 8px;background:linear-gradient(#000c,#0000);transition:background .3s}
header.sc{background:rgba(20,20,22,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:20px;color:var(--g);letter-spacing:-.4px;white-space:nowrap}
.sw{position:relative;flex:1;max-width:420px;margin-left:auto}
.sw .i{position:absolute;left:10px;top:9px;width:18px;height:18px;color:var(--t2);pointer-events:none}
#q{width:100%;height:36px;border-radius:12px;border:1px solid var(--line);background:rgba(44,44,46,.85);color:#fff;font-size:16px;padding:0 12px 0 34px;outline:0}
#q:focus{border-color:var(--g)}
#sug{position:absolute;top:44px;left:0;right:0;max-height:320px;overflow:auto;display:none;flex-direction:column;background:rgba(28,28,30,.96);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px #000a}
.si{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.si img{width:36px;height:52px;border-radius:6px;object-fit:cover;background:var(--s2)}
.si span{font-size:14px;font-weight:500}
/* ===== Home ===== */
.hero{position:relative;height:62vh;min-height:340px;background:var(--s1);display:flex;align-items:flex-end;justify-content:center;text-align:center;padding:20px 20px 28px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .5s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000 4%,#0000 58%,#0006)}
.hc{position:relative;z-index:2}
.hc h1{font-size:30px;font-weight:800;text-shadow:0 2px 12px #000}
.hm{font-size:13px;color:#ccc;margin:8px 0 16px}
.wn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#000;border-radius:30px;padding:11px 28px;font-weight:700;font-size:16px}
.wn .i{width:20px;height:20px;fill:currentColor}
.wn:active{transform:scale(.95)}
.cat{margin-top:22px;padding:0 16px}
.cat h2{font-size:18px;font-weight:700;margin-bottom:12px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.mc{flex:0 0 112px;scroll-snap-align:start;cursor:pointer;transition:transform .2s var(--ease)}
.mc:active{transform:scale(.95)}
.po{width:100%;height:168px;border-radius:12px;object-fit:cover;background:var(--s2);box-shadow:0 6px 14px #0006;display:block}
.po.bad{background:linear-gradient(135deg,#1c1c1e,#2c2c2e)}
.mt{font-size:12px;margin-top:6px;color:#ddd;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk{background:linear-gradient(90deg,#1c1c1e,#2c2c2e,#1c1c1e);background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:12px;flex:0 0 112px;height:168px}
.empty{padding:40px 16px;text-align:center;color:var(--t2)}
.empty button{margin-top:12px;background:var(--g);border-radius:20px;padding:9px 22px;font-weight:700;color:#fff}
/* ===== Player ===== */
#player{position:fixed;inset:0;z-index:1000;background:#000;display:none;touch-action:none;overscroll-behavior:none}
#player.on{display:block}
#surf{position:absolute;inset:0;overflow:hidden;touch-action:none}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center;will-change:transform;background:#000}
#v::cue{background:rgba(0,0,0,.6);font-size:1.1em}
.ui{pointer-events:auto}
.b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.b:active{background:rgba(255,255,255,.16)}
.b:disabled{opacity:.35}
.b[hidden]{display:none}
.glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line)}
#ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:calc(var(--top) + 8px) calc(var(--rt) + 14px) calc(var(--bot) + 10px) calc(var(--l) + 14px);background:linear-gradient(#000a,#0000 28%,#0000 60%,#000b);transition:opacity .25s var(--ease)}
#ctl.off{opacity:0;visibility:hidden;transition:opacity .25s var(--ease),visibility 0s .25s}
.top{display:flex;align-items:center;gap:6px}
#ttl{flex:1;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{display:flex;justify-content:center;align-items:center;gap:20px}
.big{width:68px;height:68px}
.big .i{width:32px;height:32px;fill:currentColor}
.sr{display:flex;align-items:center;gap:10px;font-size:12px;font-variant-numeric:tabular-nums}
.sr span{min-width:44px}
#td{text-align:right}
#sb{position:relative;flex:1;height:34px;touch-action:none}
.trk{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:2px;background:#fff4;overflow:hidden}
.trk i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0)}
#buf{background:#fff5}#pr{background:var(--g)}
#kn{position:absolute;top:9px;left:0;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;box-shadow:0 0 6px #0008;transform:translateX(0)}
#tip{position:absolute;bottom:34px;left:0;padding:4px 8px;border-radius:8px;font-size:12px;background:rgba(0,0,0,.75);opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
#tip.on{opacity:1}
.br{display:flex;align-items:center;gap:0}
.br .sp{flex:1}
.chip{height:34px;padding:0 10px;border-radius:17px;font-size:13px;font-weight:700}
.chip:active{background:rgba(255,255,255,.16)}
.sfx{position:absolute;top:0;bottom:0;width:42%;display:grid;place-items:center;pointer-events:none;opacity:0}
.sfx.l{left:0;border-radius:0 50% 50% 0}.sfx.r{right:0;border-radius:50% 0 0 50%}
.sfx.on{animation:sfx .8s var(--ease) forwards}
.rp{display:grid;justify-items:center;gap:4px;font-weight:700;font-size:15px}
@keyframes sfx{0%{opacity:0;background:#fff0}15%{opacity:1;background:#fff2}70%{opacity:1}100%{opacity:0}}
#hud{position:absolute;top:calc(var(--top) + 28px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:16px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;min-width:150px;justify-content:center}
#hud.on{opacity:1}
#hbar{width:90px;height:4px;border-radius:2px;background:#fff4;overflow:hidden}
#hbar i{display:block;height:100%;background:#fff;transform-origin:left}
#busy{position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-23px;border:3px solid #fff3;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;display:none;pointer-events:none}
#busy.on{display:block}
#err{position:absolute;inset:0;display:none;place-items:center;align-content:center;gap:14px;text-align:center;background:#000b;z-index:4;padding:24px}
#err.on{display:grid}
#err button{background:var(--g);border-radius:22px;padding:10px 26px;font-weight:700}
#unl{position:absolute;left:calc(var(--l) + 16px);bottom:calc(var(--bot) + 20px);display:none;z-index:3}
#unl.on{display:grid}
#menu{position:absolute;right:calc(var(--rt) + 14px);bottom:calc(var(--bot) + 96px);width:min(280px,calc(100% - 28px));max-height:min(60%,360px);overflow:auto;border-radius:16px;padding:6px;display:none;z-index:5;background:rgba(28,28,30,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 12px 40px #000a}
#menu.on{display:block;animation:pop .18s var(--ease)}
.mh{font-size:12px;color:var(--t2);padding:8px 10px;text-transform:uppercase;letter-spacing:.5px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:12px 10px;border-radius:10px;text-align:left;font-size:15px}
.mi:active{background:#fff2}.mi:disabled{opacity:.45}
.mi small{margin-left:auto;color:var(--t2);font-size:13px}
.mi.a{color:var(--g)}
#eps{position:absolute;left:0;right:0;bottom:0;max-height:55%;overflow:auto;z-index:6;background:rgba(28,28,30,.97);border-radius:20px 20px 0 0;padding:14px calc(var(--rt) + 16px) calc(var(--bot) + 16px) calc(var(--l) + 16px);transform:translateY(100%);visibility:hidden;transition:transform .35s var(--ease),visibility 0s .35s}
#eps.on{transform:none;visibility:visible;transition:transform .35s var(--ease)}
.eh{font-weight:700;margin:10px 0 8px;color:var(--g)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.eb{background:var(--s2);border-radius:10px;padding:10px 0;font-weight:600;font-size:13px}
.eb.a{background:var(--g)}
#toast{position:fixed;left:50%;bottom:calc(var(--bot) + 90px);transform:translate(-50%,12px);z-index:5000;background:rgba(28,28,30,.94);border:1px solid var(--line);border-radius:99px;padding:8px 18px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== tvOS 26 liquid-glass shell ===== */
.lg{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05));backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.06),0 18px 48px rgba(0,0,0,.5)}
.mb{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none}
.cat{scroll-margin-top:70px}.hero{padding-bottom:112px}
#home{transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .55s}
body.menu #home{transform:scale(.95) translateX(10px);opacity:.55}
#scrim{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .45s}
body.menu #scrim{opacity:1;pointer-events:auto}
#side{position:fixed;z-index:300;left:calc(var(--l) + 10px);top:calc(var(--top) + 10px);bottom:calc(var(--bot) + 10px);width:min(80vw,300px);border-radius:30px;padding:18px 12px;display:flex;flex-direction:column;overflow:hidden;transform:translateX(-112%) scale(.94);opacity:0;transition:transform .6s cubic-bezier(.2,.9,.25,1),opacity .35s}
#side.open{transform:none;opacity:1}
.sph{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(#ffffff55,#ffffff1f);display:grid;place-items:center;font-size:12px;font-weight:700}
.sph b{font-size:15px;font-weight:600}.sph time{margin-left:auto;font-size:13px;color:#ffffffb3}
#sl{position:relative;flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
#ind{position:absolute;left:0;right:0;top:0;border-radius:18px;background:rgba(255,255,255,.88);box-shadow:0 6px 18px rgba(0,0,0,.28);transition:transform .5s cubic-bezier(.34,1.3,.5,1),height .3s;pointer-events:none}
.sbi{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;font-size:15px;font-weight:500;text-align:left;opacity:0;transform:translateX(-14px);transition:opacity .4s,transform .5s cubic-bezier(.2,.9,.25,1),color .25s;transition-delay:calc(var(--i)*35ms)}
#side.open .sbi{opacity:1;transform:none}
.sbi .i{width:19px;height:19px}.sbi.on{color:#111}
.sbi .dot{width:19px;height:19px;border-radius:50%;flex:none}
.slab{font-size:12px;color:#ffffff8c;padding:16px 14px 6px;font-weight:600}
.mc .po{transition:transform .35s cubic-bezier(.2,.9,.25,1),box-shadow .35s}
.mc:active{transform:none}.mc:active .po{transform:scale(1.07) translateY(-3px);box-shadow:0 18px 30px #000a,inset 0 0 0 1px #fff4}
#dock{position:absolute;z-index:3;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;padding:10px;border-radius:26px;max-width:calc(100% - 28px)}
#dock button{width:52px;height:52px;border-radius:15px;overflow:hidden;flex:none;transition:transform .4s cubic-bezier(.34,1.4,.5,1),box-shadow .3s}
#dock button.on{transform:scale(1.18) translateY(-4px);box-shadow:0 10px 22px #0008,0 0 0 2px #fffc}
#dock img{width:100%;height:100%;object-fit:cover;display:block}
#sp{position:fixed;inset:0;z-index:200;overflow:auto;background:linear-gradient(165deg,#2a4068,#101a2e 62%,#070b14);padding:calc(var(--top) + 64px) 18px calc(var(--bot) + 24px);transform:translateY(18px) scale(.98);opacity:0;visibility:hidden;transition:transform .5s cubic-bezier(.2,.9,.25,1),opacity .4s,visibility 0s .5s}
#sp.on{transform:none;opacity:1;visibility:visible;transition:transform .5s cubic-bezier(.2,.9,.25,1),opacity .4s}
#sqh{font-size:clamp(26px,8.2vw,42px);font-weight:700;line-height:1.15;color:rgba(214,226,244,.85);min-height:2.3em;word-break:break-word}
#sqh.in{color:#fff}
#kb{display:flex;gap:6px;overflow-x:auto;margin:14px 0 4px;padding-bottom:10px;border-bottom:1px solid #fff3}
#kb button{flex:none;min-width:34px;height:40px;padding:0 8px;border-radius:12px;font-size:21px;font-weight:500;color:#ffffffd9;transition:background .2s,transform .2s}
#kb button:active{background:rgba(255,255,255,.88);color:#111;transform:scale(1.12)}
#kb .w{font-size:13px;padding:0 12px;background:#ffffff26}
.slab2{font-size:19px;font-weight:700;margin:20px 0 12px;color:#ffffffd9}
#sres{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
#sres .mc{flex:none}#sres .po{height:156px}
#spx{position:fixed;z-index:210;left:calc(var(--l) + 14px);top:calc(var(--top) + 12px)}

/* ===== v3: font, ambient glass, 3D hero, iOS player ===== */
@font-face{font-family:VIP;src:url(https://raw.githubusercontent.com/itsmems97/itsmems97.github.io/main/VIP.ttf) format("truetype");font-display:swap}
*,button,input{font-family:VIP,-apple-system,"SF Pro Text",Roboto,sans-serif}
:root{--cr:36px;--gl:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05))}
body{background:transparent}
#frame{position:fixed;inset:0;z-index:9000;pointer-events:none;border-radius:var(--cr);box-shadow:0 0 0 60px #000}
#amb,#pamb{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#05070d}
#pamb{position:absolute;z-index:0}
#amb::after,#pamb::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.55))}
.ac{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .9s}.ac.on{opacity:1}
html.lk,html.lk body{overflow:hidden;height:100%}
#side,#sl,#sp{overscroll-behavior:contain}
.ring img{width:58px;height:58px;object-fit:contain;animation:spin 1.1s linear infinite reverse}
.hl2{height:38px;width:38px;object-fit:contain;flex:none;border-radius:11px}
.slg{height:36px;width:36px;object-fit:contain;flex:none}
.sw{max-width:none}
/* hero: rounded 3D card */
.hero{margin:calc(var(--top) + 62px) 14px 0;height:58svh;min-height:360px;padding-bottom:96px;border-radius:32px;background:transparent;touch-action:pan-y;
 box-shadow:0 26px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.18);
 transform:perspective(900px) rotateX(calc(var(--rx,0)*1deg)) rotateY(calc(var(--ry,0)*1deg));transition:transform .55s var(--ease);will-change:transform}
.hero.drag{transition:none}
.hero #hb{transform:scale(1.1) translate(calc(var(--ry,0)*-1.4px),calc(var(--rx,0)*1.4px));transition:transform .55s var(--ease)}
.hero.drag #hb{transition:none}
.hc{transform:translate(calc(var(--ry,0)*1.6px),calc(var(--rx,0)*-1.2px))}
#dock{bottom:14px;padding:8px;border-radius:22px}
#dock button{width:42px;height:42px;border-radius:13px}
.hero #dock img{position:static;animation:none}
/* glass sections (cheap faux-glass: backdrop is already blurred) */
.cat{margin:16px 14px 0;padding:14px 4px 6px 12px;background:var(--gl);border:1px solid rgba(255,255,255,.16);border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 14px 30px rgba(0,0,0,.28)}
#cats{padding-bottom:30px}
.row .mc{opacity:0;transform:translateX(-14px);transition:opacity .45s,transform .55s cubic-bezier(.2,.9,.25,1)}
.row.in:not(.done) .mc{transition-delay:calc(var(--i,0)*40ms)}
.row.in .mc{opacity:1;transform:none}
.row.in .mc:active{transform:none}
/* iOS style player */
#player{background:#000}#v{background:transparent}
#ctl{background:linear-gradient(#0009,#0000 24%,#0000 58%,#000b)}
#ctl .b{background:rgba(60,60,67,.55);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28);transition:transform .2s,background .2s}
#ctl .b:active{transform:scale(.9);background:rgba(130,130,140,.6)}
#ctl .big{width:72px;height:72px;background:rgba(255,255,255,.2)}
.br{padding:5px 8px;border-radius:30px;background:rgba(40,40,44,.62);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);overflow-x:auto;margin-top:6px}
#ctl .br .b{width:38px;height:38px;background:none;border:0;box-shadow:none}
.br .sp{min-width:0}
.trk{height:6px;top:14px;border-radius:3px}#kn{top:10px;width:14px;height:14px;margin-left:-7px}
#menu{border-radius:22px;background:rgba(40,40,44,.8);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);border:1px solid rgba(255,255,255,.18)}
.mi+.mi{box-shadow:0 -1px 0 rgba(255,255,255,.07);border-radius:0}
#eps{border-radius:28px 28px 0 0;background:rgba(36,36,40,.84);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);border-top:1px solid rgba(255,255,255,.18)}

<script>
(() => {
'use strict';
/* ===== Config (existing backend contract is unchanged) ===== */
const API = "https://pika-movie-box.duckdns.org/api";
const CFG = {ctlHide: 5000, tapMs: 300, swipePx: 12, zoomMin: .5, zoomMax: 5, briMin: .3, briMax: 1.6};
const $ = id => document.getElementById(id);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const px = u => `${API}/proxy?url=${encodeURIComponent(u)}`;
const cov = m => typeof m.cover === 'string' ? m.cover : (m.cover?.url || m.coverUrl || m.image || '');
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(r).padStart(2, '0'); };
document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = ic(e.dataset.ic));

/* ===== Toast ===== */
const toastEl = $('toast'); let toastT = 0;
function toast(msg, ms = 2000) { (document.fullscreenElement || document.webkitFullscreenElement || document.body).appendChild(toastEl); toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), ms); }

/* ===== Splash (never sticks: hides after home settles, plus a failsafe) ===== */
const t0 = performance.now(); let splGone = false;
function hideSplash() {
  if (splGone) return; splGone = true;
  setTimeout(() => { const s = $('spl'); if (!s) return; s.classList.add('out'); setTimeout(() => s.remove(), 500); }, Math.max(0, 700 - (performance.now() - t0)));
}
setTimeout(hideSplash, 6000);

/* ===== Ambient blurred backdrop (tiny canvas, upscaled = free blur) ===== */
function draw(box, s, sx, sy, sw, sh) {
  try { const [a, b] = box.children, c = a.classList.contains('on') ? b : a, o = c === a ? b : a, x = c.getContext('2d'), r = Math.max(c.width / sw, c.height / sh);
    x.filter = 'blur(2px) saturate(1.7)'; x.drawImage(s, sx, sy, sw, sh, (c.width - sw * r) / 2, (c.height - sh * r) / 2, sw * r, sh * r); c.classList.add('on'); o.classList.remove('on'); } catch (_) {}
}
function ambImg(box, u) { const i = new Image(); i.onload = () => draw(box, i, 0, 0, i.width, i.height); i.src = u; }
const bc = document.createElement('canvas'); bc.width = 64; bc.height = 36;
function scan() { /* finds baked-in black bars (needs CORS-clean video; otherwise falls back to a fixed crop) */
  try { const x = bc.getContext('2d', {willReadFrequently: true}); x.drawImage(v, 0, 0, 64, 36); const d = x.getImageData(0, 0, 64, 36).data;
    const row = y => { let s = 0; for (let i = 0; i < 64; i++) { const k = (y * 64 + i) * 4; s += d[k] + d[k + 1] + d[k + 2]; } return s / 192; };
    const col = i => { let s = 0; for (let y = 0; y < 36; y++) { const k = (y * 64 + i) * 4; s += d[k] + d[k + 1] + d[k + 2]; } return s / 108; };
    if (row(18) < 25) return;
    let t = 0, b = 0, l = 0, r = 0; while (t < 7 && row(t) < 22) t++; while (b < 7 && row(35 - b) < 22) b++; while (l < 12 && col(l) < 22) l++; while (r < 12 && col(63 - r) < 22) r++;
    const n = {t: t ? (t + .6) / 36 : 0, b: b ? (b + .6) / 36 : 0, l: l ? (l + .6) / 64 : 0, r: r ? (r + .6) / 64 : 0}, o = P.bars;
    P.bars = o ? {t: Math.min(o.t, n.t), b: Math.min(o.b, n.b), l: Math.min(o.l, n.l), r: Math.min(o.r, n.r)} : n; P.bn = (P.bn || 0) + 1;
  } catch (_) { P.bars = null; }
}
function applyBars() {
  const b = P.bars; if (!b || (P.bn || 0) < 3 || S.mode !== 'fit' || S.z.s !== 1 || !v.videoWidth) { v.style.clipPath = ''; return; }
  const W = surf.clientWidth, H = surf.clientHeight, vw = v.videoWidth, vh = v.videoHeight, s = Math.min(W / vw, H / vh), w = vw * s, h = vh * s, x = (W - w) / 2, y = (H - h) / 2;
  v.style.clipPath = `inset(${y + h * b.t}px ${x + w * b.r}px ${y + h * b.b}px ${x + w * b.l}px)`;
}
setInterval(() => { if (!(P.open && !v.paused && !document.hidden && v.videoWidth)) return; scan(); const W = v.videoWidth, H = v.videoHeight, b = P.bars || {t: .14, b: .14, l: 0, r: 0};
  draw($('pamb'), v, W * b.l, H * b.t, W * (1 - b.l - b.r), H * (1 - b.t - b.b)); applyBars(); }, 1500);
window.addEventListener('resize', () => applyBars());
/* ===== Home ===== */
const home = $('home'), cats = $('cats');
let heroItems = [], heroI = 0;
window.addEventListener('scroll', () => $('hd').classList.toggle('sc', scrollY > 50), {passive: true});
let lastH = -1, lastD = -1;
function setHero(i) {
  const it = heroItems[i]; if (!it) return;
  const hr0 = document.querySelector('.hero'), dd = lastH < 0 || i === lastH ? 0 : (i > lastH ? 1 : -1); lastH = i;
  if (dd && hr0.animate) hr0.animate([{transform: `perspective(900px) rotateY(${dd * -38}deg) translateZ(-80px) scale(.9)`, opacity: .3}, {transform: 'perspective(900px) rotateY(0deg) translateZ(0) scale(1)', opacity: 1}], {duration: 750, easing: 'cubic-bezier(.2,.9,.25,1)'}); const s = it.subject || it;
  const img = $('hb'), u = cov(s) || cov(it); img.hidden = !u; if (u) { img.src = px(u); ambImg($('amb'), px(u)); }
  $('ht').textContent = s.title || it.title || 'Unknown';
  $('hm').textContent = [s.releaseDate, s.genre, s.imdbRatingValue && 'IMDb ' + s.imdbRatingValue].filter(Boolean).join('  |  ');
  $('hw').onclick = () => openTitle(s.detailPath || it.detailPath, s.title || it.title);
  markDock();
}
async function loadHome() {
  cats.innerHTML = '<div class="cat"><div class="row">' + '<div class="sk"></div>'.repeat(6) + '</div></div>';
  try {
    const d = (await (await fetch(`${API}/home`)).json()).data, lists = d.operatingList || [];
    const ban = lists.find(o => o.type === 'BANNER'); heroItems = ban?.banner?.items || ban?.subjects || [];
    if (!heroItems.length) { const f = lists.find(o => o.subjects?.length)?.subjects || []; heroItems = f.slice(0, 5); }
    setHero(0);
    cats.innerHTML = lists.filter(o => o.subjects?.length).map(o => `<section class="cat"><h2>${esc(o.title)}</h2><div class="row">` +
      o.subjects.map(m => `<div class="mc" data-p="${esc(m.detailPath || m.subjectId)}" data-t="${esc(m.title)}"><img class="po" src="${px(cov(m))}" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" draggable="false"><div class="mt">${esc(m.title)}</div></div>`).join('') +
      '</div></section>').join('') || '<div class="empty">Nothing to show yet.</div>';
    buildSide(lists); buildDock();
    const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; const r = e.target; io.unobserve(r);
      [...r.children].forEach((c, i) => c.style.setProperty('--i', Math.min(i, 8))); r.classList.add('in'); setTimeout(() => r.classList.add('done'), 1300); }), {threshold: .12});
    cats.querySelectorAll('.row').forEach(r => io.observe(r));
  } catch (e) {
    console.error('Home error', e);
    cats.innerHTML = '<div class="empty">Could not load content.<br><button id="rh">Retry</button></div>';
    $('rh').onclick = loadHome;
  } finally { hideSplash(); }
}
home.addEventListener('click', e => { const c = e.target.closest('[data-p]'); if (c) openTitle(c.dataset.p, c.dataset.t); });
home.addEventListener('error', e => { if (e.target.classList?.contains('po')) e.target.classList.add('bad'); }, true);
setInterval(() => { if (P.open || document.hidden || heroItems.length < 2) return; heroI = (heroI + 1) % heroItems.length; setHero(heroI); }, 5000);

/* ===== Search ===== */
const q = $('q'), sug = $('sug'); let qT = 0, qTok = 0;
q.addEventListener('input', () => {
  const s = q.value.trim(); clearTimeout(qT);
  if (s.length < 2) { sug.style.display = 'none'; return; }

    const tk = ++qTok;
    try {
      const items = (await (await fetch(`${API}/search?q=${encodeURIComponent(s)}`)).json()).data?.items || [];
      if (tk !== qTok) return;
      sug.innerHTML = items.length ? items.map(m => `<div class="si" data-p="${esc(m.detailPath)}" data-t="${esc(m.title)}"><img src="${px(cov(m))}" alt="" referrerpolicy="no-referrer"><span>${esc(m.title)}</span></div>`).join('')
        : '<div class="empty" style="padding:16px">No results found</div>';
      sug.style.display = 'flex';
    } catch (e) { console.error('Search error', e); }
  }, 400);
});
sug.addEventListener('click', e => { const c = e.target.closest('[data-p]'); if (!c) return; sug.style.display = 'none'; q.value = ''; q.blur(); openTitle(c.dataset.p, c.dataset.t); });
document.addEventListener('click', e => { if (!e.target.closest('.sw')) sug.style.display = 'none'; });

/* ===== Player state ===== */
const v = $('v'), player = $('player'), surf = $('surf'), ctl = $('ctl'), menu = $('menu'), epsEl = $('eps');
const P = {open: false, tk: 0, eps: [], i: -1, streams: [], q: -1, cur: '', caps: [], audios: [], sub: -1, aud: 0, type: '', sid: '', path: '', blobs: [], onMeta: null};
const S = {locked: false, drag: false, dragT: 0, ctlOn: true, timer: 0, raf: 0, menu: '', mode: 'fit', z: {s: 1, x: 0, y: 0}, bri: 1, unlT: 0, hudT: 0, sbW: 1};
const MODES = {fit: ['contain', 'Fit'], fill: ['cover', 'Fill'], stretch: ['fill', 'Stretch'], zoom: ['contain', 'Zoom'], orig: ['scale-down', 'Original']};
const SPEEDS = [.25, .5, .75, 1, 1.25, 1.5, 1.75, 2];

/* ----- busy / error ----- */

  tap.t = now; clearTimeout(tap.timer);

/* ===== Fullscreen + landscape (real APIs first, CSS fallback) ===== */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const isFs = () => !!fsEl() || player.classList.contains('imm');

  try {
    const rq = player.requestFullscreen || player.webkitRequestFullscreen;
    if (!rq) throw 0; await rq.call(player);
  } catch (_) { player.classList.add('imm'); }   // iPhone Safari cannot fullscreen arbitrary elements
  try { await screen.orientation.lock('landscape'); }
  catch (_) { if (matchMedia('(orientation:portrait)').matches) toast(IOS ? 'iOS cannot lock orientation \u2013 rotate your phone' : 'Rotate your phone for landscape', 3000); }
  syncFs();
}

  try { screen.orientation.unlock(); } catch (_) {}

  try { if (fsEl()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (_) {}
  syncFs();

$('bFs').onclick = () => { toggleFs(); showCtl(); };
['fullscreenchange', 'webkitfullscreenchange'].forEach(n => document.addEventListener(n, () => { if (!fsEl()) { try { screen.orientation.unlock(); } catch (_) {} } syncFs(); }));

/* ===== Open / close ===== */

  P.open = true; player.classList.add('on'); document.body.classList.add('pl');
  $('ttl').textContent = title || ''; P.bars = null; P.bn = 0; P.streams = []; P.eps = []; P.i = -1; P.cur = ''; P.caps = []; P.audios = [];
  $('bQ').textContent = 'Auto'; $('bEps').hidden = true; $('bPrev').disabled = $('bNext').disabled = true;
  S.locked = false; $('unl').classList.remove('on'); closeMenu(); closeEps(); clearTracks(); setMode('fit'); setBri(1); $('hud').classList.remove('on');
  v.playbackRate = 1; showErr(''); paint(); showCtl();
}

}

/* ===== tvOS 26 liquid-glass shell: side menu, search page, hero dock ===== */
const side = $('side'), sl = $('sl'), sp = $('sp'), sres = $('sres');
let sideBtns = [], rowsData = [], clkT = 0, sq = '', sTok = 0, sT = 0;
const pad2 = n => String(n).padStart(2, '0');
function tick() { const d = new Date(); $('clk').textContent = (d.getHours() % 12 || 12) + ':' + pad2(d.getMinutes()) + ' ' + (d.getHours() < 12 ? 'AM' : 'PM'); }
function buildSide(lists) {
  rowsData = lists.filter(o => o.subjects?.length);
  const b = (k, t, ico, n) => `<button class="sbi" data-k="${k}" style="--i:${n}">${ico}<span>${t}</span></button>`;
  sl.innerHTML = '<i id="ind"></i>' + b('search', 'Search', ic('search'), 0) + b('home', 'Home', ic('home'), 1) + '<div class="slab">Browse</div>' +
    rowsData.map((o, n) => b('row' + n, esc(o.title), `<i class="dot" style="background:hsl(${n * 47 + 20} 70% 55%)"></i>`, n + 3)).join('');
  sideBtns = [...sl.querySelectorAll('.sbi')]; setActive('home');
}
function setActive(k) {
  const el = sideBtns.find(b => b.dataset.k === k), ind = $('ind'); if (!el || !ind) return;
  sideBtns.forEach(b => b.classList.toggle('on', b === el));
  ind.style.height = el.offsetHeight + 'px'; ind.style.transform = `translateY(${el.offsetTop}px)`;
}
function openSide() { if (P.open) return; side.classList.add('open'); document.body.classList.add('menu'); document.documentElement.classList.add('lk'); tick(); clearInterval(clkT); clkT = setInterval(tick, 30000); requestAnimationFrame(() => setActive(sideBtns.find(b => b.classList.contains('on'))?.dataset.k)); }
function closeSide() { side.classList.remove('open'); document.body.classList.remove('menu'); document.documentElement.classList.remove('lk'); clearInterval(clkT); }
$('scrim').addEventListener('touchmove', e => e.preventDefault(), {passive: false}); $('mbtn').onclick = openSide; $('scrim').onclick = closeSide;
sl.addEventListener('click', e => {
  const b = e.target.closest('.sbi'); if (!b) return; const k = b.dataset.k; setActive(k);
  setTimeout(() => {
    closeSide();
    if (k === 'search') { openSearch(); return; }
    closeSearch();
    if (k === 'home') scrollTo({top: 0, behavior: 'smooth'}); else cats.children[+k.slice(3)]?.scrollIntoView({behavior: 'smooth'});
  }, 280);
});
let ex = null;   // swipe in from the left edge opens the menu; swipe left on the menu closes it
document.addEventListener('touchstart', e => { ex = e.touches.length === 1 ? {x: e.touches[0].clientX, edge: e.touches[0].clientX < 22} : null; }, {passive: true});
document.addEventListener('touchmove', e => {
  if (!ex) return; const dx = e.touches[0].clientX - ex.x;
  if (ex.edge && dx > 50 && !P.open) { ex = null; openSide(); } else if (!ex.edge && dx < -60 && side.classList.contains('open')) { ex = null; closeSide(); }
}, {passive: true});

/* Search page: big title, a-z row and Browse row, wired to the existing /search endpoint */
$('kb').innerHTML = '<button class="w" data-c=" ">space</button>' + [...'abcdefghijklmnopqrstuvwxyz0123456789'].map(c => `<button data-c="${c}">${c}</button>`).join('') + '<button class="w" data-c="\b">delete</button>';
function browse() { $('sbl').textContent = 'Browse'; sres.innerHTML = (rowsData[0]?.subjects || []).slice(0, 12).map(cardHtml).join(''); }
const cardHtml = m => `<div class="mc" data-p="${esc(m.detailPath || m.subjectId)}" data-t="${esc(m.title)}"><img class="po" src="${px(cov(m))}" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" draggable="false"><div class="mt">${esc(m.title)}</div></div>`;
function renderQ() {
  const h = $('sqh'); h.textContent = sq || 'Movies, Shows, Cast, and More'; h.classList.toggle('in', !!sq); clearTimeout(sT);
  if (sq.trim().length < 2) { sTok++; browse(); return; }
  sT = setTimeout(async () => {
    const tk = ++sTok;
    try {
      const items = (await (await fetch(`${API}/search?q=${encodeURIComponent(sq.trim())}`)).json()).data?.items || [];
      if (tk !== sTok) return; $('sbl').textContent = items.length ? 'Results' : 'No results found'; sres.innerHTML = items.map(cardHtml).join('');
    } catch (e) { if (tk === sTok) $('sbl').textContent = 'Search failed \u2013 check your connection'; }
  }, 300);
}
$('kb').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const c = b.dataset.c; sq = c === '\b' ? sq.slice(0, -1) : sq + c; renderQ(); });
sp.addEventListener('click', e => { const c = e.target.closest('.mc'); if (c) openTitle(c.dataset.p, c.dataset.t); });
function openSearch() { sp.classList.add('on'); document.body.classList.add('pl'); renderQ(); }
function closeSearch() { if (!sp.classList.contains('on')) return; sp.classList.remove('on'); if (!P.open) document.body.classList.remove('pl'); }
$('spx').onclick = () => { closeSearch(); setActive('home'); };

/* Hero dock (Top Shelf style): tap a tile to switch the featured title */
function buildDock() { $('dock').innerHTML = heroItems.slice(0, 6).map((it, n) => { const s = it.subject || it; return `<button data-n="${n}" aria-label="${esc(s.title || it.title)}"><img src="${px(cov(s) || cov(it))}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"></button>`; }).join(''); markDock(); }
function markDock() { document.querySelectorAll('#dock button').forEach((b, n) => { b.classList.toggle('on', n === heroI); if (n === heroI && lastD !== heroI && b.animate) b.animate([{transform: 'perspective(240px) rotateY(-85deg) scale(.7)'}], {duration: 600, easing: 'cubic-bezier(.34,1.4,.5,1)'}); }); lastD = heroI; }
$('dock').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { heroI = +b.dataset.n; setHero(heroI); } });
document.querySelectorAll('[data-ic]').forEach(e => { if (!e.innerHTML) e.innerHTML = ic(e.dataset.ic); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSide(); if (!P.open) closeSearch(); } });

/* ===== 3D hero: drag to tilt, swipe to change ===== */
const hero = document.querySelector('.hero'); let hs = null, hr = 0;
const tilt = (a, b) => { hero.style.setProperty('--rx', a); hero.style.setProperty('--ry', b); };
hero.addEventListener('touchstart', e => { const t = e.touches[0]; hs = {x: t.clientX, y: t.clientY, dx: 0}; hero.classList.add('drag'); }, {passive: true});
hero.addEventListener('touchmove', e => { if (!hs) return; const t = e.touches[0]; hs.dx = t.clientX - hs.x; const dy = t.clientY - hs.y, dx = hs.dx;
  cancelAnimationFrame(hr); hr = requestAnimationFrame(() => tilt(clamp(-dy / 12, -7, 7).toFixed(1), clamp(dx / 12, -9, 9).toFixed(1))); }, {passive: true});
const hend = () => { if (!hs) return; const d = hs.dx; hs = null; cancelAnimationFrame(hr); hero.classList.remove('drag'); tilt(0, 0);
  if (Math.abs(d) > 60 && heroItems.length > 1) { heroI = (heroI + (d < 0 ? 1 : heroItems.length - 1)) % heroItems.length; setHero(heroI); } };
hero.addEventListener('touchend', hend); hero.addEventListener('touchcancel', hend);

loadHome();
})();
</script>
</body>
</html>
