<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pika Movies</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0f13; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  /* HEADER */
  .header { background: #0f0f13; position: sticky; top: 0; z-index: 100; padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1e1e2a; }
  .logo { font-size: 22px; font-weight: 700; color: #e63946; letter-spacing: -0.5px; flex-shrink: 0; }
  .logo span { color: #fff; }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap input { width: 100%; background: #1a1a24; border: 1px solid #2a2a38; border-radius: 24px; padding: 10px 44px 10px 16px; color: #fff; font-size: 14px; outline: none; }
  .search-wrap input::placeholder { color: #666; }
  .search-wrap input:focus { border-color: #e63946; }
  .search-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #aaa; font-size: 16px; }

  /* HERO */
  .hero { position: relative; height: 220px; overflow: hidden; background: #1a1a24; }
  .hero-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
  .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, #0f0f13 30%, transparent); display: flex; align-items: flex-end; padding: 16px; }
  .hero-info { }
  .hero-badge { background: #e63946; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 6px; }
  .hero-title { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .hero-meta { font-size: 12px; color: #aaa; margin-top: 4px; }
  .hero-play { margin-top: 10px; background: #e63946; border: none; color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }

  /* SECTION */
  .section { padding: 20px 16px 0; }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; width: 3px; height: 16px; background: #e63946; border-radius: 2px; display: block; }

  /* CARDS SCROLL */
  .cards-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px; scrollbar-width: none; }
  .cards-scroll::-webkit-scrollbar { display: none; }

  /* CARD */
  .card { flex-shrink: 0; width: 120px; cursor: pointer; }
  .card-thumb { width: 120px; height: 170px; border-radius: 10px; overflow: hidden; background: #1a1a24; position: relative; }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
  .card:active .card-thumb img { transform: scale(1.04); }
  .card-corner { position: absolute; top: 6px; right: 6px; background: #e63946; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
  .card-imdb { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.7); font-size: 9px; padding: 2px 5px; border-radius: 3px; color: #f5c518; }
  .card-title { font-size: 11px; color: #ccc; margin-top: 7px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* SEARCH RESULTS */
  .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
  .results-grid .card { width: 100%; }
  .results-grid .card-thumb { width: 100%; }

  /* LOADING */
  .loading { text-align: center; padding: 40px; color: #555; font-size: 14px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #222; border-top-color: #e63946; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* EMPTY */
  .empty { text-align: center; padding: 60px 16px; color: #555; }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* NAV */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f0f13; border-top: 1px solid #1e1e2a; display: flex; z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0 12px; cursor: pointer; font-size: 10px; color: #555; gap: 4px; }
  .nav-item.active { color: #e63946; }
  .nav-icon { font-size: 20px; }

  .page { display: none; padding-bottom: 70px; }
  .page.active { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Pika<span>Movies</span></div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search movies, series..." />
    <button class="search-btn" onclick="doSearch()">🔍</button>
  </div>
</div>

<!-- HOME PAGE -->
<div class="page active" id="page-home">
  <div class="hero" id="heroSection" style="display:none">
    <img class="hero-img" id="heroImg" src="" alt="">
    <div class="hero-overlay">
      <div class="hero-info">
        <div class="hero-badge" id="heroBadge">New</div>
        <div class="hero-title" id="heroTitle"></div>
        <div class="hero-meta" id="heroMeta"></div>
        <button class="hero-play" id="heroPlay">▶ Watch Now</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Recommended</div>
    <div class="cards-scroll" id="recCards">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
  </div>
</div>

<!-- SEARCH PAGE -->
<div class="page" id="page-search">
  <div class="section" style="padding-top:16px">
    <div class="section-title" id="searchTitle">Results</div>
  </div>
  <div class="results-grid" id="searchResults">
    <div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Searching...</div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active" id="nav-home" onclick="showPage('home')">
    <div class="nav-icon">🏠</div>Home
  </div>
  <div class="nav-item" id="nav-search" onclick="focusSearch()">
    <div class="nav-icon">🔍</div>Search
  </div>
</div>

<script>
const API = 'https://pikamovie-api.duckdns.org/movie2';
// Seed subjectId for home recommendations
const SEED_ID = '6164881272604084120';

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
}

function focusSearch() {
  showPage('search');
  document.getElementById('nav-search').classList.add('active');
  document.getElementById('nav-home').classList.remove('active');
  document.getElementById('searchInput').focus();
}

function goPlayer(detailPath) {
  window.location.href = 'player.html?path=' + encodeURIComponent(detailPath);
}

function cardHTML(item) {
  const cover = item.cover?.url || '';
  const corner = item.corner ? `<div class="card-corner">${item.corner}</div>` : '';
  const imdb = item.imdbRatingValue ? `<div class="card-imdb">⭐ ${item.imdbRatingValue}</div>` : '';
  return `
    <div class="card" onclick="goPlayer('${item.detailPath}')">
      <div class="card-thumb">
        <img src="${cover}" alt="${item.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/120x170/1a1a24/555?text=No+Image'">
        ${corner}${imdb}
      </div>
      <div class="card-title">${item.title}</div>
    </div>`;
}

// Load home recommendations
async function loadHome() {
  try {
    const res = await fetch(`${API}/api/rec?subjectId=${SEED_ID}&page=1&perPage=24`);
    const json = await res.json();
    const items = json?.data?.items || [];
    if (!items.length) { document.getElementById('recCards').innerHTML = '<div class="empty"><div class="empty-icon">🎬</div>Nothing found</div>'; return; }

    // Hero — first item
    const hero = items[0];
    document.getElementById('heroImg').src = hero.cover?.url || '';
    document.getElementById('heroTitle').textContent = hero.title;
    document.getElementById('heroMeta').textContent = [hero.genre?.split(',')[0], hero.countryName, hero.releaseDate?.slice(0,4)].filter(Boolean).join(' · ');
    document.getElementById('heroBadge').textContent = hero.corner || 'Featured';
    document.getElementById('heroPlay').onclick = () => goPlayer(hero.detailPath);
    document.getElementById('heroSection').style.display = '';

    document.getElementById('recCards').innerHTML = items.map(cardHTML).join('');
  } catch(e) {
    document.getElementById('recCards').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Failed to load</div>';
  }
}

// Search via netnaija
function doSearch() {
  const kw = document.getElementById('searchInput').value.trim();
  if (!kw) return;
  showPage('search');
  document.getElementById('nav-search').classList.add('active');
  document.getElementById('nav-home').classList.remove('active');
  document.getElementById('searchTitle').textContent = `Results for "${kw}"`;
  document.getElementById('searchResults').innerHTML = '<div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Searching...</div>';
  // Redirect to netnaija search — results open in player
  window.open(`https://netnaija.film/search-results?kw=${encodeURIComponent(kw)}`, '_blank');
  document.getElementById('searchResults').innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔗</div>Search opened in browser.<br><small style="color:#666">Tap a result there, copy the detailPath, then come back.</small></div>';
}

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

loadHome();
</script>
</body>
</html>
