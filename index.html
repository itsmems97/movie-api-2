(function () {

  function pick() {
    var o = (location.search.match(/[?&]view=(tv|desktop|tablet|phone|auto)/) || [])[1];
    try { if (o === 'auto') localStorage.removeItem('pk_view'); else if (o) localStorage.setItem('pk_view', o); else o = localStorage.getItem('pk_view'); } catch (e) {}
    if (o && o !== 'auto') return o;
    if (TV.test(ua)) return 'tv';
    var w = innerWidth, h = innerHeight, sh = Math.min(w, h), coarse = matchMedia('(pointer:coarse)').matches;
    if (coarse && sh < 600) return 'phone';
    if (coarse && sh < 1000 && w < 1100) return 'tablet';
    if (!coarse && w < 700) return 'phone';
    return 'desktop';
  }
  function set() { var v = pick(); if (d.dataset.dev !== v) d.dataset.dev = v; }
  set(); var t = 0; addEventListener('resize', function () { clearTimeout(t); t = setTimeout(set, 150); });
  window.__pkDev = set;
})();
</script>

<style>
/* ===== Design tokens ===== */
:root{--g:#30d158;--bg:#000;--s1:#1c1c1e;--s2:#2c2c2e;--t2:#8e8e93;--glass:rgba(34,34,36,.66);--line:rgba(255,255,255,.1);--ease:cubic-bezier(.25,.8,.25,1);
--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--l:env(safe-area-inset-left,0px);--rt:env(safe-area-inset-right,0px)}
/* ===== Base / native-app feel ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;scrollbar-width:none}

body.pl{overflow:hidden}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ===== Splash ===== */

/* ===== Header / search ===== */
header{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:12px;padding:calc(var(--top) + 8px) 16px 8px;background:linear-gradient(#000c,#0000);transition:background .3s}

 box-shadow:0 26px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.18);
 transform:perspective(900px) rotateX(calc(var(--rx,0)*1deg)) rotateY(calc(var(--ry,0)*1deg));transition:transform .55s var(--ease);will-change:transform}

/* iOS style player */
#player{background:#000}#v{background:transparent}
#ctl{background:linear-gradient(#0009,#0000 24%,#0000 58%,#000b)}
#ctl .b{background:rgba(60,60,67,.55);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28);transition:transform .2s,background .2s}
#ctl .b:active{transform:scale(.9);background:rgba(130,130,140,.6)}
#ctl .big{width:72px;height:72px;background:rgba(255,255,255,.2)}
.br{padding:5px 8px;border-radius:30px;background:rgba(40,40,44,.62);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);overflow-x:auto;margin-top:6px}
#ctl .br .b{width:38px;height:38px;background:none;border:0;box-shadow:none}
.br .sp{min-width:0}
.trk{height:6px;top:14px;border-radius:3px}#kn{top:10px;width:14px;height:14px;margin-left:-7px}
#menu{border-radius:22px;background:rgba(40,40,44,.8);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);border:1px solid rgba(255,255,255,.18)}
.mi+.mi{box-shadow:0 -1px 0 rgba(255,255,255,.07);border-radius:0}
#eps{border-radius:28px 28px 0 0;background:rgba(36,36,40,.84);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);border-top:1px solid rgba(255,255,255,.18)}
#eps::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:#fff5;margin:-4px auto 8px}
.eb{border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.1)}.eb.a{background:var(--g);color:#000}
#err{background:rgba(0,0,0,.5)}
#player.imm{height:100dvh}
/* ===== v4: iOS glass header/search, blurrier backdrop, dock fix ===== */
header{background:linear-gradient(rgba(0,0,0,.3),transparent)}
header.sc{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
header::before{content:"";position:absolute;inset:0 0 -12px;z-index:-1;pointer-events:none;opacity:0;transition:opacity .35s;background:rgba(20,22,28,.3);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
header.sc::before{opacity:1}
.mb{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.07));backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px rgba(0,0,0,.3);transition:transform .45s cubic-bezier(.34,1.5,.5,1)}
.mb:active{transform:scale(.88)}.mb .i{width:20px;height:20px;stroke-width:2.2}
#q{height:42px;border-radius:21px;padding:0 14px 0 40px;background:rgba(120,120,128,.26);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);caret-color:var(--g);transition:transform .5s cubic-bezier(.34,1.4,.5,1),background .3s,border-color .3s}
#q::placeholder{color:rgba(235,235,245,.5)}
#q:focus{transform:scale(1.025);background:rgba(120,120,128,.42);border-color:rgba(255,255,255,.34)}
.sw .i{left:14px;top:12px;width:18px;height:18px;transition:color .3s}.sw:focus-within .i{color:#fff}
#sug{top:50px;border-radius:22px;background:rgba(40,40,44,.74);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 44px rgba(0,0,0,.5);animation:pop .25s var(--ease)}
.si:active{background:rgba(255,255,255,.12)}
#amb::after{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.65))}
#pamb::after{background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.45))}
.cat{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03)),linear-gradient(rgba(8,10,14,.32),rgba(8,10,14,.32))}
#v{transition:clip-path .4s}
#dock{padding:11px;gap:10px}
#dock button{position:relative;width:40px;height:40px;border-radius:12px}
#dock button.on{transform:translateY(-2px) scale(1.1);box-shadow:0 8px 16px rgba(0,0,0,.5)}
#dock button.on::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9);pointer-events:none}
/* ===== v5: performance (no live backdrop blur on moving content) + iOS clear button + keyboard ===== */
.lg{backdrop-filter:none;-webkit-backdrop-filter:none}
#side.lg{backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5)}
#scrim{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(0,0,0,.5)}
body.menu #home{transform:none;opacity:1}
.mb,#q{backdrop-filter:none;-webkit-backdrop-filter:none}
.mb{background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08)),rgba(30,32,38,.5)}
#q{background:rgba(70,72,80,.55);padding-right:42px}
header::before{backdrop-filter:none;-webkit-backdrop-filter:none;-webkit-mask-image:none;mask-image:none;background:linear-gradient(rgba(12,14,20,.7),rgba(12,14,20,0));inset:0 0 -16px}
#sug{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(36,38,44,.94);max-height:min(46svh,320px)}
.hero{will-change:auto;box-shadow:0 14px 28px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.18)}
.hero #hb{transform:none;transition:none}.hc{transform:none}
.cat{content-visibility:auto;contain-intrinsic-size:auto 300px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.po{box-shadow:0 3px 8px rgba(0,0,0,.4)}
#q::-webkit-search-cancel-button{display:none}
#qc{position:absolute;right:11px;top:11px;width:20px;height:20px;padding:0;color:rgba(235,235,245,.55);opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .25s,transform .45s cubic-bezier(.34,1.6,.5,1)}
#qc.on{opacity:1;transform:none;pointer-events:auto}#qc{display:grid;place-items:center}.sw #qc .i{position:static;left:auto;top:auto;width:20px;height:20px;stroke-width:0;color:inherit}
#qc:active{transform:scale(.85)}
#kbd{position:fixed;left:8px;right:8px;bottom:calc(var(--bot) + 8px);z-index:400;padding:10px 6px 8px;border-radius:30px;display:flex;flex-direction:column;gap:7px;touch-action:none;
 background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07)),rgba(28,28,32,.6);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);
 border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 20px 50px rgba(0,0,0,.55);transform:translateY(118%);visibility:hidden;transition:transform .5s cubic-bezier(.2,.9,.25,1),visibility 0s .5s}
#kbd.on{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.9,.25,1)}
.kr{display:flex;gap:5px}
#kbd button{flex:1;min-width:0;height:46px;border-radius:12px;background:rgba(255,255,255,.17);color:#fff;font-size:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);display:grid;place-items:center;transition:transform .12s,background .12s}
#kbd button.p{background:rgba(255,255,255,.42);transform:scale(.92)}
#kbd .kw{flex:1.6}#kbd .kx{flex:1.5}#kbd .ksp{flex:5;font-size:15px;color:rgba(255,255,255,.7)}
#kbd .kg{flex:2.6;background:var(--g);color:#00210c;font-size:16px;font-weight:700}#kbd .kg.p{background:#7be495}
#kbd .i{width:22px;height:22px}
#kbd{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05)),rgba(30,30,36,.94);will-change:transform;contain:layout paint;touch-action:manipulation}
#kbd button{transition:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#kbd button.p{transform:none}
#qcar{position:absolute;top:11px;left:40px;width:2px;height:20px;border-radius:1px;background:var(--g);pointer-events:none;display:none;animation:cblink 1s steps(1) infinite}.sw.kon #qcar{display:block}@keyframes cblink{50%{opacity:0}}
.sw #sug .i{position:static;left:auto;top:auto;width:20px;height:20px;transition:none;color:var(--t2);flex:none}.sw #sug .rx .i{width:16px;height:16px}

/* QWERTY layout, same key positions as the phone keyboard */
#kbd,#kb{--kw:calc((100% - 45px)/10)}
#kb{display:flex;flex-direction:column;gap:7px;overflow:visible;margin:14px 0 4px;padding-bottom:10px}
#kb .kr{display:flex;gap:5px;justify-content:center}
#kb button{height:44px;border-radius:12px;background:rgba(255,255,255,.17);color:#fff;font-size:20px;display:grid;place-items:center;padding:0;min-width:0}
#kbd .kr,#kb .kr{justify-content:center}
#kbd .k,#kb .k{flex:none;width:var(--kw)}
#kbd .kx,#kb .kx{flex:1;min-width:0}#kb span.kx{background:none;box-shadow:none}
#kbd .kw,#kb .kw{flex:1;min-width:0}
#kbd .ksp,#kb .ksp{flex:1;font-size:15px;color:rgba(255,255,255,.7)}
#kbd .kg{flex:0 0 28%}
#kb .i{width:22px;height:22px}

/* ===== v6: safe areas, no black strips, iOS-style back pills, side-menu edge blur, black landscape, PiP background ===== */
html{background:#05070d;min-height:100%}
body{min-height:100vh;min-height:100lvh}
#amb{inset:0 0 -40vh 0}
#cap{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:240;pointer-events:none;background:linear-gradient(rgba(5,7,13,.94),rgba(5,7,13,.55));-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
header{padding-left:calc(var(--l) + 16px);padding-right:calc(var(--rt) + 16px)}
.hero,.cat{margin-left:calc(var(--l) + 14px);margin-right:calc(var(--rt) + 14px)}
#sp{padding-left:calc(var(--l) + 18px);padding-right:calc(var(--rt) + 18px)}
#kbd{left:calc(var(--l) + 8px);right:calc(var(--rt) + 8px)}
.sw{min-width:0}
#q{min-width:0;font-size:15px;text-overflow:ellipsis;padding-right:14px}
#q.has{padding-right:42px}
#q::placeholder{text-overflow:ellipsis}
/* iOS style back pill: arrow + label */
.pill{display:flex;align-items:center;gap:1px;height:40px;padding:0 14px 0 6px;border-radius:20px;flex:none;font-size:15px;font-weight:600;white-space:nowrap;color:#fff}
.pill .i{width:24px;height:24px;stroke-width:2.4}
.pill:active{background:rgba(255,255,255,.2)}
#ctl .pill{background:rgba(60,60,67,.55);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28);transition:transform .2s,background .2s}
#ctl .pill:active{transform:scale(.94);background:rgba(130,130,140,.6)}
#ttl{margin-left:8px}
#ctl .br .b{flex:0 1 38px;min-width:28px;width:auto}
/* side menu: items fade + blur out at the top/bottom edge instead of being cut */
.slw{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#sl{flex:1;min-height:0;padding:12px 0 30px;-webkit-mask-image:linear-gradient(transparent 0,#000 26px,#000 calc(100% - 34px),transparent 100%);mask-image:linear-gradient(transparent 0,#000 26px,#000 calc(100% - 34px),transparent 100%)}
.fd{position:absolute;left:-12px;right:-12px;height:32px;pointer-events:none;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.fd.t{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.fd.b{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
/* landscape player: pure black bars, no blurry backdrop */
@media (pointer:fine),(orientation:landscape) and (pointer:coarse){#pamb{display:none}}
/* video kept alive (for Picture-in-Picture) while the player UI is closed */
#player.bg{display:block;visibility:hidden;pointer-events:none}
@media (orientation:landscape) and (max-height:520px){.hero{height:84svh;min-height:230px;padding-bottom:84px}.hc h1{font-size:24px}.hm{margin:6px 0 12px}}

/* ===== v7 additions ===== */
.cat h2{display:flex;align-items:center;gap:8px}
.ex{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);flex:none}.ex .i{width:15px;height:15px;stroke-width:2.6}
.mc{position:relative}
.fv,.rm{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:2;color:#fff}
.fv .i,.rm .i{width:15px;height:15px}.fv.on .i,#bFav.on .i{fill:#ff375f;stroke:#ff375f}
.pw{position:relative;border-radius:12px;overflow:hidden}.pw .po{border-radius:0}
.pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.35)}.pb b{display:block;height:100%;background:#f00}
.ms{font-size:11px;color:#ffffff99;text-align:center}
#pg{position:fixed;inset:0;z-index:250;overflow:auto;overscroll-behavior:contain;background:linear-gradient(165deg,#2a4068,#101a2e 62%,#070b14);padding:calc(var(--top) + 64px) calc(var(--rt) + 16px) calc(var(--bot) + 28px) calc(var(--l) + 16px);transform:translateY(18px) scale(.98);opacity:0;visibility:hidden;transition:transform .5s cubic-bezier(.2,.9,.25,1),opacity .4s,visibility 0s .5s}
#pg.on{transform:none;opacity:1;visibility:visible;transition:transform .5s cubic-bezier(.2,.9,.25,1),opacity .4s}
#pgx{position:fixed;z-index:260;left:calc(var(--l) + 14px);top:calc(var(--top) + 12px)}
.pgh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}#pgt{font-size:26px;font-weight:700}
#pga{background:rgba(255,59,48,.2);color:#ff6b61;border-radius:16px;padding:7px 14px;font-size:13px;font-weight:700;flex:none}
#pgtabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}#pgtabs button{flex:none;padding:8px 14px;border-radius:18px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600}#pgtabs button.on{background:#fff;color:#111}#pgtabs i{font-style:normal;opacity:.6;margin-left:3px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}.pgrid .mc{flex:none}.pgrid .po{height:156px;width:100%;object-fit:cover;display:block}
.more{display:block;margin:18px auto 0;padding:10px 26px;border-radius:20px;background:var(--g);font-weight:700}
.qlist{display:flex;flex-direction:column}.qi{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:15px}.qi span{flex:1;display:flex;align-items:center;gap:10px}.qi .i{width:17px;height:17px;color:var(--t2)}.qi .rm{position:static;flex:none}
.rsh,.rhh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--t2);padding:8px 12px}.rsh button,.rhh button{color:#ff6b61;font-size:12px;font-weight:700}
.rhh{padding:0;margin:14px 0 8px}.rch{display:flex;flex-wrap:wrap;gap:8px}.rc{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 13px;border-radius:18px;background:rgba(255,255,255,.12);font-size:14px}.rc button{display:grid;place-items:center;width:20px;height:20px;opacity:.7}.rc .i,.rx .i{width:13px;height:13px}
.si.rs{justify-content:space-between}.rx{width:28px;height:28px;display:grid;place-items:center;opacity:.6}
.shh{display:flex;align-items:center;gap:8px;padding:6px 14px 4px;font-size:15px;font-weight:700}.shh i{font-style:normal;background:#f00;border-radius:10px;padding:0 7px;font-size:12px}.shh .i{margin-left:auto;width:16px;height:16px}
.shr{display:flex;gap:9px;overflow-x:auto;padding:6px 14px 10px}.whc{flex:0 0 72px}.whc .po{width:72px;height:104px;object-fit:cover;display:block;background:var(--s2)}.whc span{display:block;font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shn{padding:4px 14px 10px;font-size:12px;color:#ffffff8c}
.si.sg{gap:14px;padding:13px 14px}.si.sg .i{width:20px;height:20px;color:var(--t2);flex:none}.hl{color:#4a7bff;font-weight:inherit}

/* ===== Adaptive layout: phone / tablet / desktop / TV (auto-detected, see data-dev on <html>) ===== */
.cat{position:relative}
.rnb{position:absolute;z-index:6;width:44px;height:44px;border-radius:50%;display:none;place-items:center;background:rgba(20,20,24,.82);border:1px solid rgba(255,255,255,.25);color:#fff;opacity:0;transition:opacity .2s}
.rnb.l{left:6px}.rnb.r{right:6px}.rnb.l .i{transform:rotate(180deg)}.rnb .i{width:22px;height:22px;position:static}
@media (hover:hover) and (pointer:fine){.rnb{display:grid}.cat:hover .rnb{opacity:1}.mc:hover{transform:scale(1.04)}.sbi,.si,#stabs button,.more{cursor:pointer}}
@media (min-width:700px){
  header{padding-left:calc(var(--l) + 24px);padding-right:calc(var(--rt) + 24px)}
  .sw{max-width:560px;margin-left:auto;margin-right:auto}
  .hero{margin-left:24px;margin-right:24px;height:64svh;min-height:420px}
  .hc h1{font-size:40px}.hm{font-size:15px}
  .cat{margin-left:24px;margin-right:24px}
  .mc,.row .mc{flex-basis:140px}

@media (min-width:1500px){

/* TV: overscan-safe margins, 10-foot sizes, remote focus ring */
html[data-dev="tv"]{cursor:none}
html[data-dev="tv"] header{padding-left:calc(var(--l) + 4vw);padding-right:calc(var(--rt) + 4vw)}
html[data-dev="tv"] .hero,html[data-dev="tv"] .cat{margin-left:4vw;margin-right:4vw}
html[data-dev="tv"] #sp,html[data-dev="tv"] #pg{padding-left:4vw;padding-right:4vw}
html[data-dev="tv"] .mc,html[data-dev="tv"] .row .mc{flex-basis:max(190px,12vw)}
html[data-dev="tv"] #sres,html[data-dev="tv"] .pgrid{grid-template-columns:repeat(auto-fill,minmax(max(190px,12vw),1fr))}
html[data-dev="tv"] .hc h1{font-size:max(52px,3.6vw)}html[data-dev="tv"] .hm{font-size:max(18px,1.3vw)}
html[data-dev="tv"] .mt{font-size:max(15px,1.05vw)}html[data-dev="tv"] .cat h2{font-size:max(24px,1.7vw)}
html[data-dev="tv"] .wn{font-size:max(20px,1.4vw);padding:16px 34px}
html[data-dev="tv"] #q{height:56px;font-size:20px}html[data-dev="tv"] .sbi{font-size:20px}
html[data-dev="tv"] #side{width:max(340px,24vw)}
html[data-dev="tv"] #kbd{max-width:min(900px,70vw)}html[data-dev="tv"] #kbd button,html[data-dev="tv"] #kb button{height:60px;font-size:24px}
html[data-dev="tv"] .row{padding:16px 12px 20px;scroll-padding:0 12px}
.tvf{outline:4px solid #fff!important;outline-offset:3px;border-radius:14px;transform:scale(1.07)!important;z-index:7;box-shadow:0 0 0 7px rgba(48,209,88,.55)}

/* ===== Frosted pages (same coloured blur as the home background) + themed dialog ===== */
body.pl #home{visibility:hidden}
#sp,#pg{background:linear-gradient(165deg,rgba(42,64,104,.5),rgba(16,26,46,.55) 62%,rgba(7,11,20,.66));backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6)}

/* ===== Toast ===== */

    const col = i => { let s = 0; for (let y = 0; y < 36; y++) { const k = (y * 64 + i) * 4; s += d[k] + d[k + 1] + d[k + 2]; } return s / 108; };
    if (row(18) < 25) return;
    let t = 0, b = 0, l = 0, r = 0; while (t < 7 && row(t) < 22) t++; while (b < 7 && row(35 - b) < 22) b++; while (l < 12 && col(l) < 22) l++; while (r < 12 && col(63 - r) < 22) r++;
    const n = {t: t ? (t + .6) / 36 : 0, b: b ? (b + .6) / 36 : 0, l: l ? (l + .6) / 64 : 0, r: r ? (r + .6) / 64 : 0}, o = P.bars;
    P.bars = o ? {t: Math.min(o.t, n.t), b: Math.min(o.b, n.b), l: Math.min(o.l, n.l), r: Math.min(o.r, n.r)} : n; P.bn = (P.bn || 0) + 1;
  } catch (_) { P.bars = null; }
}
function applyBars() {
  const b = P.bars; if (!b || isLand() || (P.bn || 0) < 3 || S.mode !== 'fit' || S.z.s !== 1 || !v.videoWidth) { v.style.clipPath = ''; return; }
  const W = surf.clientWidth, H = surf.clientHeight, vw = v.videoWidth, vh = v.videoHeight, s = Math.min(W / vw, H / vh), w = vw * s, h = vh * s, x = (W - w) / 2, y = (H - h) / 2;
  v.style.clipPath = `inset(${y + h * b.t}px ${x + w * b.r}px ${y + h * b.b}px ${x + w * b.l}px)`;

/* ===== Home ===== */
const home = $('home'), cats = $('cats');

function findMovieInHomeData(query) {
    const homeData = document.getElementById('cats');
    if (!homeData) return null;
    const q = query.toLowerCase().trim();
    
    // Home page se saare movie cards dhundein
    const allCards = homeData.querySelectorAll('.mc[data-p]');
    for (const card of allCards) {
        const title = (card.dataset.t || '').toLowerCase().trim();
        if (title === q || title.includes(q) || q.includes(title)) {
            return { detailPath: card.dataset.p, title: card.dataset.t };
        }
    }
    
    // Hero banner se bhi check karein
    if (window.heroItems) {
        for (const item of window.heroItems) {
            const s = item.subject || item;
            if (!s.title) continue;
            const t = s.title.toLowerCase().trim();
            if (t === q || t.includes(q) || q.includes(t)) {
                return { detailPath: s.detailPath, title: s.title };
            }
        }
    }
    
    return null;
}

  if (!tvEl || !c.includes(tvEl)) { tvFocus(c.find(x => x.matches('.wn,#kbd button[data-k="g"],#spx')) || c[0]); return true; }
  const a = tvEl.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2; let best = null, bs = 1e12;
  c.forEach(el => { if (el === tvEl) return; const r = el.getBoundingClientRect(), dx = r.left + r.width / 2 - ax, dy = r.top + r.height / 2 - ay;
    const main = dir === 'ArrowRight' ? dx : dir === 'ArrowLeft' ? -dx : dir === 'ArrowDown' ? dy : -dy, cross = (dir === 'ArrowRight' || dir === 'ArrowLeft') ? Math.abs(dy) : Math.abs(dx);
    if (main < 4) return; const sc = main + cross * 2.5; if (sc < bs) { bs = sc; best = el; } });
  if (best) tvFocus(best); return true;
}
function tvOk() {
  const el = tvEl; if (!el || !document.contains(el)) return false;
  if (el.closest('#kbd')) { el.dispatchEvent(new PointerEvent('pointerdown', {bubbles: true})); el.dispatchEvent(new PointerEvent('pointerup', {bubbles: true})); }
  else if (el.id === 'q') openKbd(); else el.click();
  return true;
}
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, inp = e.target.matches && e.target.matches('input,textarea');
  if (k === 'GoBack' || k === 'BrowserBack' || k === 'XF86Back' || e.keyCode === 461 || e.keyCode === 10009) { e.preventDefault(); history.back(); return; }
  if (DEVN() === 'tv' && !inp && !P.open) {
    if (/^Arrow(Up|Down|Left|Right)$/.test(k)) { if (tvMove(k)) e.preventDefault(); return; }
    if (k === 'Enter' || k === ' ') { if (tvOk() || tvMove('ArrowDown')) e.preventDefault(); return; }
  }
  if (DEVN() === 'tv' && P.open && (k === 'Enter') && !e.target.closest('button')) { togglePlay(); showCtl(); e.preventDefault(); return; }
  if (inp || P.open || ($('dlg') && $('dlg').classList.contains('on')) || $('pg').classList.contains('on') || side.classList.contains('open')) return;
  const ch = /^[a-z0-9]$/i.test(k) ? k.toLowerCase() : k === ' ' ? ' ' : null;
  if (sp.classList.contains('on') && !KB.classList.contains('on')) {   // search page: type straight into the query
    if (ch) { sq = (sq + ch).slice(0, 40); renderQ(); e.preventDefault(); } else if (k === 'Backspace') { sq = sq.slice(0, -1); renderQ(); e.preventDefault(); }
    return;
  }
  if (!KB.classList.contains('on')) { if (!ch || ch === ' ') return; openKbd(); kPress(ch); e.preventDefault(); return; }
  if (ch) kPress(ch); else if (k === 'Backspace') kPress('bs'); else if (k === 'Enter') kPress('go'); else return;
  e.preventDefault();
});
if (matchMedia('(hover:hover) and (pointer:fine)').matches) {
  document.addEventListener('mouseover', e => {
    const c = e.target.closest && e.target.closest('.cat'); if (!c || c.querySelector('.rnb')) return; const r = c.querySelector('.row'); if (!r) return;
    const t = r.offsetTop + r.offsetHeight / 2 - 22;
    c.insertAdjacentHTML('beforeend', `<button class="rnb l" style="top:${t}px" aria-label="Previous">${ic('chev')}</button><button class="rnb r" style="top:${t}px" aria-label="Next">${ic('chev')}</button>`);
  });
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.rnb'); if (!b) return; e.stopPropagation();
    const r = b.parentNode.querySelector('.row'); r.scrollBy({left: (b.classList.contains('l') ? -1 : 1) * r.clientWidth * .85, behavior: 'smooth'}); }, true);
}

/* ===== Themed confirm dialog (replaces the browser's native confirm popup) ===== */
function pkConfirm(title, msg, okText, danger = true) {
  return new Promise(res => {
    let d = $('dlg');
    if (!d) { d = document.createElement('div'); d.id = 'dlg'; d.setAttribute('role', 'alertdialog'); document.body.appendChild(d); }
    d.innerHTML = `<div class="dc"><h3>${esc(title)}</h3><p>${esc(msg || '')}</p><div class="db"><button data-d="0">Cancel</button><button class="ok${danger ? '' : ' go'}" data-d="1">${esc(okText || 'OK')}</button></div></div>`;
    let done = false;
    const fin = (v, pop) => { if (done) return; done = true; d.classList.remove('on'); removeEventListener('keydown', kd, true); d.onclick = null; if (!pop) navDrop('dlg'); res(v); };
    const kd = e => { if (e.key === 'Escape') { e.stopImmediatePropagation(); e.preventDefault(); fin(false); } else if (e.key === 'Enter' && !(e.target.closest && e.target.closest('#dlg button')) && DEVN() !== 'tv') { e.stopImmediatePropagation(); e.preventDefault(); fin(true); } };
    d.onclick = e => { const b = e.target.closest('[data-d]'); if (b) fin(b.dataset.d === '1'); else if (e.target === d) fin(false); };
    addEventListener('keydown', kd, true); d.classList.add('on'); navPush('dlg', () => fin(false, true));
    if (DEVN() === 'tv') tvFocus(d.querySelector('[data-d="0"]'));
  });
}
