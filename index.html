<!DOCTYPE html>
<!-- PIKA PICTURE | Single-file PWA | iOS + Android native-feel | kindmops build -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>PIKA PICTURE</title>
<style>
/* ══════════════════════════════════════════
   DESIGN TOKENS
══════════════════════════════════════════ */
:root {
  --c-bg:       #0a0a0a;
  --c-surface1: #141414;
  --c-surface2: #1e1e1e;
  --c-surface3: #282828;
  --c-border:   rgba(255,255,255,0.08);
  --c-text:     #ffffff;
  --c-text2:    #a0a0a0;
  --c-text3:    #666666;
  --c-accent:   #00c533;
  --c-accent2:  #00a026;
  --c-danger:   #ff3b30;
  --c-glass:    rgba(10,10,10,0.82);
  --blur:       blur(24px) saturate(180%);
  --r-sm:       8px;
  --r-md:       12px;
  --r-lg:       18px;
  --r-xl:       24px;
  --r-full:     999px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --easing: cubic-bezier(0.4, 0, 0.2, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ══════════════════════════════════════════
   GLOBAL RESET — STRIP ALL BROWSER CHROME
══════════════════════════════════════════ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  background: var(--c-bg);
  min-height: 100dvh;
  overflow-x: hidden;
  padding-bottom: var(--safe-b);
  /* Kill all browser gestures */
  overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
}
/* Block all native browser interactions */
* {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  -khtml-user-select: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }

::-webkit-scrollbar { display:none; }
* { scrollbar-width: none; }

/* ══════════════════════════════════════════
   SPLASH SCREEN
══════════════════════════════════════════ */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  background: #000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 28px;
  transition: opacity 0.6s var(--easing), transform 0.6s var(--easing);
}
#splash.out { opacity: 0; transform: scale(1.05); pointer-events: none; }

.splash-logo-wrap {
  position: relative;
  width: 110px; height: 110px;
}
.splash-ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 2.5px solid transparent;
  border-top-color: var(--c-accent);
  animation: ring-spin 1.1s linear infinite;
}
.splash-ring:nth-child(2) {
  inset: 8px;
  border-top-color: rgba(0,197,51,0.4);
  animation-duration: 1.6s;
  animation-direction: reverse;
}
@keyframes ring-spin { to { transform: rotate(360deg); } }

.splash-icon-inner {
  position: absolute; inset: 16px;
  background: var(--c-surface1);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 40px rgba(0,197,51,0.25);
}
.splash-p {
  font-size: 36px; font-weight: 900; color: var(--c-accent);
}

.splash-wordmark {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.splash-title {
  font-size: 28px; font-weight: 900; letter-spacing: 4px;
  background: linear-gradient(135deg, #fff 0%, var(--c-accent) 60%, #007a1f 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.splash-sub {
  font-size: 11px; letter-spacing: 3px; color: var(--c-text3);
  text-transform: uppercase;
}

.splash-bar-wrap {
  width: 160px; height: 3px;
  background: var(--c-surface2);
  border-radius: var(--r-full); overflow: hidden;
}
.splash-bar {
  height: 100%; width: 0; background: var(--c-accent);
  border-radius: var(--r-full);
  animation: splash-load 1.8s var(--easing) forwards;
}
@keyframes splash-load { to { width: 100%; } }

/* ══════════════════════════════════════════
   ANIMATIONS
══════════════════════════════════════════ */
@keyframes fadeIn  { from { opacity:0 } to { opacity:1 } }
@keyframes slideUp { from { opacity:0; transform:translateY(24px) } to { opacity:1; transform:none } }
@keyframes popIn   { from { opacity:0; transform:scale(0.88) } to { opacity:1; transform:none } }
@keyframes shimmer {
  from { background-position: -200% 0 }
  to   { background-position:  200% 0 }
}

.anim-fade  { animation: fadeIn  0.4s var(--easing) both }
.anim-slide { animation: slideUp 0.45s var(--easing) both }
.anim-pop   { animation: popIn   0.35s var(--spring) both }

/* ══════════════════════════════════════════
   SKELETON / SHIMMER
══════════════════════════════════════════ */
.skeleton {
  background: linear-gradient(90deg,
    var(--c-surface1) 25%,
    var(--c-surface2) 50%,
    var(--c-surface1) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: var(--r-sm);
}

/* ══════════════════════════════════════════
   HEADER
══════════════════════════════════════════ */
#main-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  height: calc(56px + var(--safe-t));
  padding-top: var(--safe-t);
  display: flex; align-items: center; gap: 12px;
  padding-left: calc(16px + var(--safe-l));
  padding-right: calc(16px + var(--safe-r));
  background: linear-gradient(to bottom, rgba(0,0,0,0.92) 0%, transparent 100%);
  transition: background 0.3s var(--easing);
}
#main-header.scrolled {
  background: var(--c-glass);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--c-border);
}

.logo-mark {
  font-size: 20px; font-weight: 900; letter-spacing: -0.5px;
  color: var(--c-accent); white-space: nowrap; flex-shrink: 0;
}

.search-wrap {
  position: relative; flex: 1; max-width: 360px;
}
.search-ico {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--c-text3); pointer-events: none; width: 16px; height: 16px;
}
.search-input {
  width: 100%; height: 36px;
  background: var(--c-surface2);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 0 12px 0 34px;
  color: var(--c-text); font-size: 14px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  -webkit-user-select: text; user-select: text;
}
.search-input::placeholder { color: var(--c-text3); }
.search-input:focus { border-color: var(--c-accent); background: var(--c-surface3); }

#search-drop {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--c-glass);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  max-height: 280px; overflow-y: auto;
  box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  z-index: 600;
  display: none; flex-direction: column;
  animation: popIn 0.2s var(--spring);
}
.sdrop-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; cursor: pointer;
  border-bottom: 1px solid var(--c-border);
  transition: background 0.15s;
}
.sdrop-item:last-child { border-bottom: none; }
.sdrop-item:active { background: rgba(255,255,255,0.06); }
.sdrop-thumb {
  width: 36px; height: 52px; border-radius: 6px;
  object-fit: cover; background: var(--c-surface3); flex-shrink: 0;
}
.sdrop-label { font-size: 13px; font-weight: 500; line-height: 1.3; }

/* ══════════════════════════════════════════
   HOME
══════════════════════════════════════════ */
#home-view {
  display: block;
  padding-top: calc(56px + var(--safe-t));
}

/* Hero */
.hero {
  position: relative; height: 62vh; min-height: 300px;
  overflow: hidden;
  background: var(--c-surface1);
}
.hero-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  transition: opacity 0.7s var(--easing);
  will-change: opacity;
}
.hero-bg.fading { opacity: 0; }
.hero-grad {
  position: absolute; inset: 0;
  background: linear-gradient(to top,
    var(--c-bg) 0%,
    rgba(0,0,0,0.5) 40%,
    rgba(0,0,0,0.25) 70%,
    transparent 100%);
  pointer-events: none;
}
.hero-body {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 20px 20px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  text-align: center;
}
.hero-dots {
  display: flex; gap: 5px; margin-bottom: 4px;
}
.hero-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.35);
  transition: all 0.3s var(--easing); cursor: pointer;
}
.hero-dot.active { width: 20px; border-radius: 3px; background: var(--c-accent); }
.hero-title {
  font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  max-width: 280px;
}
.hero-meta {
  font-size: 12px; color: rgba(255,255,255,0.65);
  display: flex; gap: 8px; align-items: center;
}
.hero-meta span { display: flex; align-items: center; gap: 3px; }
.hero-play {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fff; color: #000;
  border: none; border-radius: var(--r-full);
  padding: 12px 28px; font-size: 15px; font-weight: 700;
  cursor: pointer; margin-top: 4px;
  transition: transform 0.18s var(--spring), background 0.2s;
  box-shadow: 0 4px 20px rgba(255,255,255,0.2);
}
.hero-play:active { transform: scale(0.94); }

/* Category rows */
.cat-wrap { padding: 0 0 28px; }
.cat-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 16px 10px;
}
.cat-title { font-size: 17px; font-weight: 700; }
.cat-see-all { font-size: 13px; color: var(--c-accent); font-weight: 500; cursor: pointer; }
.movies-row {
  display: flex; gap: 10px; overflow-x: auto; padding: 0 16px 4px;
  scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
}
.movie-card {
  flex: 0 0 100px; scroll-snap-align: start; cursor: pointer;
  transition: transform 0.22s var(--spring);
}
.movie-card:active { transform: scale(0.93); }
.movie-poster {
  width: 100%; height: 148px; object-fit: cover;
  border-radius: var(--r-md);
  background: var(--c-surface2);
  display: block;
  box-shadow: 0 4px 14px rgba(0,0,0,0.35);
}
.movie-label {
  font-size: 11px; color: var(--c-text2); margin-top: 5px;
  text-align: center; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}

/* Spinner */
.spin-wrap { display:flex; justify-content:center; padding:24px; }
.spinner {
  width: 28px; height: 28px;
  border: 2.5px solid rgba(255,255,255,0.08);
  border-top-color: var(--c-accent);
  border-radius: 50%;
  animation: ring-spin 0.9s linear infinite;
}

/* ══════════════════════════════════════════
   PLAYER VIEW (FULLSCREEN OVERLAY)
══════════════════════════════════════════ */
#player-view {
  position: fixed; inset: 0; z-index: 1000;
  background: #000;
  display: none; flex-direction: column;
  animation: fadeIn 0.28s var(--easing);
}
#player-view.active { display: flex; }

/* In landscape, collapse bottom sheet fully */
@media (orientation: landscape) {
  #player-bottom-sheet { max-height: 50vh; }
}

.video-wrap {
  position: relative; flex: 1;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; background: #000;
  touch-action: none; /* we handle all touch manually */
}
#vid {
  width: 100%; height: 100%;
  object-fit: contain;
  pointer-events: none;
  display: block;
  transform-origin: center center;
  transition: transform 0.08s linear;
}

/* ─── SEEK FLASH OVERLAYS (left / right) ─── */
.seek-flash {
  position: absolute; top: 0; bottom: 0;
  width: 42%; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.18s;
  border-radius: 50%;
}
.seek-flash.left  { left: 0; justify-content: flex-start; padding-left: 18px; }
.seek-flash.right { right: 0; justify-content: flex-end;  padding-right: 18px; }
.seek-flash.show  { opacity: 1; }

.seek-ripple {
  width: 80px; height: 80px; border-radius: 50%;
  background: rgba(255,255,255,0.12);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; font-weight: 700; color: #fff;
}
.seek-ripple svg { width: 28px; height: 28px; }
.seek-ripple .secs { font-size: 14px; font-weight: 800; }

/* ─── GESTURE HUD (center) ─── */
.ghud {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: var(--r-lg);
  padding: 14px 22px;
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  pointer-events: none; opacity: 0;
  transition: opacity 0.2s;
  min-width: 130px;
}
.ghud.show { opacity: 1; }
.ghud-icon { width: 30px; height: 30px; }
.ghud-label { font-size: 14px; font-weight: 700; color: #fff; }
.ghud-bar {
  width: 100%; height: 3px;
  background: rgba(255,255,255,0.2); border-radius: var(--r-full);
  overflow: hidden;
}
.ghud-fill {
  height: 100%; background: var(--c-accent);
  border-radius: var(--r-full); transition: width 0.05s;
}

/* ─── ASPECT RATIO HUD ─── */
.ratio-hud {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-radius: var(--r-md); padding: 10px 18px;
  font-size: 14px; font-weight: 700; color: #fff;
  pointer-events: none; opacity: 0;
  transition: opacity 0.25s;
}
.ratio-hud.show { opacity: 1; }

/* ─── CONTROLS OVERLAY ─── */
.ctrl-overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: space-between;
  background: linear-gradient(to top,
    rgba(0,0,0,0.88) 0%,
    rgba(0,0,0,0.08) 30%,
    rgba(0,0,0,0.08) 70%,
    rgba(0,0,0,0.72) 100%);
  opacity: 1; transition: opacity 0.35s var(--easing);
  pointer-events: all;
}
.ctrl-overlay.hidden { opacity: 0; pointer-events: none; }

/* TOP BAR */
.ctrl-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(12px + var(--safe-t)) 14px 0;
  gap: 8px;
}
.ctrl-back {
  background: none; border: none; color: #fff;
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: background 0.15s;
}
.ctrl-back:active { background: rgba(255,255,255,0.15); }
.ctrl-vtitle {
  flex: 1; font-size: 14px; font-weight: 600;
  text-align: center; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}
.ctrl-top-right {
  display: flex; gap: 4px; align-items: center; flex-shrink: 0;
}
.ctrl-icon-btn {
  background: none; border: none; color: #fff;
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.15s;
  position: relative;
}
.ctrl-icon-btn:active { background: rgba(255,255,255,0.15); }
.ctrl-icon-btn svg { width: 22px; height: 22px; }

/* CENTER CONTROLS */
.ctrl-center {
  display: flex; align-items: center; justify-content: center; gap: 36px;
}
.skip-btn-lg {
  background: rgba(255,255,255,0.1);
  border: none; color: #fff;
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; gap: 1px;
  border: 1.5px solid rgba(255,255,255,0.25);
  transition: background 0.15s, transform 0.15s;
}
.skip-btn-lg:active { transform: scale(0.90); background: rgba(255,255,255,0.2); }
.skip-btn-lg svg { width: 22px; height: 22px; }
.skip-btn-lg span { font-size: 8px; font-weight: 700; color: rgba(255,255,255,0.8); }

.playpause-btn {
  width: 70px; height: 70px; border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 2px solid rgba(255,255,255,0.55);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #fff;
  transition: transform 0.18s var(--spring), background 0.15s;
}
.playpause-btn:active { transform: scale(0.90); }
.playpause-btn svg { width: 32px; height: 32px; }

/* BOTTOM CONTROLS */
.ctrl-bottom { padding: 0 14px calc(10px + var(--safe-b)); display: flex; flex-direction: column; gap: 10px; }

/* PROGRESS BAR */
.prog-wrap {
  display: flex; flex-direction: column; gap: 6px;
}
.prog-time { display: flex; justify-content: space-between; }
.prog-time span { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.75); }

/* track + hit area */
.prog-track-hit {
  width: 100%; height: 28px;
  display: flex; align-items: center;
  cursor: pointer; position: relative;
}
.prog-track {
  width: 100%; height: 4px;
  background: rgba(255,255,255,0.22);
  border-radius: var(--r-full); position: relative;
  transition: height 0.15s;
  overflow: visible;
}
.prog-track-hit:active .prog-track,
.prog-track-hit.dragging .prog-track { height: 5px; }
.prog-fill {
  height: 100%; background: var(--c-accent);
  border-radius: var(--r-full); position: absolute; top: 0; left: 0;
  pointer-events: none;
  transition: width 0.08s linear;
}
.prog-buf {
  height: 100%; background: rgba(255,255,255,0.2);
  border-radius: var(--r-full); position: absolute; top: 0; left: 0;
  pointer-events: none;
}
.prog-knob {
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; position: absolute; top: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 6px rgba(0,0,0,0.5);
  pointer-events: none;
  transition: transform 0.15s var(--spring);
}
.prog-track-hit:active .prog-knob,
.prog-track-hit.dragging .prog-knob { transform: translate(-50%, -50%) scale(1.4); }
/* Seek preview bubble on progress drag */
.prog-bubble {
  position: absolute; bottom: 24px; transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  border-radius: var(--r-sm); padding: 3px 8px;
  font-size: 11px; font-weight: 700; color: #fff;
  pointer-events: none; opacity: 0; transition: opacity 0.15s;
  white-space: nowrap;
}
.prog-track-hit.dragging .prog-bubble { opacity: 1; }

/* ACTION ROW */
.ctrl-actions {
  display: flex; align-items: center; justify-content: space-between;
}
.ctrl-action-group { display: flex; align-items: center; gap: 6px; }
.act-btn {
  background: none; border: none; color: #fff;
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.15s;
  position: relative;
}
.act-btn:active { background: rgba(255,255,255,0.15); }
.act-btn svg { width: 21px; height: 21px; }
.act-btn .badge {
  position: absolute; top: 4px; right: 4px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--c-accent); border: 1.5px solid #000;
}

/* ══════════════════════════════════════════
   POPOVER MENUS (Quality / Dubbing / Aspect)
══════════════════════════════════════════ */
.popover {
  position: absolute; right: 0; bottom: 52px;
  background: var(--c-glass);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  min-width: 190px; overflow: hidden;
  box-shadow: 0 16px 48px rgba(0,0,0,0.7);
  display: none; flex-direction: column;
  animation: popIn 0.22s var(--spring);
  z-index: 100;
}
.popover.show { display: flex; }
.popover-head {
  font-size: 12px; font-weight: 700; color: var(--c-text2);
  padding: 12px 16px 8px; letter-spacing: 0.5px; text-transform: uppercase;
}
.pop-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; cursor: pointer;
  transition: background 0.15s; font-size: 14px;
}

}

.episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 8px; }

  background: var(--c-surface2); color: var(--c-text);
  border: 1px solid var(--c-border);
  padding: 10px 6px; border-radius: var(--r-sm);

/* ══════════════════════════════════════════

══════════════════════════════════════════ */
.toast {

  transition: opacity 0.25s, transform 0.25s var(--spring);
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

<script>
'use strict';
/* ─────────────────────────────────────────
   CONFIG
───────────────────────────────────────── */
const API = 'https://pika-movie-box.duckdns.org/api';
const CACHE_NAME = 'pika-posters-v1';
const CTRL_HIDE_DELAY = 5000;
const SPEED_OPTIONS = [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
const RATIO_LABELS = { contain:'Fit (Default)', cover:'Fill (Crop)', stretch:'Stretch', '4:3':'4:3 Classic', '16:9':'16:9 Wide' };

/* ─────────────────────────────────────────
   POSTER CACHE (Cache API)
───────────────────────────────────────── */
async function cachedImg(url) {
  if (!url) return '';
  const proxied = `${API}/proxy?url=${encodeURIComponent(url)}`;
  if (!('caches' in window)) return proxied;
  try {
    const cache = await caches.open(CACHE_NAME);
    const hit = await cache.match(proxied);
    if (hit) return proxied;          // already cached, browser serves from disk
    cache.add(proxied).catch(()=>{});  // cache async, don't block render
  } catch(_){}
  return proxied;
}

/* ─────────────────────────────────────────
   TOAST
───────────────────────────────────────── */
const toastEl = document.getElementById('toast');
let toastTimer;
function showToast(msg, dur=2200) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), dur);
}

/* ─────────────────────────────────────────
   SPLASH → HOME
───────────────────────────────────────── */
const splash = document.getElementById('splash');
window.addEventListener('load', () => {
  setTimeout(() => {
    splash.classList.add('out');
    setTimeout(() => splash.remove(), 700);
  }, 2200);
});

/* ─────────────────────────────────────────
   HEADER SCROLL EFFECT
───────────────────────────────────────── */
const mainHeader = document.getElementById('main-header');
window.addEventListener('scroll', () => {
  mainHeader.classList.toggle('scrolled', window.scrollY > 60);
}, { passive:true });

/* ─────────────────────────────────────────
   TIME FORMATTING
───────────────────────────────────────── */
function fmtTime(s) {
  if (isNaN(s) || s < 0) return '00:00';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

/* ─────────────────────────────────────────
   HOMEPAGE
───────────────────────────────────────── */
let heroItems = [];
let heroIdx = 0;
let heroTimer;

async function loadHome() {
  try {
    const res  = await fetch(`${API}/home`);
    const json = await res.json();
    const data = json.data;

    // Hero banner
    const bannerOp = (data.operatingList || []).find(op => op.type === 'BANNER');
    heroItems = (bannerOp?.banner?.items || bannerOp?.subjects || []);
    if (heroItems.length) {
      renderHeroDots();
      renderHeroSlide(0);
      heroTimer = setInterval(() => {
        heroIdx = (heroIdx + 1) % heroItems.length;
        renderHeroSlide(heroIdx);
      }, 5000);
    }

    // Categories
    const catEl = document.getElementById('home-cats');
    catEl.innerHTML = '';
    for (const op of (data.operatingList || [])) {
      if (!op.subjects || !op.subjects.length) continue;
      const wrap = document.createElement('div');
      wrap.className = 'cat-wrap anim-fade';
      let html = `<div class="cat-head">
        <div class="cat-title">${escHtml(op.title||'')}</div>
      </div><div class="movies-row">`;
      for (const m of op.subjects) {
        const dp    = m.detailPath || m.subjectId || '';
        const title = escHtml(m.title || '');
        const raw   = typeof m.cover==='string' ? m.cover : (m.cover?.url || m.image || '');
        const src   = raw ? `${API}/proxy?url=${encodeURIComponent(raw)}` : '';
        html += `<div class="movie-card" data-dp="${escHtml(dp)}" data-title="${title}">
          <img class="movie-poster" src="${src}" loading="lazy"
            onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22148%22%3E%3Crect fill=%22%231e1e1e%22 width=%22100%25%22 height=%22100%25%22/%3E%3C/svg%3E'">
          <div class="movie-label">${title}</div>
        </div>`;
        // pre-cache poster
        if (raw) cachedImg(raw);
      }
      html += '</div>';
      wrap.innerHTML = html;
      wrap.querySelectorAll('.movie-card').forEach(card => {
        card.addEventListener('click', () => openPlayer(card.dataset.dp, card.dataset.title));
      });
      catEl.appendChild(wrap);
    }
    document.getElementById('home-spinner').style.display = 'none';
  } catch(e) {
    console.error('Home load error', e);
    document.getElementById('home-spinner').innerHTML = '<div style="color:#666;font-size:13px;padding:8px">Failed to load. Check connection.</div>';
  }
}

function renderHeroDots() {
  const dotsEl = document.getElementById('hero-dots');
  dotsEl.innerHTML = heroItems.map((_,i)=>
    `<div class="hero-dot${i===0?' active':''}" data-i="${i}"></div>`).join('');
  dotsEl.querySelectorAll('.hero-dot').forEach(d => {
    d.addEventListener('click', () => { heroIdx = +d.dataset.i; renderHeroSlide(heroIdx); clearInterval(heroTimer); });
  });
}

function renderHeroSlide(idx) {
  const item = heroItems[idx];
  const sub  = item.subject || item;
  const raw  = typeof sub.cover==='string' ? sub.cover : (sub.cover?.url || sub.coverUrl || sub.image || '');
  const heroImg = document.getElementById('hero-img');
  // fade crossfade
  heroImg.classList.add('fading');
  setTimeout(() => {
    heroImg.src = raw ? `${API}/proxy?url=${encodeURIComponent(raw)}` : '';
    heroImg.classList.remove('fading');
  }, 350);
  document.getElementById('hero-title').textContent = sub.title || item.title || '—';
  document.getElementById('hero-meta').innerHTML =
    `<span>${sub.releaseDate||'2026'}</span>
     <span style="color:rgba(255,255,255,0.3)">|</span>
     <span>${sub.genre||'Action'}</span>
     <span style="color:rgba(255,255,255,0.3)">|</span>
     <span style="color:#f5c518">★ ${sub.imdbRatingValue||'—'}</span>`;
  document.getElementById('hero-play-btn').onclick = () =>
    openPlayer(sub.detailPath||item.detailPath||'', sub.title||item.title||'');
  // dots
  document.querySelectorAll('.hero-dot').forEach((d,i) => d.classList.toggle('active', i===idx));
  if (raw) cachedImg(raw);
}

/* ─────────────────────────────────────────
   OPEN PLAYER
───────────────────────────────────────── */
async function openPlayer(detailPath, title) {
  playerView.classList.add('active');
  document.getElementById('player-title').textContent = title || '—';
  resetPlayerUI();
  try {
    const res  = await fetch(`${API}/detail?detailPath=${detailPath}`);
    const json = await res.json();
    const data = json.data;
    const validSeason = data?.resource?.seasons?.find(s => s.se > 0);
    if (validSeason) {
      renderEpisodes(data.resource.seasons, data.subject.subjectId, detailPath);
      toggleSheet(true);
      playEpisode(data.subject.subjectId, validSeason.se, 1, detailPath, '/tv-series/detail');
    } else if (data?.subject) {
      document.getElementById('ep-grid').innerHTML =
        '<div style="color:#666;padding:16px;font-size:13px;grid-column:1/-1">This is a Movie. Enjoy!</div>';
      playEpisode(data.subject.subjectId, 0, 0, detailPath, '/movie/detail');
    } else {
      showToast('Failed to load content');
    }
  } catch(e) {
    console.error(e);
    showToast('Network error — check your connection');
    closePlayer();
  }
}

function resetPlayerUI() {
  vid.src = '';
  progFill.style.width = '0%';
  progKnob.style.left  = '0%';
  progBuf.style.width  = '0%';
  progCur.textContent  = '00:00';
  progDur.textContent  = '00:00';
  currentStreams = [];
  currentQuality = null;
  videoScale = 1;
  vid.style.transform = '';
  vid.style.objectFit = 'contain';
  currentRatio = 'contain';
  showCtrl();
}

function closePlayer() {
  vid.pause();
  vid.src = '';
  playerView.classList.remove('active');
  unlockOrientation();
  allPopoversClose();
}

/* ─────────────────────────────────────────
   PLAY EPISODE
───────────────────────────────────────── */
async function playEpisode(subjectId, se, ep, detailPath, mediaType) {
  try {
    const type = encodeURIComponent(mediaType || (se > 0 ? '/tv-series/detail' : '/movie/detail'));
    const res  = await fetch(`${API}/play?subjectId=${subjectId}&se=${se||0}&ep=${ep||0}&detailPath=${detailPath}&type=${type}`);
    const json = await res.json();
    const streams = json.data?.streams;
    if (!streams || !streams.length) { showToast('No streams available'); return; }

    // Sort highest → lowest
    streams.sort((a,b) => parseInt(b.resolutions||0) - parseInt(a.resolutions||0));
    currentStreams = streams;

    buildQualityMenu(streams);
    buildDubMenu(json.data?.audios || []);

    setStream(streams[0]);

    // Subtitles
    const caps = json.data?.captions;
    if (caps && caps.length) {
      document.getElementById('sub-track').src = caps[0].url;
    }
  } catch(e) {
    console.error(e);
    showToast('Stream error: ' + e.message);
  }
}

function setStream(stream) {
  currentQuality = stream;
  const url = `${API}/proxy?url=${encodeURIComponent(stream.url)}`;
  vid.src = url;
  vid.play().catch(()=>{});
  ppIcon.setAttribute('href', '#i-pause');
  updateQualityMenu();
}

/* ─────────────────────────────────────────
   EPISODES
───────────────────────────────────────── */
function renderEpisodes(seasons, subjectId, detailPath) {
  const grid = document.getElementById('ep-grid');
  grid.innerHTML = '';
  seasons.forEach(s => {
    const label = document.createElement('div');
    label.className = 'season-label';
    label.textContent = `Season ${s.se}`;
    grid.appendChild(label);
    for (let i = 1; i <= s.maxEp; i++) {
      const btn = document.createElement('div');
      btn.className = 'ep-btn';
      btn.textContent = `EP ${i}`;
      btn.dataset.se = s.se; btn.dataset.ep = i;
      btn.onclick = () => {
        grid.querySelectorAll('.ep-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        playEpisode(subjectId, s.se, i, detailPath, '/tv-series/detail');
      };
      grid.appendChild(btn);
    }
  });
}

function buildQualityMenu(streams) {
  const pop = document.getElementById('pop-quality');
  // remove old items (keep head)
  pop.querySelectorAll('.pop-item').forEach(el=>el.remove());
  streams.forEach((s,i) => {
    const div = document.createElement('div');
    div.className = 'pop-item' + (i===0?' active':'');
    const res = s.resolutions ? `${s.resolutions}p` : `Source ${i+1}`;
    div.innerHTML = `<svg class="pop-check" fill="var(--c-accent)" style="${i===0?'':'opacity:0'}"><use href="#i-check"/></svg>
      <span class="pop-label">${res}</span>
      ${i===0?'<span class="pop-badge">BEST</span>':''}`;
    div.onclick = () => { setStream(s); allPopoversClose(); };
    pop.appendChild(div);
  });
}
function updateQualityMenu() {
  const pop = document.getElementById('pop-quality');
  const items = pop.querySelectorAll('.pop-item');
  items.forEach((item,i) => {
    const isActive = currentStreams[i] === currentQuality;
    item.classList.toggle('active', isActive);
    const check = item.querySelector('.pop-check');
    if (check) check.style.opacity = isActive ? '1' : '0';
  });
}

/* ─────────────────────────────────────────
   ASPECT RATIO
───────────────────────────────────────── */
document.querySelectorAll('#pop-aspect .pop-item').forEach(item => {
  item.addEventListener('click', () => {
    const ratio = item.dataset.ratio;
    setAspectRatio(ratio);
    allPopoversClose();
  });
});

function setAspectRatio(ratio) {
  currentRatio = ratio;
  videoScale = 1;
  // Reset transform first
  vid.style.transform = '';
  switch(ratio) {
    case 'contain':  vid.style.objectFit = 'contain'; break;
    case 'cover':    vid.style.objectFit = 'cover'; break;
    case 'stretch':
      vid.style.objectFit = 'fill'; break;
    case '4:3':
      vid.style.objectFit = 'contain';
      vid.style.aspectRatio = '4/3';
      break;
    case '16:9':
      vid.style.objectFit = 'contain';
      vid.style.aspectRatio = '16/9';
      break;
    default: vid.style.objectFit = 'contain';
  }
  // Update menu checks
  document.querySelectorAll('#pop-aspect .pop-item').forEach(el => {
    const active = el.dataset.ratio === ratio;
    el.classList.toggle('active', active);
    el.querySelector('.pop-check').style.opacity = active ? '1' : '0';
  });
  // Show HUD
  ratioHud.textContent = RATIO_LABELS[ratio] || ratio;
  ratioHud.classList.add('show');
  clearTimeout(ratioHudTimer);
  ratioHudTimer = setTimeout(() => ratioHud.classList.remove('show'), 1800);
}

/* ─────────────────────────────────────────
   PROGRESS BAR (draggable + tap)
───────────────────────────────────────── */
vid.addEventListener('timeupdate', () => {
  if (progHit.classList.contains('dragging')) return;
  const pct = vid.duration ? (vid.currentTime / vid.duration) * 100 : 0;
  progFill.style.width = pct + '%';
  progKnob.style.left  = pct + '%';
  progCur.textContent  = fmtTime(vid.currentTime);
  progDur.textContent  = fmtTime(vid.duration);
});

vid.addEventListener('progress', () => {
  if (!vid.duration) return;
  try {
    const buf = vid.buffered;
    if (buf.length) {
      const buffered = buf.end(buf.length-1) / vid.duration * 100;
      progBuf.style.width = buffered + '%';
    }
  } catch(_){}
});

function progPctFromEvent(e) {
  const rect = progHit.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  return Math.max(0, Math.min(1, x / rect.width));
}

function applyProgPct(pct, commit) {
  progFill.style.width = (pct*100) + '%';
  progKnob.style.left  = (pct*100) + '%';
  const t = (vid.duration || 0) * pct;
  progBubble.textContent = fmtTime(t);
  progBubble.style.left  = (pct*100) + '%';
  if (commit) { vid.currentTime = t; progCur.textContent = fmtTime(t); }
}

progHit.addEventListener('mousedown', startProgDrag);
progHit.addEventListener('touchstart', startProgDrag, {passive:true});

function startProgDrag(e) {
  e.stopPropagation();
  progHit.classList.add('dragging');
  applyProgPct(progPctFromEvent(e), false);
  const move = ev => { ev.stopPropagation(); applyProgPct(progPctFromEvent(ev), false); };
  const up   = ev => {
    applyProgPct(progPctFromEvent(ev), true);
    progHit.classList.remove('dragging');
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup',   up);
    document.removeEventListener('touchmove', move);
    document.removeEventListener('touchend',  up);
    showCtrl();
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup',   up);
  document.addEventListener('touchmove', move, {passive:true});
  document.addEventListener('touchend',  up);
}

───────────────────────────────────────── */
document.getElementById('btn-lock-orient').addEventListener('click', toggleOrientLock);

async function toggleOrientLock() {
  if (!screen.orientation) { showToast('Orientation lock not supported'); return; }
  try {
    if (isOrientLocked) {
      await screen.orientation.unlock();
      isOrientLocked = false;
      showToast('Orientation unlocked');
      document.getElementById('btn-lock-orient').querySelector('svg use').setAttribute('href','#i-landscape');
    } else {
      // Detect current orientation and lock opposite or landscape
      const target = screen.orientation.type.includes('portrait') ? 'landscape' : 'portrait';
      await screen.orientation.lock(target === 'landscape' ? 'landscape-primary' : 'portrait-primary');
      isOrientLocked = true;
      showToast(target === 'landscape' ? 'Locked: Landscape' : 'Locked: Portrait');
      document.getElementById('btn-lock-orient').querySelector('svg use').setAttribute('href','#i-lock');
    }
  } catch(e) {
    // Fallback: request fullscreen which triggers landscape on iOS
    try {
      if (!document.fullscreenElement) {
        await (playerView.requestFullscreen?.() || playerView.webkitRequestFullscreen?.());
        isOrientLocked = true;
        showToast('Fullscreen / Landscape');
      } else {
        await (document.exitFullscreen?.() || document.webkitExitFullscreen?.());
        isOrientLocked = false;
        showToast('Exited fullscreen');
      }
    } catch(_) {
      showToast('Use device rotation button');
    }
  }
  showCtrl();
}

function unlockOrientation() {
  if (screen.orientation?.unlock) screen.orientation.unlock().catch(()=>{});
  if (document.fullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen)?.call(document).catch(()=>{});
  isOrientLocked = false;
}

/* ─────────────────────────────────────────
   TOUCH GESTURE ENGINE
   Handles: single-tap (toggle ctrl), double/triple/quad tap (seek),
   swipe-H (seek scrub), swipe-V left (brightness), swipe-V right (volume),
   pinch (zoom), long-press (nothing — blocked)
───────────────────────────────────────── */
let tapCount    = 0;
let tapTimer    = null;
let tapSide     = null;  // 'left' | 'right'
let touchStartX = 0, touchStartY = 0;
let touchLastX  = 0, touchLastY  = 0;
let gestureMode = null;  // 'seek'|'volume'|'brightness'|'pinch'|null
let initVolume  = 1;
let initBrightness = 1;
let currentBrightness = 1;
let isTouchMoving = false;
let touchT0     = 0;
let lastTapTime = 0;

videoWrap.addEventListener('touchstart', onTouchStart, {passive:true});
videoWrap.addEventListener('touchmove',  onTouchMove,  {passive:false});
videoWrap.addEventListener('touchend',   onTouchEnd,   {passive:true});
videoWrap.addEventListener('touchcancel',onTouchEnd,   {passive:true});

function onTouchStart(e) {
  // Block if tapping controls / progress / popover
  if (e.target.closest('.ctrl-overlay') && !e.target.closest('.video-wrap')) return;
  if (e.target.closest('.popover')) return;

  if (e.touches.length === 2) {
    gestureMode = 'pinch';
    pinchStartDist  = hypot(e.touches[0], e.touches[1]);
    pinchStartScale = videoScale;
    return;
  }

  isTouchMoving = false;
  touchT0   = Date.now();
  touchStartX = touchLastX = e.touches[0].clientX;
  touchStartY = touchLastY = e.touches[0].clientY;
  initVolume = vid.volume;
  initBrightness = currentBrightness;
  gestureMode = null;
}

function onTouchMove(e) {
  if (e.target.closest('.ctrl-bottom, .sheet-body, #player-bottom-sheet')) return;

  if (e.touches.length === 2 && gestureMode === 'pinch') {
    e.preventDefault();
    const dist = hypot(e.touches[0], e.touches[1]);
    videoScale = Math.max(1, Math.min(4, pinchStartScale * (dist / pinchStartDist)));
    vid.style.transform = `scale(${videoScale})`;
    showGhud('zoom', `Zoom ${videoScale.toFixed(1)}×`, videoScale / 4);
    return;
  }

  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  const adx = Math.abs(dx), ady = Math.abs(dy);

  if (!isTouchMoving && (adx > 10 || ady > 10)) {
    isTouchMoving = true;
    if (adx > ady) gestureMode = 'seek';
    else gestureMode = touchStartX > window.innerWidth / 2 ? 'volume' : 'brightness';
  }

  if (!isTouchMoving) return;
  e.preventDefault();

  if (gestureMode === 'seek') {
    const seekSecs = (dx / window.innerWidth) * 120;
    const newTime  = Math.max(0, Math.min(vid.duration||0, (vid.currentTime||0) + seekSecs));
    const pct = vid.duration ? newTime / vid.duration : 0;
    progFill.style.width = (pct*100)+'%';
    progKnob.style.left  = (pct*100)+'%';
    progCur.textContent  = fmtTime(newTime);
    showGhud('seek', `${seekSecs>=0?'+':''}${seekSecs.toFixed(0)}s`, pct);
    touchStartX = e.touches[0].clientX;  // delta from new start for smooth scroll
  } else if (gestureMode === 'volume') {
    const pct = Math.max(0, Math.min(1, initVolume - (dy / (window.innerHeight * 0.6))));
    vid.volume = pct;
    vid.muted  = pct === 0;
    volIcon.setAttribute('href', pct===0 ? '#i-mute' : '#i-volume');
    showGhud('volume', `Volume ${Math.round(pct*100)}%`, pct);
  } else if (gestureMode === 'brightness') {
    const pct = Math.max(0.1, Math.min(2, initBrightness - (dy / (window.innerHeight * 0.5))));
    currentBrightness = pct;
    vid.style.filter = `brightness(${pct})`;
    showGhud('brightness', `Brightness ${Math.round((pct/2)*100)}%`, pct/2);
  }

  touchLastX = e.touches[0].clientX;
  touchLastY = e.touches[0].clientY;
}

function onTouchEnd(e) {
  // Finish pinch
  if (gestureMode === 'pinch') {
    gestureMode = null;
    hideGhud();
    // Double-tap reset
    return;
  }

  // Commit seek gesture
  if (gestureMode === 'seek' && isTouchMoving) {
    // already updated currentTime live above, just sync
    gestureMode = null; isTouchMoving = false;
    hideGhud(600);
    showCtrl();
    return;
  }

  gestureMode = null;
  if (isTouchMoving) { isTouchMoving=false; hideGhud(600); return; }

  // ─ TAP LOGIC ─
  const now  = Date.now();
  const side = touchStartX < window.innerWidth / 2 ? 'left' : 'right';

  if (tapCount === 0) tapSide = side;

  // If side switches mid-sequence, reset
  if (side !== tapSide) { tapCount = 0; tapSide = side; }

  tapCount++;
  clearTimeout(tapTimer);

  tapTimer = setTimeout(() => {
    const n = tapCount; tapCount = 0;
    if (n === 1) {
      // toggle controls (only if no popover open)
      if (document.querySelector('.popover.show')) { allPopoversClose(); }
      else { toggleCtrl(); }
    } else {
      // multi-tap seek: 2→20s, 3→30s, 4→40s (capped)
      const secs = Math.min(n * 10, 60);
      const dir  = tapSide === 'right' ? 1 : -1;
      seekBy(dir * secs);
      flashSeek(tapSide, dir * secs);
      showCtrl();
    }
  }, 280);
}

function flashSeek(side, secs) {
  const el   = side==='left' ? sfLeft : sfRight;
  const secsEl = side==='left' ? sfLSecs : sfRSecs;
  secsEl.textContent = (secs > 0 ? '+' : '') + secs + 's';
  el.classList.add('show');
  const t = side==='left' ? sfLeftTimer : sfRightTimer;
  clearTimeout(t);
  const newT = setTimeout(() => el.classList.remove('show'), 700);
  if (side==='left') sfLeftTimer=newT; else sfRightTimer=newT;
}

/* pinch distance */
function hypot(t1, t2) {
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

/* ─────────────────────────────────────────
   GESTURE HUD
───────────────────────────────────────── */
function showGhud(type, label, pct) {
  let iconHref = '#i-volume';
  if (type === 'brightness') iconHref = '#i-sun';
  else if (type === 'zoom')  iconHref = '#i-fullscreen';
  else if (type === 'seek')  iconHref = '#i-fforward';
  ghudIcon.setAttribute('href', iconHref);
  ghudLabel.textContent = label;
  ghudFill.style.width  = Math.max(0,Math.min(1,pct))*100 + '%';
  ghud.classList.add('show');
  clearTimeout(ghudTimer);
}

function hideGhud(delay=0) {
  clearTimeout(ghudTimer);
  ghudTimer = setTimeout(() => ghud.classList.remove('show'), delay);
}

/* ─────────────────────────────────────────
   UTILITY
───────────────────────────────────────── */
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ─────────────────────────────────────────
   DISABLE ALL BROWSER NATIVE GESTURES
───────────────────────────────────────── */
// Block context menu
document.addEventListener('contextmenu', e => e.preventDefault());
// Block zoom on double-tap (already done via meta + our tap handler)
document.addEventListener('dblclick',    e => e.preventDefault());
// Block text selection
document.addEventListener('selectstart', e => e.preventDefault());
// Prevent pull-to-refresh
document.addEventListener('touchmove', e => {
  // Only block when in player; allow home scroll
  if (playerView.classList.contains('active')) e.preventDefault();
}, {passive:false});

/* ─────────────────────────────────────────
   BOOT
───────────────────────────────────────── */
loadHome();

</script>
