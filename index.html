<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIKA - PICTURE</title>
    <style>
        /* =========================================
           CSS VARIABLES & GLOBAL RESET (iOS STYLE)
           ========================================= */
        :root {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent-color: #00a826;
            --accent-hover: #007f1b;
            --glass-bg: rgba(28, 28, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --blur: blur(20px);
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: var(--safe-area-bottom);
        }

        /* Scrollbar Hide */
        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        /* SVG Icon Base */
        .icon { width: 24px; height: 24px; fill: currentColor; display: inline-block; vertical-align: middle; }
        .icon-sm { width: 18px; height: 18px; }
        .icon-lg { width: 32px; height: 32px; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-fade { animation: fadeIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
        .animate-slide { animation: slideUp 0.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }

        /* =========================================
           HEADER & SEARCH
           ========================================= */
        header {
            position: fixed;
            top: 0; width: 100%; height: 60px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            transition: background 0.3s;
        }
        header.scrolled { background: var(--bg-secondary); border-bottom: 1px solid var(--glass-border); }
        
        .logo { font-size: 22px; font-weight: 900; color: var(--accent-color); letter-spacing: -0.5px; }
        
        .search-container { position: relative; flex: 1; margin: 0 15px; max-width: 400px; }
        .search-input {
            width: 100%; height: 36px; background: var(--bg-tertiary);
            border: 1px solid var(--glass-border); border-radius: 10px;
            padding: 0 12px 0 36px; color: white; font-size: 15px; outline: none;
            transition: all 0.3s;
        }
        .search-input:focus { border-color: var(--accent-color); background: var(--bg-secondary); }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }

        /* Search Suggestions Dropdown */
        #search-suggestions {
            position: absolute; top: 45px; left: 0; width: 100%;
            background: var(--glass-bg); backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border); border-radius: 12px;
            max-height: 300px; overflow-y: auto; display: none; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 200;
        }
        .suggestion-item {
            display: flex; align-items: center; padding: 10px;
            border-bottom: 1px solid var(--glass-border); cursor: pointer;
            transition: background 0.2s;
        }
        .suggestion-item:hover { background: rgba(255,255,255,0.1); }
        .suggestion-img { width: 35px; height: 50px; border-radius: 6px; object-fit: cover; margin-right: 12px; background: var(--bg-tertiary); }
        .suggestion-title { font-size: 14px; font-weight: 500; }

        /* =========================================
           HOME PAGE UI
           ========================================= */
        #home-view { display: block; }
        
        /* Hero Banner */
        .hero {
            position: relative; height: 60vh; width: 100%;
            background-size: cover; background-position: center;
            display: flex; align-items: flex-end; padding: 20px;
            background-color: var(--bg-secondary);
        }
        .hero::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, var(--bg-primary) 5%, transparent 60%, rgba(0,0,0,0.4) 100%);
            z-index: 1;
        }
        .hero-content { position: relative; z-index: 10; width: 100%; text-align: center; }
        .hero-title { font-size: 32px; font-weight: 800; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .hero-meta { font-size: 13px; color: #ccc; margin-bottom: 15px; display: flex; justify-content: center; gap: 10px; align-items: center; }
        .hero-play-btn {
            background: white; color: black; border: none; padding: 12px 30px;
            border-radius: 30px; font-size: 16px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .hero-play-btn:active { transform: scale(0.95); }

        /* Category Rows */
        .category-container { margin-top: 20px; padding: 0 16px; }
        .category-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .movies-row {
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px;
            scroll-snap-type: x mandatory;
        }
        .movie-card {
            flex: 0 0 110px; scroll-snap-align: start; cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .movie-card:active { transform: scale(0.95); }
        .movie-poster {
            width: 100%; height: 165px; border-radius: 8px; object-fit: cover;
            background: var(--bg-tertiary); box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .movie-title { font-size: 12px; margin-top: 6px; color: #ddd; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Loader */
        .loader-container { display: flex; justify-content: center; padding: 20px; }
        .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent-color); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* =========================================
           CUSTOM VIDEO PLAYER (FULLSCREEN)
           ========================================= */
        #player-view {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: none; flex-direction: column;
            animation: fadeIn 0.3s forwards;
        }
        
        .video-wrapper { position: relative; width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; transition: transform 0.1s; }
        
        /* Player Controls Overlay */
        .player-controls {
            position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent 30%, transparent 70%, rgba(0,0,0,0.8));
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; opacity: 1; transition: opacity 0.3s;
        }
        .player-controls.hidden { opacity: 0; pointer-events: none; }
        
        .top-controls { display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: none; border: none; color: white; cursor: pointer; padding: 10px; }
        .player-title { font-size: 16px; font-weight: 600; color: white; }
        
        .center-controls { display: flex; justify-content: center; align-items: center; gap: 40px; }
        .play-pause-btn { background: rgba(0,0,0,0.5); border: 2px solid white; border-radius: 50%; width: 70px; height: 70px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: white; backdrop-filter: blur(10px); }
        .skip-btn { background: none; border: none; color: white; cursor: pointer; }
        
        .bottom-controls { display: flex; flex-direction: column; gap: 15px; }
        .progress-bar-container { width: 100%; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; cursor: pointer; position: relative; }
        .progress-bar { height: 100%; background: var(--accent-color); width: 0%; border-radius: 2px; position: relative; }
        .progress-knob { width: 12px; height: 12px; background: white; border-radius: 50%; position: absolute; right: -6px; top: -4px; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        
        .action-buttons { display: flex; justify-content: space-between; align-items: center; }
        .action-group { display: flex; gap: 20px; align-items: center; }
        .action-btn { background: none; border: none; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; }
        .action-btn .icon { width: 22px; height: 22px; }
        
        /* Gestures HUD */
        .gesture-hud { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); padding: 15px 25px; border-radius: 15px; color: white; font-size: 20px; font-weight: bold; display: none; flex-direction: column; align-items: center; gap: 10px; }
        
        /* Bottom Sheet (Episodes/Suggestions) */
        .player-bottom-sheet {
            background: var(--bg-secondary); border-radius: 20px 20px 0 0;
            padding: 20px; max-height: 40vh; overflow-y: auto;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .player-bottom-sheet.open { transform: translateY(0); }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sheet-title { font-size: 18px; font-weight: 700; }
        
        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
        .ep-btn { background: var(--bg-tertiary); color: white; border: 1px solid var(--glass-border); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: center; transition: background 0.2s; }
        .ep-btn.active { background: var(--accent-color); border-color: var(--accent-color); }
        
        /* Suggestions List in Player */
        .suggestions-list { display: flex; gap: 10px; overflow-x: auto; }
        .suggestion-card { flex: 0 0 100px; cursor: pointer; }
        .suggestion-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .suggestion-card p { font-size: 12px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    </style>
</head>

    <!-- ==================== HEADER ==================== -->
    <header id="main-header">
        <div class="logo">PIKA PICTURE</div>
        <div class="search-container">
            <svg class="icon icon-sm search-icon"><use href="#i-search"></use></svg>
            <input type="text" class="search-input" id="search-input" placeholder="Search movies, series..." autocomplete="off">
            <!-- Suggestions Dropdown -->

    <!-- ==================== HOME PAGE VIEW ==================== -->
    <main id="home-view">
        <!-- Hero Banner -->
        <div class="hero" id="hero-banner">
            <img id="hero-bg-img" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0;" referrerpolicy="no-referrer" src="" onerror="this.src='https://via.placeholder.com/800x600/101114/00a826?text=PIKA+PICTURE'">

    <!-- ==================== JAVASCRIPT LOGIC ==================== -->
    <script>
        // --- CONFIGURATION ---
        const API_BASE = "https://pika-movie-box.duckdns.org/api";
        const video = document.getElementById('main-video');
        const playerView = document.getElementById('player-view');
        const controls = document.getElementById('player-controls');
        let controlsTimeout;

        // --- HEADER SCROLL EFFECT ---
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (window.scrollY > 50) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        });

        // --- 1. FETCH HOMEPAGE DATA ---
        async function loadHomepage() {
            try {
                const res = await fetch(`${API_BASE}/home`);
                const json = await res.json();
                const data = json.data;
                
                // Render Hero Banner with Auto-Slide
if (data.operatingList) {
    const bannerOp = data.operatingList.find(op => op.type === "BANNER");
    const items = bannerOp?.banner?.items || bannerOp?.subjects || [];
    
    if (items.length > 0) {
        let currentIndex = 0;

        function updateHeroBanner() {
            const item = items[currentIndex];
            const sub = item.subject || item; // Banner data subject ke andar hota hai
            
            let imgUrl = typeof sub.cover === 'string' ? sub.cover : (sub.cover?.url || sub.coverUrl || sub.image || item.cover?.url || '');
            if (!imgUrl) {
                const firstMovie = data.operatingList.find(op => op.subjects && op.subjects.length > 0)?.subjects[0];
                if (firstMovie) imgUrl = firstMovie.cover?.url || firstMovie.image;
            }
            
            if (imgUrl) {
                document.getElementById('hero-bg-img').src = `${API_BASE}/proxy?url=${encodeURIComponent(imgUrl)}`;
            } else {
                document.getElementById('hero-bg-img').src = 'https://via.placeholder.com/800x600/101114/00a826?text=PIKA+PICTURE';
            }

            document.getElementById('hero-title').innerText = sub.title || item.title || "Unknown";
            document.getElementById('hero-meta').innerHTML = `<span>${sub.releaseDate || '2026'}</span> | <span>${sub.genre || 'Action'}</span> | <span>IMDb ${sub.imdbRatingValue || '8.0'}</span>`;
            
            const playBtn = document.querySelector('.hero-play-btn');
            playBtn.onclick = () => fetchMovieDetail(sub.detailPath || item.detailPath, sub.title || item.title);
        }

        updateHeroBanner(); // Initial Load

        // Auto slide every 5 seconds
        setInterval(() => {
            currentIndex = (currentIndex + 1) % items.length;
            updateHeroBanner();
        }, 5000);
    }
}

                // Render Categories
                const catContainer = document.getElementById('home-categories');
                catContainer.innerHTML = "";
                
                data.operatingList.forEach(op => {
                    if (op.subjects && op.subjects.length > 0) {
                        const row = document.createElement('div');
                        row.className = 'category-container animate-fade';
                        
                        let html = `<div class="category-title">${op.title}</div><div class="movies-row">`;
                        
                        op.subjects.forEach(movie => {
                            const detailPath = movie.detailPath || movie.subjectId;
                            html += `
                                <div class="movie-card" onclick="fetchMovieDetail('${detailPath}', '${movie.title}')">
                                    <img src="${API_BASE}/proxy?url=${encodeURIComponent(typeof movie.cover === 'string' ? movie.cover : (movie.cover?.url || movie.image || ''))}" class="movie-poster" loading="lazy" onerror="this.src='https://via.placeholder.com/110x165/1c1c1e/8e8e93?text=No+Img'">
                                    <div class="movie-title">${movie.title}</div>
                                </div>
                            `;
                        });
                        
                        html += `</div>`;
                        row.innerHTML = html;
                        catContainer.appendChild(row);
                    }
                });
                document.getElementById('home-loader').style.display = 'none';
            } catch (err) {
                console.error("Homepage Error:", err);
                document.getElementById('home-loader').innerHTML = "Failed to load data.";
            }
        }

        // --- 2. SEARCH WITH SUGGESTIONS ---
        const searchInput = document.getElementById('search-input');
        const searchSuggestions = document.getElementById('search-suggestions');
        let searchTimeout;

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearTimeout(searchTimeout);
            
            if (query.length < 2) {
                searchSuggestions.style.display = 'none';
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
                    const json = await res.json();
                    const items = json.data?.items || [];

                    searchSuggestions.innerHTML = "";
                    
                    if (items.length === 0) {
                        searchSuggestions.innerHTML = `<div style="padding: 15px; color: #888; text-align: center;">No results found</div>`;
                    } else {
                        items.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerHTML = `
                                <img src="${API_BASE}/proxy?url=${encodeURIComponent(typeof item.cover === 'string' ? item.cover : (item.cover?.url || item.image || ''))}" class="suggestion-img">
                                <div class="suggestion-title">${item.title}</div>
                            `;
                            div.onclick = () => {
                                searchSuggestions.style.display = 'none';
                                searchInput.value = "";
                                fetchMovieDetail(item.detailPath, item.title);
                            };
                            searchSuggestions.appendChild(div);
                        });
                    }
                    searchSuggestions.style.display = 'flex';
                } catch (err) {
                    console.error("Search Error:", err);
                }
            }, 400); // Debounce
        });

        // Close suggestions on outside click
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchSuggestions.contains(e.target)) {
                searchSuggestions.style.display = 'none';
            }
        });

        // --- 3. FETCH MOVIE DETAILS & OPEN PLAYER ---
async function fetchMovieDetail(detailPath, title) {
    playerView.style.display = 'flex';
    document.getElementById('player-title').innerText = title;
    
    try {
        const res = await fetch(`${API_BASE}/detail?detailPath=${detailPath}`);
        const json = await res.json();
        const data = json.data;
        
        let isSeries = false;
        let firstSeason = 1;
        if (data && data.resource && data.resource.seasons && data.resource.seasons.length > 0) {
            // Check karein ke koi asli season (se > 0) mojood hai ya nahi
            const validSeason = data.resource.seasons.find(s => s.se > 0);
            if (validSeason) {
                isSeries = true;
                firstSeason = validSeason.se;
            }
        }

        if (isSeries) {
            renderEpisodes(data.resource.seasons, data.subject.subjectId, detailPath);
            playEpisode(data.subject.subjectId, firstSeason, 1, detailPath, '/tv-series/detail');
            document.getElementById('sheet-title').innerText = "Seasons & Episodes";
            toggleBottomSheet();
        } else if (data && data.subject) {
            document.getElementById('episodes-container').innerHTML = "<div style='color:#888;padding:20px;text-align:center;'>This is a Movie. Enjoy!</div>";
            document.getElementById('sheet-title').innerText = "Movie Info";
            toggleBottomSheet();
            playEpisode(data.subject.subjectId, 0, 0, detailPath, '/movie/detail');
        } else {
            alert("Detail API Error: " + JSON.stringify(json).substring(0, 150));
        }
    } catch (err) {
        console.error("Detail Error:", err);
        alert("Detail Fetch Error. CORS issue.");
        closePlayerView();
    }
}

        // --- 4. RENDER EPISODES ---
        function renderEpisodes(seasons, subjectId, detailPath) {
            const epContainer = document.getElementById('episodes-container');
            epContainer.innerHTML = "";
            
            seasons.forEach(season => {
                const seHead = document.createElement('div');
                seHead.style.gridColumn = "1 / -1";
                seHead.style.marginTop = "10px";
                seHead.style.fontWeight = "bold";
                seHead.style.color = "var(--accent-color)";
                seHead.innerText = `Season ${season.se}`;
                epContainer.appendChild(seHead);

                for (let i = 1; i <= season.maxEp; i++) {
                    const btn = document.createElement('div');
                    btn.className = 'ep-btn';
                    btn.innerText = `EP ${i}`;
                    btn.onclick = () => {
                        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        playEpisode(subjectId, season.se, i, detailPath);
                    };
                    epContainer.appendChild(btn);
                }
            });
        }

        // --- 5. PLAY EPISODE (FETCH STREAM) ---
async function playEpisode(subjectId, se, ep, detailPath, mediaType) {
    try {
        const safeSe = parseInt(se) || 0;
        const safeEp = parseInt(ep) || 0;
        
        // Agar mediaType pass hua hai toh wohi use karein
        let typeStr = mediaType || ((safeSe > 0 || safeEp > 0) ? '/tv-series/detail' : '/movie/detail');

        const res = await fetch(`${API_BASE}/play?subjectId=${subjectId}&se=${safeSe}&ep=${safeEp}&detailPath=${detailPath}&type=${encodeURIComponent(typeStr)}`);
        const json = await res.json();
        
        // Agar streams nahi mile
        if (!json.data || !json.data.streams || json.data.streams.length === 0) {
            alert("Video not available. (Server: " + (json.data?.hasResource ? "Has resource but no streams" : "No resource found") + ")");
            return;
        }

        const streams = json.data.streams;
        // Sort by resolution to get 1080p
        streams.sort((a, b) => parseInt(b.resolutions) - parseInt(a.resolutions));
        const bestStream = streams[0];
        
        video.src = `${API_BASE}/proxy?url=${encodeURIComponent(bestStream.url)}`;
video.play().catch(e => { console.log("Play Error:", e); });
        updatePlayIcon(true);
        
        if (json.data?.captions && json.data.captions.length > 0) {
            document.getElementById('subtitle-track').src = json.data.captions[0].url;
        }
    } catch (err) {
        console.error("Play Error:", err);
        alert("Network Error: " + err.message);
    }
}

        // --- 6. CUSTOM PLAYER CONTROLS & GESTURES ---
        
        function showControls() {
            controls.classList.remove('hidden');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (!video.paused) controls.classList.add('hidden');
            }, 3000);
        }

        function togglePlay() {
            if (video.paused) {
                video.play();
                updatePlayIcon(true);
            } else {
                video.pause();
                updatePlayIcon(false);
            }
            showControls();
        }

        function updatePlayIcon(isPlaying) {
            const iconUse = document.getElementById('play-icon');
            iconUse.setAttribute('href', isPlaying ? '#i-pause' : '#i-play');
        }

        function seekVideo(seconds) {
            video.currentTime += seconds;
            showControls();
        }

        video.addEventListener('timeupdate', () => {
            const percent = (video.currentTime / video.duration) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('time-display').innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        });

        function formatTime(secs) {
            if (isNaN(secs)) return "00:00";
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function seekTo(e) {
            const bar = document.getElementById('progress-container');
            const rect = bar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            video.currentTime = percent * video.duration;
            showControls();
        }

        function toggleMute() {
            video.muted = !video.muted;
            document.getElementById('volume-icon').setAttribute('href', video.muted ? '#i-mute' : '#i-volume');
            showControls();
        }

        function toggleSubtitles() {
            const track = video.textTracks[0];
            if (track) {
                track.mode = track.mode === 'showing' ? 'hidden' : 'showing';
            }
            showControls();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                playerView.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
            showControls();
        }

        function downloadVideo() {
            if (video.src) {
                const a = document.createElement('a');
                a.href = video.src;
                a.download = "PIKA_PICTURE_Video.mp4";
                a.target = "_blank";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        function toggleBottomSheet() {
            const sheet = document.getElementById('player-bottom-sheet');
            sheet.classList.toggle('open');
            showControls();
        }

        function closePlayerView() {
            playerView.style.display = 'none';
            video.pause();
            video.src = "";
        }

        // --- 7. GESTURE CONTROLS (Touch) ---
        const gestureArea = document.getElementById('gesture-area');
        const hud = document.getElementById('gesture-hud');
        const hudText = document.getElementById('gesture-text');
        
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;
        let initialVolume = 1;

        gestureArea.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isSwiping = false;
            initialVolume = video.volume;
            
            controlsTimeout = setTimeout(() => {
                if (!isSwiping) togglePlay();
            }, 250);
        });

        gestureArea.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) return;
            
            const deltaX = e.touches[0].clientX - touchStartX;
            const deltaY = e.touches[0].clientY - touchStartY;
            
            if (Math.abs(deltaX) > 20 || Math.abs(deltaY) > 20) {
                isSwiping = true;
                clearTimeout(controlsTimeout);
                hud.style.display = 'flex';
                
                const screenWidth = window.innerWidth;
                
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    // Horizontal Swipe (Seek)
                    hud.innerHTML = `<svg class="icon icon-lg"><use href="#i-forward"></use></svg>`;
                    const seekAmount = (deltaX / screenWidth) * 120;
                    hudText.innerText = `${seekAmount > 0 ? '+' : ''}${Math.round(seekAmount)}s`;
                    
                    if (Math.abs(deltaX) > 100) {
                        video.currentTime += seekAmount;
                        touchStartX = e.touches[0].clientX;
                    }
                } else {
                    // Vertical Swipe (Volume/Brightness)
                    const deltaYPercent = (touchStartY - e.touches[0].clientY) / screenWidth;
                    const isRightSide = touchStartX > screenWidth / 2;
                    
                    if (isRightSide) {
                        let newVol = Math.min(1, Math.max(0, initialVolume + deltaYPercent * 2));
                        video.volume = newVol;
                        hud.innerHTML = `<svg class="icon icon-lg"><use href="${newVol > 0 ? '#i-volume' : '#i-mute'}"></use></svg>`;
                        hudText.innerText = `Volume ${Math.round(newVol * 100)}%`;
                    } else {
                        let newBright = Math.min(1.5, Math.max(0.2, 1 + deltaYPercent * 2));
                        video.style.filter = `brightness(${newBright})`;
                        hud.innerHTML = `<svg class="icon icon-lg"><use href="#i-settings"></use></svg>`;
                        hudText.innerText = `Brightness ${Math.round(newBright * 100)}%`;
                    }
                }
            }
        });

        gestureArea.addEventListener('touchend', () => {
            clearTimeout(controlsTimeout);
            setTimeout(() => { hud.style.display = 'none'; }, 500);
            showControls();
        });

        let lastTap = 0;
        gestureArea.addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0 && !isSwiping) {
                toggleFullscreen();
            }
            lastTap = currentTime;
        });

        // Initialize App
        loadHomepage();

    </script>
